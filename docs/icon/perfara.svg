<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#16203A"/>
      <stop offset="0.55" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#05070E"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.46" r="0.46">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="300" y1="800" x2="740" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="bolt" x1="430" y1="740" x2="640" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DF9FF"/>
      <stop offset="0.55" stop-color="#DDFCFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="boltGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="0" y="0" width="1024" height="1024" rx="232"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect width="1024" height="1024" fill="url(#tile)"/>
    <rect width="1024" height="1024" fill="url(#aura)"/>
    <path d="M-160 150 L520 -180 L800 0 L20 340 Z" fill="#FFFFFF" opacity="0.035"/>
  </g>

  <rect x="3" y="3" width="1018" height="1018" rx="230" fill="none" stroke="url(#edge)" stroke-width="6"/>

  <path d="M328 774 A320 320 0 1 1 696 774" fill="none" stroke="url(#ring)"
        stroke-width="72" stroke-linecap="round" opacity="0.45" filter="url(#soft)"/>
  <path d="M328 774 A320 320 0 1 1 696 774" fill="none" stroke="url(#ring)"
        stroke-width="72" stroke-linecap="round"/>

  <polygon points="594,262 410,544 500,544 455,752 648,466 548,466" fill="#22D3EE"
           opacity="0.55" filter="url(#boltGlow)"/>
  <polygon points="594,262 410,544 500,544 455,752 648,466 548,466" fill="url(#bolt)"
           stroke="#CFFBFF" stroke-width="6" stroke-linejoin="round" stroke-opacity="0.55"/>
</svg>
