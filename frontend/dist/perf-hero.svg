<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="45%" style="stop-color:#0d1f3d"/>
      <stop offset="100%" style="stop-color:#070b14"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="phone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0f1729;stop-opacity:0.95"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1600" height="420" fill="url(#bg)"/>
  <ellipse cx="1280" cy="80" rx="320" ry="180" fill="url(#glow)" filter="url(#blur)" opacity="0.85"/>
  <ellipse cx="200" cy="340" rx="280" ry="160" fill="#2563eb" opacity="0.08" filter="url(#blur)"/>
  <!-- abstract chart lines -->
  <path d="M100 280 Q400 200 700 240 T1300 180 L1300 420 L100 420 Z" fill="url(#glow)" opacity="0.15"/>
  <polyline points="120,300 280,260 450,290 620,220 800,250 1000,200 1180,230 1380,190" fill="none" stroke="#60a5fa" stroke-width="2.5" opacity="0.45"/>
  <polyline points="120,320 300,300 480,310 700,270 920,285 1150,250 1450,260" fill="none" stroke="#a78bfa" stroke-width="1.8" opacity="0.35"/>
  <!-- phone silhouette -->
  <rect x="1080" y="88" width="200" height="360" rx="28" fill="url(#phone)" stroke="rgba(148,180,255,0.25)" stroke-width="2"/>
  <rect x="1100" y="115" width="160" height="280" rx="6" fill="#050a14" opacity="0.85"/>
  <rect x="1168" y="405" width="24" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
  <!-- subtle grid -->
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <line x1="0" y1="105" x2="1600" y2="105"/>
    <line x1="0" y1="210" x2="1600" y2="210"/>
    <line x1="0" y1="315" x2="1600" y2="315"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
  </g>
</svg>
