<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfara离线版 · 性能报告</title>
  <!-- echarts：异步加载，不阻塞首屏解析（卡片/表格/解读先出来，图表后补）。
       顺序：同目录本地文件（离线可用）→ CDN → 空实现兜底，保证表格照常渲染。
       图表初始化在 ChartManager.init() 里 await window.echartsReady()。 -->
  <script>
    window.echartsReady = (function () {
      let p = null;
      function loadOne(src) {
        return new Promise(function (resolve) {
          const s = document.createElement('script');
          s.src = src;
          s.async = true;
          s.onload = function () { resolve(typeof echarts !== 'undefined'); };
          s.onerror = function () { resolve(false); };
          document.head.appendChild(s);
        });
      }
      return function () {
        if (p) return p;
        p = (async function () {
          if (typeof echarts !== 'undefined') return true;
          if (await loadOne('echarts.min.js')) return true;
          if (await loadOne('https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js')) return true;
          window.echarts = {
            init: function () {
              return {
                setOption: function () {}, resize: function () {}, dispose: function () {},
                on: function () {}, off: function () {}, getDom: function () { return null; },
                getZr: function () { return { on: function () {} }; }
              };
            },
            connect: function () {},
            registerTheme: function () {}
          };
          console.warn('[perf] echarts 未加载：图表区域留空，数据表照常显示');
          return false;
        })();
        return p;
      };
    })();
  </script>
  <style>
/* ===== Inlined from html-template2/style.css (keep visual identical) ===== */
/* ═══ Reset & Base ══════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f1117;
  --bg2: #161922;
  --bg3: #1e2230;
  --border: #2a2f3d;
  --text: #e0e4ef;
  --text2: #8a90a0;
  --accent: #4f8ef7;
  --green: #3ecf8e;
  --red: #f85151;
  --orange: #f5a623;
  --yellow: #f5d020;
  --radius: 8px;
  --font: 'Segoe UI', system-ui, sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* Ensure inner app participates in flex for scroll */
#root{
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

/* ═══ Scrollbar ═════════════════════════════════════════════════════════════ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ═══ Top Bar ═══════════════════════════════════════════════════════════════ */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 8px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.logo-icon {
  font-size: 16px;
  color: var(--accent);
}

.topbar-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  flex-wrap: wrap;
}

.control-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.control-group label {
  color: var(--text2);
  white-space: nowrap;
  font-size: 12px;
}

.control-text {
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

select, input[type="text"] {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 12px;
  outline: none;
}

select { cursor: pointer; min-width: 180px; }
input[type="text"] { width: 160px; }

.sel-app-select {
  min-width: 220px;
  width: min(320px, 36vw);
}

select:focus, input:focus { border-color: var(--accent); }

.topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
  white-space: nowrap;
}

.elapsed {
  color: var(--text2);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  min-width: 60px;
}

/* ═══ Buttons ═══════════════════════════════════════════════════════════════ */
.btn {
  border: none;
  border-radius: 4px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, background 0.15s;
  white-space: nowrap;
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:not(:disabled):hover { opacity: 0.85; }
.btn-sm  { padding: 4px 8px; background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-danger  { background: var(--red); color: #fff; }
.btn-export  { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }

/* ═══ Badge ═════════════════════════════════════════════════════════════════ */
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}
.badge.idle     { background: var(--bg3); color: var(--text2); }
.badge.info     { background: var(--accent); color: #fff; }

/* 设备信息条 */
.device-info-strip {
  padding: 6px 16px;
  font-size: 12px;
  line-height: 1.45;
  color: var(--text2);
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.device-info-strip[hidden] { display: none !important; }
.device-info-strip-inner {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.device-info-text { flex: 1; min-width: 0; }

/* ═══ Stat Cards ════════════════════════════════════════════════════════════ */
.cards {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 6px 16px;
  flex-shrink: 0;
}
.card {
  flex: 1 1 90px;
  min-width: 90px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: border-color 0.2s;
}
.card-label { font-size: 11px; color: var(--text2); }
.card-value {
  font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1;
  color: var(--card-color, var(--text));
}
.card-unit  { font-size: 10px; color: var(--text2); }

/* Card color states (android cards ids) */
#card-cpu     { --card-color: #4f8ef7; }
#card-proccpu { --card-color: #79d4f7; }
#card-mem     { --card-color: #3ecf8e; }
#card-fps     { --card-color: #f5d020; }
#card-jank    { --card-color: #f5a623; }
#card-bigjank { --card-color: #f85151; }
#card-net     { --card-color: #c77dff; }
#card-gpu     { --card-color: #f5a623; }
#card-battery { --card-color: #3ecf8e; }
#card-temp    { --card-color: #f85151; }

/* 阈值着色：JS 在 card 上写 --card-color（内联优先级高于上面的 id 规则） */
.card[data-state="good"] { border-color: rgba(62,207,142,.38); }
.card[data-state="warn"] { border-color: rgba(245,166,35,.40); }
.card[data-state="bad"]  { border-color: rgba(248,81,81,.45); }

/* ═══ Charts Grid ═══════════════════════════════════════════════════════════ */
.charts-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 0 16px 8px;
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}
.chart-wrap {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  position: relative;
  height: 230px;
}
.chart-title {
  padding: 6px 12px 0;
  font-size: 11px;
  color: var(--text2);
  font-weight: 600;
  flex-shrink: 0;
}
.chart { flex: 1; min-height: 0; }
/* 该指标本次无数据时的提示（如机型不提供 GPU 使用率） */
.chart-empty-tip {
  position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%);
  font-size: 12px; line-height: 1.5; color: var(--text2);
  background: rgba(10, 14, 22, 0.72); border: 1px solid var(--border);
  padding: 6px 12px; border-radius: 8px; pointer-events: none; z-index: 5;
  white-space: nowrap;
}

/* Stats tables */
.stats-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding: 8px 12px 0;
  flex-shrink:0;
}
.stats-head .chart-title{ padding:0; }
.stats-actions{ display:flex; gap:8px; align-items:center; }
.stats-body{ padding: 8px 12px 12px; overflow:auto; }
.stats-table{
  width:100%;
  border-collapse: collapse;
  font-size: 12px;
}
.stats-table th, .stats-table td{
  border-bottom: 1px solid var(--border);
  padding: 6px 8px;
  text-align:left;
}
.stats-table th{
  color: var(--text2);
  font-weight: 600;
}
.stats-table td:nth-child(n+2), .stats-table th:nth-child(n+2){
  text-align:right;
  font-variant-numeric: tabular-nums;
}
.chart-wrap.stats{
  height: auto;
}

/* Hide log panel in static report (keep layout clean) */
.log-panel { display:none !important; }

/* hidden 属性优先于 flex/grid 布局（否则 .chart-wrap 的 display:flex 会盖掉它） */
[hidden] { display: none !important; }

/* 顶部「测试类型 / 包名」在概要条里已有，去掉重复信息 */
.topbar-controls .control-group:not(.btns) { display: none; }

/* Static: disable selectors while keeping appearance */
select[disabled] { opacity: 0.85; cursor: default; }
  
/* ═══ 解读总结 ══════════════════════════════════════════════════════════════ */
.insight {
  margin: 2px 16px 10px;
  padding: 12px 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  flex-shrink: 0;
}
.insight-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 8px;
}
.insight-title { font-size: 13px; font-weight: 600; letter-spacing: .3px; }
.insight-sub { font-size: 11px; color: var(--text2); margin-left: auto; font-variant-numeric: tabular-nums; }
.insight-badge {
  font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 10px;
  border: 1px solid transparent; white-space: nowrap;
}
.insight-badge--great { color: var(--green);  border-color: #2a6b4f; background: rgba(62,207,142,.10); }
.insight-badge--good  { color: var(--accent); border-color: #2f4d7a; background: rgba(79,142,247,.10); }
.insight-badge--warn  { color: var(--orange); border-color: #6b4d1f; background: rgba(245,166,35,.10); }
.insight-badge--bad   { color: var(--red);    border-color: #6b2a2a; background: rgba(248,81,81,.10); }
.insight-lead { font-size: 12.5px; line-height: 1.75; color: var(--text); margin-bottom: 9px; }
.insight-lead b { font-weight: 600; }
.insight-list {
  list-style: none;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 3px 20px;
}
.insight-list li { font-size: 12px; line-height: 1.7; color: var(--text2); }
.insight-list li b { color: var(--text); font-weight: 500; margin-right: 6px; }
/* 每条解读前的状态点：扫读时先看颜色再读字 */
.insight-dot {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  margin-right: 7px; vertical-align: 1px; background: var(--text2);
}
.insight-dot--good { background: var(--green); }
.insight-dot--warn { background: var(--orange); }
.insight-dot--bad  { background: var(--red); }
.insight-dot--info { background: var(--accent); }
/* 概要行里的「已排除加载段」标记 */
.insight-sub .sub-cut { color: var(--orange); }
/* 正常项不再标绿：满屏绿色会让真正的问题（橙/红）淹掉，状态交给左侧色点表达 */
.insight-note--good { color: var(--text2); }
.insight-note--warn { color: var(--orange); }
.insight-note--bad  { color: var(--red); }
.insight-note--info { color: var(--text2); }
.insight-risks {
  margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--border);
  display: flex; flex-direction: column; gap: 4px;
}
.insight-risk { font-size: 12px; line-height: 1.6; }
.insight-risk--high { color: var(--red); }
.insight-risk--mid  { color: var(--orange); }
.insight-risk--info { color: var(--text2); }

/* ═══ 报告概要条（设备 / 应用 / 平台 / 采样 / 时间） ═══════════════════════ */
.report-meta {
  display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
  width: 100%;
}
.rm-main { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex-wrap: wrap; }
.rm-device { font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: .2px; }
.rm-app {
  font-size: 12px; color: var(--text2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46vw;
}
.rm-chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.rm-chip {
  font-size: 11px; line-height: 18px; color: var(--text);
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 5px; padding: 1px 8px; font-variant-numeric: tabular-nums;
}
.rm-chip i { font-style: normal; color: var(--text2); margin-right: 5px; }
.rm-chip--plat { border-color: #2f4d7a; color: var(--accent); }
.rm-sub {
  width: 100%; margin-top: 2px;
  font-size: 11px; color: var(--text2); line-height: 1.5;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ═══ 分区标题 ══════════════════════════════════════════════════════════════ */
.section-label {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px 4px; flex-shrink: 0;
  font-size: 12px; font-weight: 600; color: var(--text); letter-spacing: .3px;
}
.section-label .hint { font-weight: 400; font-size: 11px; color: var(--text2); }
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ═══ 统计表：单位后缀 + 明细折叠 ══════════════════════════════════════════ */
.metric-unit {
  margin-left: 5px; font-size: 10px; color: var(--text2); font-weight: 400;
}
.stats-toggle td { padding: 4px 8px 6px; border-bottom: none; }
.stats-toggle button {
  width: 100%; text-align: left;
  background: transparent; border: 1px dashed var(--border); border-radius: 6px;
  color: var(--text2); font-size: 11px; font-family: inherit;
  padding: 4px 9px; cursor: pointer;
  transition: color .15s, border-color .15s;
}
.stats-toggle button:hover { color: var(--accent); border-color: var(--accent); }
.stats-detail-row td { color: var(--text2); background: rgba(255,255,255,.012); }
.stats-detail-row td:first-child { padding-left: 18px; }


/* ═══ 参数说明「!」标记（(__METRIC_INFO_V1__)) ═══════════════════════════════ */
.info-dot {
  display: inline-flex; align-items: center; justify-content: center;
  width: 13px; height: 13px; margin-left: 4px; flex: none;
  border: 1px solid var(--border); border-radius: 50%;
  background: var(--bg3); color: var(--text2);
  font: 700 9px/1 var(--font); font-style: normal;
  vertical-align: middle; cursor: help; opacity: .55;
  transition: opacity .15s ease, color .15s ease, border-color .15s ease;
  user-select: none; -webkit-user-select: none;
}
.info-dot:hover, .info-dot:focus {
  opacity: 1; color: var(--accent); border-color: var(--accent); outline: none;
}
.kpi-label .info-dot, .card-label .info-dot { width: 12px; height: 12px; margin-left: 3px; }
.kpis-extra .info-dot { width: 11px; height: 11px; }
.mi-mask {
  position: fixed; inset: 0; z-index: 9999; padding: 20px;
  background: rgba(0, 0, 0, .55);
  display: flex; align-items: center; justify-content: center;
}
.mi-mask[hidden] { display: none; }
.mi-modal {
  width: 100%; max-width: 560px; max-height: 82vh; overflow: auto;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: 0 14px 44px rgba(0, 0, 0, .5);
  animation: mi-pop .16s ease-out;
}
@keyframes mi-pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.mi-head {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px; border-bottom: 1px solid var(--border);
}
.mi-title { flex: 1; font-size: 14px; font-weight: 600; color: var(--text); }
.mi-unit { margin-left: 6px; font-size: 11px; font-weight: 400; color: var(--text2); }
.mi-close {
  border: none; background: transparent; color: var(--text2);
  font-size: 14px; line-height: 1; padding: 3px 6px; border-radius: 4px; cursor: pointer;
}
.mi-close:hover { color: var(--text); background: var(--bg3); }
.mi-body { padding: 12px 14px 14px; }
.mi-row { margin-bottom: 10px; }
.mi-row:last-child { margin-bottom: 0; }
.mi-row > i {
  display: block; margin-bottom: 3px;
  font-size: 11px; font-style: normal; font-weight: 600; color: var(--accent);
}
.mi-row > p { font-size: 12px; line-height: 1.8; color: var(--text2); }
/* ═══ 可读性优化 __READABILITY_V1__ begin ══════════════════════════════ */
:root {
  /* 次要文字整体提亮：标签 / 单位 / 说明文字更容易看清（对比度约 5.9:1） */
  --text2: #9ba3b4;
}

/* ── 分区标题：主色竖条 + 更大字号，层级更清楚 ────────────────────────── */
.section-label { font-size: 12.5px; padding: 10px 16px 5px; }
.section-label::before {
  content: ''; display: inline-block; flex: none;
  width: 3px; height: 13px; border-radius: 2px; background: var(--accent);
}

/* ── 顶部概要条 ────────────────────────────────────────────────────────── */
.rm-device { font-size: 15px; }
.rm-app { font-size: 12.5px; }
.rm-chip { font-size: 11.5px; line-height: 19px; }
.rm-sub { white-space: normal; line-height: 1.55; }

/* ── 指标卡：等宽网格 + 字号层次 + 悬停反馈 ───────────────────────────── */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(106px, 1fr));
  gap: 8px;
  padding: 8px 16px 10px;
}
.card { padding: 12px 10px; gap: 4px; }
.card:hover { border-color: #3b4354; }
.card-label { font-size: 12px; font-weight: 500; }
.card-value { font-size: 24px; letter-spacing: -.2px; }
.card-unit  { font-size: 11px; }

/* ── 图表：标题更醒目、图区更舒展 ─────────────────────────────────────── */
.charts-grid { gap: 12px; padding: 0 16px 12px; }
.chart-wrap { height: 250px; }
.chart-wrap:hover { border-color: #333a4a; }
.chart-wrap.stats { height: auto; }          /* 统计表保持自适应高度 */
.chart-title { padding: 9px 12px 0; font-size: 12.5px; color: var(--text); letter-spacing: .2px; }

/* ── 统计表：表头吸顶 + 斑马纹 + 行悬停 ───────────────────────────────── */
.stats-head { padding-top: 10px; }
/* 让统计表跟随主滚动条滚动（stats-body 不再自成滚动容器），表头才能相对图表区吸顶 */
.chart-wrap.stats .stats-body { padding: 6px 12px 12px; overflow: visible; }
.stats-table { font-size: 12.5px; }
.stats-table thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--bg2); font-size: 12px;
  box-shadow: inset 0 -1px 0 var(--border);
}
.stats-table th, .stats-table td { padding: 7px 8px; }
.stats-table tbody tr:nth-child(even) td { background: rgba(255,255,255,.022); }
.stats-table tbody tr:hover td { background: rgba(79,142,247,.10); }
.stats-detail-row td { background: rgba(255,255,255,.022); }
.metric-unit { font-size: 11px; }
/* 派生指标的副标注（例：Jank 行上的「32.4 次/10min」） */
.metric-sub {
  display: block; margin-top: 2px;
  font-size: 10.5px; color: var(--text2); opacity: .85;
}
.stats-toggle button { font-size: 11.5px; padding: 5px 9px; }

/* ── 解读总结：风险项色条化，便于纵向扫读 ─────────────────────────────── */
.insight { padding: 14px 16px; margin: 4px 16px 12px; }
.insight-head { margin-bottom: 10px; }
.insight-title { font-size: 13.5px; }
.insight-lead { font-size: 13px; line-height: 1.8; margin-bottom: 11px; }
.insight-list { gap: 4px 26px; }
.insight-list li { font-size: 12.5px; line-height: 1.85; }
.insight-risks { margin-top: 12px; padding-top: 11px; gap: 6px; }
.insight-risk {
  line-height: 1.75; padding: 4px 10px;
  border-left: 2px solid currentColor; border-radius: 0 4px 4px 0;
  background: rgba(255,255,255,.032);
}
/* ═══ 可读性优化 __READABILITY_V1__ end ════════════════════════════════ */
/* ═══ 整页滚动 __SCROLL_V1__ begin ══════════════════════════════════════
   原来 body 锁定 100vh + overflow:hidden，只有 .charts-grid 内部可滚，
   鼠标悬在指标卡 / 解读总结上滚轮无效。改为整页自然滚动，顶栏吸顶。 */
html, body { height: auto; min-height: 100vh; overflow: visible; }
body { overflow-x: hidden; }
.charts-grid { flex: none; overflow: visible; }
.topbar { position: sticky; top: 0; z-index: 30; }
/* 统计表表头改为相对整页吸顶（topbar 高度 ≈ 37px） */
.stats-table thead th { top: 37px; }
/* ═══ 整页滚动 __SCROLL_V1__ end ════════════════════════════════════════ */

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function keyOf(name) {
    if (!name) return '';
    var k = ALIAS[String(name).trim()];
    if (k) return k;
    if (INFO[String(name).trim()]) return String(name).trim();
    return '';
  }

  /** 给带 data-info 的容器补上「!」标记（幂等，可重复调用） */
  function decorate(root) {
    var scope = root && root.querySelectorAll ? root : document;
    var host = (scope === document || !scope.querySelectorAll) ? scope : scope;
    var list = host.querySelectorAll('[data-info]');
    for (var i = 0; i < list.length; i++) {
      var el = list[i];
      if (el.getAttribute('data-info') === '') continue;
      if (el.querySelector('.info-dot')) continue;
      if (el.tagName === 'TBODY' || el.tagName === 'TABLE') continue;
      var key = keyOf(el.getAttribute('data-info'));
      if (!key || !INFO[key]) continue;
      var dot = document.createElement('span');
      dot.className = 'info-dot';
      dot.setAttribute('data-info', key);
      dot.setAttribute('role', 'button');
      dot.setAttribute('tabindex', '0');
      dot.title = '查看参数说明';
      dot.textContent = '!';
      // 副标注（.metric-sub）是 block，若把「!」追加到末尾会独占一行，行高多一行。
      // 统计表的指标名单元格改为插在副标注之前，让「!」跟在名字后面。
      var sub = el.querySelector('.metric-sub');
      if (sub) el.insertBefore(dot, sub); else el.appendChild(dot);
    }
  }

  /** 把某个指标名改成「!」标记的属性串，供 innerHTML 拼接使用 */
  function attr(name) {
    var k = keyOf(name);
    return k ? ' data-info="' + esc(k) + '"' : '';
  }

  var mask = null;
  function ensureModal() {
    if (mask) return mask;
    mask = document.createElement('div');
    mask.className = 'mi-mask';
    mask.hidden = true;
    mask.innerHTML =
      '<div class="mi-modal" role="dialog" aria-modal="true">' +
        '<div class="mi-head"><span class="mi-title"></span>' +
        '<button type="button" class="mi-close" aria-label="关闭">✕</button></div>' +
        '<div class="mi-body"></div>' +
      '</div>';
    document.body.appendChild(mask);
    mask.addEventListener('click', function (e) {
      if (e.target === mask || (e.target.closest && e.target.closest('.mi-close'))) hide();
    });
    return mask;
  }

  function row(label, text) {
    return text ? '<div class="mi-row"><i>' + esc(label) + '</i><p>' + esc(text) + '</p></div>' : '';
  }

  function show(key) {
    var info = INFO[key];
    if (!info) return;
    var box = ensureModal();
    box.querySelector('.mi-title').innerHTML = esc(info.t) + (info.u ? '<span class="mi-unit">' + esc(info.u) + '</span>' : '');
    box.querySelector('.mi-body').innerHTML =
      row('是什么', info.d) + row('来源与算法', info.h) + row('怎么看', info.g);
    box.hidden = false;
  }

  function hide() { if (mask) mask.hidden = true; }

  window.MetricInfo = {
    version: '__METRIC_INFO_V1__',
    has: function (k) { return !!INFO[k]; },
    keyOf: keyOf,
    attr: attr,
    decorate: decorate,
    open: show,
    close: hide,
  };

  // 点击「!」弹说明：捕获阶段处理，避免触发报告卡片本身的点击（如勾选、展开）
  document.addEventListener('click', function (e) {
    var dot = e.target && e.target.closest ? e.target.closest('.info-dot') : null;
    if (!dot) return;
    e.preventDefault();
    e.stopPropagation();
    show(dot.getAttribute('data-info'));
  }, true);
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Escape' || e.key === 'Esc') && mask && !mask.hidden) hide();
    if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.classList && e.target.classList.contains('info-dot')) {
      e.preventDefault(); e.stopPropagation();
      show(e.target.getAttribute('data-info'));
    }
  }, true);
})();

  <!-- external: 全局 data；默认读同目录 data.js（最近一次采集）。

  <script>

      var m = /[?&]r=([^&]+)/.exec(location.search);
      var src = 'data.js';
      if (m) {
        var id = decodeURIComponent(m[1]).replace(/[^A-Za-z0-9_\-]/g, '');
        if (id) src = 'history/' + id + '.js';
      }
      document.write('<script src="' + src + '"><\/script>');
    })();
  </script>

  // --- unit conversion rules (per your spec) ---
  const KB = 1024;
  const MB_BYTES = 1024 * 1024;
  /**
   * 内存单位自适应。
   * 本地采集器写入的 totalPss 已经是 MB（见 adb.js: parseInt(KB)/1024）；
   * 早期服务端上报的数据是 KB。以整份报告的最大 totalPss 判断：
   * 真实应用 PSS 用 KB 表示时必然远大于 10000，用 MB 表示时通常远小于该值。
   */
  let _MEM_DIV = null;
  function memDivisor() {
    if (_MEM_DIV != null) return _MEM_DIV;
    const rows = (typeof data !== 'undefined' && data && Array.isArray(data.perf)) ? data.perf : [];
    let mx = 0;
    for (const r of rows) {
      const v = r && r.mem && r.mem.totalPss;
      if (typeof v === 'number' && v > mx) mx = v;
    }
    _MEM_DIV = mx > 10000 ? KB : 1;
    return _MEM_DIV;
  }
  function a_mem(v){ return (typeof v === 'number' && !isNaN(v)) ? (v / memDivisor()) : null; }
  function a_temp(v){ if(typeof v!=='number'||isNaN(v)) return null; if(v>=200&&v<=900&&Number.isInteger(v)) return v/10; return v; }
  /** 整机温度：优先采集到的 thermal 值；为 0/缺失时回退电池温度（老数据也能出值） */
  function pickTemp(thermalRaw, batteryRaw){
    const t = a_temp(thermalRaw);
    if (t != null && t > 0) return t;
    const b = a_temp(batteryRaw);
    return (b != null && b > 0) ? b : t;
  }
  /**
   * 电流归一化为 mA，并保留符号（负 = 充电）。
   * 采集端自 v2026.10 起统一输出 mA（CSV 列名 currentNow_mA、客户端图表同口径），
   * 老报告里可能仍是 µA（典型值几十万）。旧实现无条件 /1000，会把新报告的
   * 500mA 显示成 0.5mA，整整小 1000 倍。这里按量级自适应：
   *   |v| >= 10000 → 判为 µA，除 1000；否则原样当 mA。
   * 注：µA 机型极低电流（< 10000µA）无法与 mA 区分，属历史数据固有限制。
   */
  function a_cur_to_ma(v){
    if(typeof v !== 'number' || isNaN(v)) return null;
    return Math.abs(v) >= 10000 ? v / 1000 : v;
  }
  function a_freq(v){ if(typeof v!=='number'||isNaN(v)) return null; return v>=10000 ? v/1000 : v; }

  function i_mem(v){ return (typeof v === 'number' && !isNaN(v)) ? (v / MB_BYTES) : null; }

  function isBandwidthKey(k){ return /Bandwidth/i.test(k || ''); }
  function isPartialRendersKey(k){ return /Partial Renders/i.test(k || ''); }
  function g_bw(v){
    if(typeof v!=='number'||isNaN(v)) return null;
    if(v>50000) return v/KB/KB;
    if(v>500) return v/KB;
    return v;
  }
  function g_ratio(v){
    if(typeof v!=='number'||isNaN(v)) return null;
    if(v>=0 && v<=1.5) return v*100;
    return v;
  }
  function g_time_ms(raw, idx){
    if(raw==null) return NaN;
    const n = (typeof raw==='number') ? raw : Date.parse(String(raw));
    if(isNaN(n)) return NaN;
    if(Number.isInteger(n)) return n + idx * 1e-3;
    return n;
  }

    cpu:       ['#4f8ef7', '#79d4f7'],
    mem:       ['#3ecf8e'],
    memDetail: ['#3ecf8e', '#4f8ef7', '#f5d020', '#c77dff', '#f5a623', '#ff79a8', '#79d4f7'],
    fps:       ['#f5d020', '#f5a623', '#f85151'],
    net:       ['#c77dff', '#ff79a8'],
    gpu:       ['#f5a623'],
    temp:      ['#f85151', '#f5a623'],  // 机身温度（红）/ CPU 结温（橙）：两条线必须异色可辨
    current:   ['#79d4f7'],
    power:     ['#f5a623'],
    cpuCores:  ['#4f8ef7','#79d4f7','#3ecf8e','#a8e6cf','#f5a623','#f5d020','#f85151','#c77dff',
               '#ff79a8','#b5e853','#53e8e8','#ffa552','#e87bff','#5effd6','#ff5e5e','#b0b8ff'],
    cpuFreq:   ['#4f8ef7','#79d4f7','#3ecf8e','#a8e6cf','#f5a623','#f5d020','#f85151','#c77dff',
               '#ff79a8','#b5e853','#53e8e8','#ffa552','#e87bff','#5effd6','#ff5e5e','#b0b8ff'],
  };

  const CHART_CONFIGS = {};

  /**
   * GPU 图配置：优先画利用率；机型读不到利用率（MTK 非 root 常见）但能读到 GPU 温度时，
   * 改用温度补位，避免整块图表空白。标题与卡片由 annotateMetricCards 同步改写。
   */
  function gpuChartCfg() {
    const rows = (typeof data !== 'undefined' && data && Array.isArray(data.perf)) ? data.perf : [];
    const hasUtil = rows.some(r => typeof r.gpu === 'number' && r.gpu > 0);
    const hasTemp = rows.some(r => typeof r.gpuTemp === 'number' && r.gpuTemp > 0);
    if (!hasUtil && hasTemp) {
      return { el: 'chart-gpu', series: [{ name: 'GPU 温度', key: d => d.gpuTemp }], type: 'line', yMax: null, fmt: v => v + '\u00b0C' };
    }
    return { el: 'chart-gpu', series: [{ name: 'GPU', key: d => d.gpu }], type: 'line', yMax: 100, fmt: v => v + '%' };
  }

  /* ===== 渲染抽稀 =====
     1 小时采集（1 Hz）= 3600 点，报告页有 12 张图，首屏一次性要 echarts 画 4 万+ 点
     （实测占报告打开耗时的 60% 以上）。客户端图表早有 MAX_RENDER_POINTS=2000 的
     隔点抽稀，报告页一直漏了：dataZoom 有 7 处，但缩放前已经付了全量渲染成本。
     这里与客户端同策略：单 series 超过 2000 点就按 step 等间隔取样再交给 echarts。
     注意：只影响「渲染视图」，state.times / state.series 仍是全量原始数据，
     子场景统计、框选统计、加载段剔除都按全量下标计算，不受抽稀影响。 */
  const MAX_RENDER_POINTS = 2000;

  /**
   * 抽稀锚点（子场景 / 加载段边界下标）。
   * 由 applyTagBackgroundToCharts 写入——那段代码在报告渲染函数的嵌套作用域里，
   * 直接引用 tags / loadingInfo 会拿不到，故用这个脚本级 Set 中转。
   */
  const DECIMATE_ANCHORS = new Set();
  function setDecimateAnchors(indices) {
    DECIMATE_ANCHORS.clear();
    for (const i of (indices || [])) {
      const k = i | 0;
      if (k >= 0) DECIMATE_ANCHORS.add(k);
    }
  }
  function decimateAnchors(len) {
    const out = new Set();
    for (const k of DECIMATE_ANCHORS) if (k < len) out.add(k);
    return out;
  }

  /**
   * 返回抽样下标数组；点数不超过 maxPts 时返回 null（表示不抽稀）。
   * 末点必留，避免最后一段趋势被截断。
   */
  function decimateIndices(len, maxPts) {
    if (!(len > maxPts)) return null;
    const step = Math.ceil(len / maxPts);
    const anchors = decimateAnchors(len);
    const idx = [];
    for (let i = 0; i < len; i += step) idx.push(i);
    if (anchors.size) {
      const seen = new Set(idx);
      for (const a of anchors) if (!seen.has(a)) { idx.push(a); seen.add(a); }
      idx.sort((a, b) => a - b);
    }
    if (idx[idx.length - 1] !== len - 1) idx.push(len - 1);
    return idx;
  }

  class ChartManager {
    constructor() {
      this._charts = {}; this._data = {}; this._ready = false; this._onReadyCbs = [];
      /** @type {string[]|null} 视口外待补画的图（分帧渲染队列） */
      this._pendingRest = null;
      /** @type {*} 补画定时器句柄：同一时刻只排一条链，避免多批数据各排一队 */
      this._restTimer = null;
    }
    onReady(cb) {
      if (typeof cb !== 'function') return;
      if (this._ready) { try { cb(); } catch (_) {} return; }
      this._onReadyCbs.push(cb);
    }
    init() {
      const boot = () => requestAnimationFrame(() => setTimeout(() => this._doInit(), 120));
      // echarts 异步加载（见文件头 window.echartsReady）：等库就绪再建图表
      if (typeof window.echartsReady === 'function') {
        window.echartsReady().then(boot, boot);
      } else {
        boot();
      }
    }
    _doInit() {
      for (const [name, cfg] of Object.entries(CHART_CONFIGS)) {
        const el = document.getElementById(cfg.el);
        if (!el) continue;
        const chart = echarts.init(el, 'dark');
        this._charts[name] = chart;
        this._data[name] = { times: [], series: (cfg.series || []).map(() => []) };
        if (!cfg.dynamic) chart.setOption(this._buildOption(name, cfg));
      }
      this._ready = true;
      const ro = new ResizeObserver(() => { for (const c of Object.values(this._charts)) c.resize(); });
      const grid = document.querySelector('.charts-grid');
      if (grid) ro.observe(grid);
      window.addEventListener('resize', () => { for (const c of Object.values(this._charts)) c.resize(); });
      // flush queued updates that arrived before init
      if (this._queued && this._queued.length) {
        const q = this._queued.slice();
        this._queued.length = 0;
        this.updateMany(q);
      }
      // notify ready callbacks
      if (this._onReadyCbs && this._onReadyCbs.length) {
        const cbs = this._onReadyCbs.slice();
        this._onReadyCbs.length = 0;
        for (const cb of cbs) {
          try { cb(); } catch (e) { console.error('[chartMgr] onReady 回调执行失败:', e && e.stack || e); }
        }
      }
    }
    update(d) {
      if (!this._ready) {
        if (!this._queued) this._queued = [];
        this._queued.push(d);
        return;
      }
      for (const [name, cfg] of Object.entries(CHART_CONFIGS)) {
        try { this._updateOne(name, cfg, d); } catch (_) {}
      }
    }

    /**
     * 批量追加采样点：先全部写进 state，再每张图只 setOption 一次。
     *
     * 旧实现是调用方 `pts.forEach(p => chartMgr.update(p))`，即每个点对 11 张图
     * 各 setOption 一次并回传全量数组 —— 3600 点 = 39600 次 setOption，
     * 每次都在拷贝越来越长的数组，累计 O(n²)，1 小时报告打开要卡好几秒。
     */
    updateMany(list) {
      if (!Array.isArray(list) || !list.length) return;
      if (!this._ready) {
        if (!this._queued) this._queued = [];
        for (const d of list) this._queued.push(d);
        return;
      }
      for (const [name, cfg] of Object.entries(CHART_CONFIGS)) {
        try {
          for (const d of list) this._updateOne(name, cfg, d, true);
        } catch (_) {}
      }
      this.rerenderAll();
    }

    /**
     * 按当前 state 重画所有图（渲染视图经过抽稀）。
     *
     * 分两批：首屏可见的立刻画，视口外的每帧补一张。
     * 原因：12 张图各 2000 点是 900ms 量级的长任务，一次画完期间浏览器连一帧都
     * 出不来，用户看到的就是「打开报告白屏一下才出现曲线」。拆开后首屏曲线几百
     * 毫秒内就能落位，剩下的在阅读时补齐，总耗时不变但感知完全不同。
     */
    rerenderAll() {
      const names = [];
      for (const name of Object.keys(CHART_CONFIGS)) {
        if (this._data[name] && this._charts[name]) names.push(name);
      }
      if (!names.length) return;
      const vh = window.innerHeight || 800;
      const soon = [];
      const later = [];
      for (const name of names) {
        let top = 0;
        try { top = this._charts[name].getDom().getBoundingClientRect().top; } catch (_) { /* 元素未布局：当作首屏 */ }
        (top < vh * 1.3 ? soon : later).push(name);
      }
      // 布局还没就绪时（宽高为 0）所有图都算「首屏」，会退化成一次性画完；
      // 因此首屏批次硬性封顶 4 张，保证无论如何都会让出主线程。
      const FIRST_BATCH_MAX = 4;
      const head = soon.length ? soon : names.slice(0, FIRST_BATCH_MAX);
      const deferred = soon.length ? later : names.slice(FIRST_BATCH_MAX);
      for (const name of head.slice(0, FIRST_BATCH_MAX)) {
        try { this._renderOne(name, this._charts[name], this._data[name]); } catch (_) {}
      }
      this._pendingRest = head.slice(FIRST_BATCH_MAX).concat(deferred);
      this._drainRest();
    }

    /** 每帧补画一张视口外的图，把长任务切成若干小任务 */
    _drainRest() {
      if (this._restTimer || !this._pendingRest || !this._pendingRest.length) return;
      this._restTimer = setTimeout(() => {
        this._restTimer = null;
        const name = this._pendingRest && this._pendingRest.shift();
        if (!name) return;
        try { this._renderOne(name, this._charts[name], this._data[name]); } catch (_) {}
        this._drainRest();
      }, 0);
    }

    /**
     * 把 state 渲染到图上。times/series 点数超过 2×MAX_RENDER_POINTS 时
     * 只送抽稀后的视图给 echarts；state 本身保持全量，供统计按真实下标切片。
     */
    _renderOne(name, chart, state) {
      const idx = decimateIndices(state.times.length, MAX_RENDER_POINTS);
      let times, series;
      if (!idx) {
        times = state.times;
        series = state.series;
      } else {
        times = idx.map(i => state.times[i]);
        series = state.series.map(s => idx.map(i => s[i]));
      }
      chart.setOption({ xAxis: [{ data: times }], series: series.map(d => ({ data: d })) });
    }

    /**
     * 把单个采样点写进 state。
     * @param {boolean} deferRender true 时只写数据不重绘（由 updateMany 统一重绘）
     */
    _updateOne(name, cfg, d, deferRender) {
      const state = this._data[name];
      const chart = this._charts[name];
      if (!state || !chart) return;
      if (cfg.dynamic) {
        const vals = (cfg.keyFn(d) || []);
        const count = vals.length;
        if (count === 0) return;
        if (state.series.length !== count) {
          cfg.series = Array.from({ length: count }, (_, i) => ({ name: `Core ${i}` }));
          state.times = [];
          state.series = Array.from({ length: count }, () => []);
          chart.setOption(this._buildLineOption(name, cfg), true);
        }
        state.times.push(d.time);
        vals.forEach((v, i) => state.series[i].push((v == null || isNaN(+v)) ? null : +v));
        if (!deferRender) this._renderOne(name, chart, state);
        return;
      }
      state.times.push(d.time);
      cfg.series.forEach((s, i) => {
        const v = s.key(d);
        state.series[i].push((v == null || isNaN(+v)) ? null : +v);
      });
      if (!deferRender) this._renderOne(name, chart, state);
    }
    _buildLineOption(name, cfg) {
      const colors = COLORS[name] || COLORS.cpu;
      return {
        color: colors,
        // 静态报告不需要入场动画：12 张图各 2000 点做一次渐进动画，实测吃掉
        // 首屏渲染时间的可观一部分，而用户看到的就是「打开报告卡一下」。
        // 关掉后曲线直接落位，视觉上只是少了 0.5s 的「画上去」过程。
        animation: false,
        tooltip: { trigger: 'axis' },
        legend: { top: 0, textStyle: { color: '#bcd3ff' } },
        grid: { left: 44, right: 16, top: 32, bottom: 28 },
        xAxis: [{ type: 'category', data: [], axisLabel: { color: '#96a8c8' } }],
        yAxis: [{ type: 'value', max: null, axisLabel: { color: '#96a8c8' } }],
        dataZoom: [
          { type: 'inside', xAxisIndex: 0, filterMode: 'none' },
          { type: 'slider', xAxisIndex: 0, height: 16, bottom: 4, showDetail: false },
        ],
        series: (cfg.series || []).map(s => ({ name: s.name, type: 'line', smooth: true, showSymbol: false, data: [] })),
      };
    }
    _buildMixedOption(name, cfg) {
      const colors = COLORS[name] || COLORS.fps;
      return {
        color: colors,
        animation: false,
        tooltip: { trigger: 'axis' },
        legend: { top: 0, textStyle: { color: '#bcd3ff' } },
        grid: { left: 44, right: 16, top: 32, bottom: 28 },
        xAxis: [{ type: 'category', data: [], axisLabel: { color: '#96a8c8' } }],
        yAxis: [
          { type: 'value', max: null, axisLabel: { color: '#96a8c8' } },
          { type: 'value', max: null, axisLabel: { color: '#96a8c8' } },
        ],
        dataZoom: [
          { type: 'inside', xAxisIndex: 0, filterMode: 'none' },
          { type: 'slider', xAxisIndex: 0, height: 16, bottom: 4, showDetail: false },
        ],
        series: (cfg.series || []).map(s => ({
          name: s.name,
          type: s.type || 'line',
          yAxisIndex: s.yAxisIndex ?? 0,
          smooth: s.type === 'line',
          showSymbol: false,
          data: [],
        })),
      };
    }
    _buildOption(name, cfg) { return cfg.mixed ? this._buildMixedOption(name, cfg) : this._buildLineOption(name, cfg); }
  }

  function setText(id, text) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = (text == null || text === '') ? '--' : String(text);
  }

  function pickDeviceText(payload) {
    const d = payload.device || {};
    const parts = [];
    if (d.name) parts.push(`名称：${d.name}`);
    if (d.brand) parts.push(`品牌：${d.brand}`);
    if (d.model) parts.push(`型号：${d.model}`);
    if (d.osVersion) parts.push(`系统：${d.osVersion}`);
    if (d.bundleId) parts.push(`包名：${d.bundleId}`);
    if (d.appName) parts.push(`应用：${d.appName}`);
    return parts.filter(Boolean).join('   ');
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  function fmtDateTime(dt) {
    if (!(dt instanceof Date) || isNaN(dt.getTime())) return '';
    return `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}-${pad2(dt.getDate())} ${pad2(dt.getHours())}:${pad2(dt.getMinutes())}:${pad2(dt.getSeconds())}`;
  }

  function durText(sec) {
    if (sec == null) return '--';
    if (sec < 60) return sec + ' 秒';
    const m = Math.floor(sec / 60), s = sec % 60;
    return s ? `${m} 分 ${s} 秒` : `${m} 分钟`;
  }

  /** 报告起始时间：优先首条采样的 timestamp */
  function reportStartTime() {
    const rows = (typeof data !== 'undefined' && data && Array.isArray(data.perf)) ? data.perf : [];
    const t = rows[0] && rows[0].timestamp;
    if (typeof t === 'number') return new Date(t);
    const p = Date.parse(String(t || ''));
    return isNaN(p) ? null : new Date(p);
  }

  function reportDurationSec() {
    const rows = (typeof data !== 'undefined' && data && Array.isArray(data.perf)) ? data.perf : [];
    if (rows.length < 2) return null;
    const a = rows[0].timestamp, b = rows[rows.length - 1].timestamp;
    if (typeof a !== 'number' || typeof b !== 'number') return null;
    return Math.max(1, Math.round((b - a) / 1000));
  }

  /**
   * 顶部概要条：设备名 / 应用 / 平台 / 采样数 / 时长 / 开始时间。
   * 原来是一整行灰色小字（名称：… 品牌：… 包名：…），关键信息不突出。
   */
  function renderReportMeta(category) {
    const el = document.getElementById('device-info-text');
    if (!el) return;
    const d = (data && data.device) || {};
    const rows = (Array.isArray(data.perf)) ? data.perf : [];
    const n = rows.length;
    const durSec = reportDurationSec();
    const start = reportStartTime();

    const platName = category === 'android' ? 'Android'
      : category === 'ios' ? 'iOS'
      : category === 'ios_gpu' ? 'iOS GPU'
      : category === 'pc' ? 'PC'
      : (category || '—');

    const chips = [];
    chips.push(`<span class="rm-chip rm-chip--plat"><i>平台</i>${escapeHtml(platName)}</span>`);
    if (n) chips.push(`<span class="rm-chip"><i>采样</i>${n} 点</span>`);
    if (durSec != null) chips.push(`<span class="rm-chip"><i>时长</i>${durText(durSec)}</span>`);
    if (start) chips.push(`<span class="rm-chip"><i>开始</i>${fmtDateTime(start)}</span>`);
    // 1.1 目标帧率来源必须显式：设备自报峰值刷新率比 FPS 序列推断可信，
    // 锁帧应用用推断值会把「主动限帧」误判成「达标」。
    const ld = (data && data.loading) || {};
    if (ld.target > 0) {
      const fromDev = ld.targetSource === 'device-peak-refresh-rate';
      chips.push(`<span class="rm-chip" title="${fromDev
        ? '取自设备峰值刷新率（dumpsys display / settings peak_refresh_rate）'
        : '由 FPS 序列 P95 推断，未取到设备自报刷新率'}"><i>目标帧率</i>`
        + `${ld.target} Hz · ${fromDev ? '设备自报' : '序列推断'}</span>`);
    }
    // 1.4 采集开销：观测者效应的直接证据，也解释采样点为什么变稀
    const ov = (data.provenance && data.provenance.overhead) || null;
    if (ov) {
      const itv = (data.diagnostics && data.diagnostics.intervalMs) || 1000;
      const pct = Math.round((ov.p50Ms || 0) / itv * 100);
      chips.push(`<span class="rm-chip"${pct > 30 ? ' style="background:#5a4318;border-color:#8a6a24"' : ''}`
        + ` title="采集自身耗时占采样周期 ${pct}%；过高会反过来拖慢被测应用"><i>采集耗时</i>`
        + `P50 ${ov.p50Ms} / P95 ${ov.p95Ms} ms（${pct}%）</span>`);
    }
    // 1.5 分段溢出 / 截断：长时采集数据完整性的说明
    const prov0 = data.provenance || {};
    if (prov0.spilledSamples) {
      chips.push(`<span class="rm-chip" title="超出内存上限的点已落盘分片并合并回本报告，没有丢失"><i>分段落盘</i>`
        + `${prov0.spilledSamples} 点已合并</span>`);
    }
    if (prov0.truncatedSamples) {
      chips.push(`<span class="rm-chip" style="background:#5a2020;border-color:#8a3030" title="分片写盘失败，报告不完整"><i>丢失</i>`
        + `${prov0.truncatedSamples} 点</span>`);
    }

    // 0.2 iOS 侧 sysmon 只有 6 组，页头显式写「本平台不采集」，
    // 免得报告里没有网络/电量/温度列时被当成采集失败。
    const scopeNote = category === 'ios'
      ? '本平台不采集：网络 / 电量 / 温度 / GPU 利用率（GPU 专项见独立页）；共 6 组指标'
      : category === 'ios_gpu'
        ? '本平台不采集：FPS / CPU / 内存 / 网络 / 电量 / 温度；仅渲染管线专项'
        : '';

    const subParts = [];
    if (d.brand) subParts.push('品牌 ' + d.brand);
    if (d.model && d.model !== d.name) subParts.push('型号 ' + d.model);
    if (d.osVersion) subParts.push('系统 ' + d.osVersion);
    if (d.deviceId) subParts.push('设备ID ' + d.deviceId);
    if (category === 'pc' && rows[0] && rows[0].pcExtra && rows[0].pcExtra.exe) {
      subParts.push('路径 ' + rows[0].pcExtra.exe);
    }

    el.innerHTML =
      '<div class="report-meta">' +
        '<div class="rm-main">' +
          '<span class="rm-device">' + escapeHtml(d.name || '未知设备') + '</span>' +
          '<span class="rm-app">' + escapeHtml(d.bundleId || d.appName || '—') + '</span>' +
        '</div>' +
        '<div class="rm-chips">' + chips.join('') + '</div>' +
        (subParts.length ? '<div class="rm-sub">' + escapeHtml(subParts.join('   ·   ')) + '</div>' : '') +
        (scopeNote ? '<div class="rm-sub" style="color:var(--orange)">'
          + escapeHtml(scopeNote) + '</div>' : '') +
      '</div>';
  }

  function fmtN(v, digits) {
    if (typeof v !== 'number' || isNaN(v)) return '--';
    const m = Math.pow(10, digits);
    return String(Math.round(v * m) / m);
  }

  function mean(vals) {
    let s = 0;
    let n = 0;
    for (const v of vals || []) {
      if (typeof v === 'number' && !isNaN(v)) { s += v; n += 1; }
    }
    return n ? (s / n) : null;
  }

  function render() {
    if (typeof data === 'undefined' || !data) {

    } else if (category === 'pc') {

        mem: { el:'chart-mem', series:[{name:'RSS',key:d=>d.mem.totalPss}], type:'line', yMax:null, fmt:v=>v+' MB' },
        memDetail: { el:'chart-memdetail', series:[
          { name:'NativeHeap', key:d=>d.mem.nativeHeap },
          { name:'JavaHeap', key:d=>d.mem.javaHeap },
          { name:'Code', key:d=>d.mem.code },
          { name:'Stack', key:d=>d.mem.stack },
          { name:'Graphics', key:d=>d.mem.graphics },
          { name:'PrivateOther', key:d=>d.mem.privateOther },
          { name:'System', key:d=>d.mem.system },
        ], type:'line', yMax:null, fmt:v=>v+' MB' },
        fps: { el:'chart-fps', series:[
          { name:'FPS', key:d=>d.fps, type:'line', yAxisIndex:0 },
          { name:'Jank', key:d=>d.jank, type:'bar', yAxisIndex:1 },
          { name:'BigJank', key:d=>d.bigJank, type:'bar', yAxisIndex:1 },

        ], yMax:120, fmt:v=>v, mixed:true },
        net: { el:'chart-net', series:[{name:'下行',key:d=>d.net.rxKBps},{name:'上行',key:d=>d.net.txKBps}], type:'line', yMax:null, fmt:v=>v+' KB/s' },
        gpu: gpuChartCfg(),
        // 机身温度与 CPU 结温并列成两条序列，明确区分口径；老报告无 cpuTemp 时该线断开
        temp: { el:'chart-temp', series:[{name:'机身温度',key:d=>d.temperature},{name:'CPU 结温',key:d=>d.cpuTemp ?? null}], type:'line', yMax:null, fmt:v=>v+'°C' },
        // 无电池 / 读不到电流时断线，不画 0 线（会被读成「实测 0mA / 0mW」）
        current: { el:'chart-current', series:[{name:'电流',key:d=>d.battery.currentNow ?? null}], type:'line', yMax:null, fmt:v=>v+' mA' },
        power: { el:'chart-power', series:[{name:'功耗',key:d=>d.battery.power ?? null}], type:'line', yMax:null, fmt:v=>v+' mW' },
        disk: { el:'chart-disk', series:[
          { name:'读 KB/s', key:d=>d._diskReadKBps ?? null },
          { name:'写 KB/s', key:d=>d._diskWriteKBps ?? null },
        ], type:'line', yMax:null, fmt:v=>v+' KB/s' },
        cpuCores: { el:'chart-cpu-cores', series:[], dynamic:true, keyFn:d=>d.cpuCores?d.cpuCores.usage:[], yMax:100, fmt:v=>v+'%' },
        cpuFreq: { el:'chart-cpu-freq', series:[], dynamic:true, keyFn:d=>d.cpuCores?d.cpuCores.freq:[], yMax:null, fmt:v=>v+' MHz' },
        cswitch: { el:'chart-cswitch', series:[{name:'上下文切换',key:d=>d.cswitch}], type:'bar', yMax:null, fmt:v=>v+' 次/s' },
      });
    } else {
      Object.assign(CHART_CONFIGS, {
        // 进程 CPU 按单核口径，多线程应用可超过 100%，不再钉死 yMax=100（否则被截顶）
        cpu: { el:'chart-cpu', series:[{name:'系统CPU',key:d=>d.cpu.sysCpu},{name:'进程CPU',key:d=>d.cpu.procCpu}], type:'line', yMax:null, fmt:v=>v+'%' },
        mem: { el:'chart-mem', series:[{name:'PSS',key:d=>d.mem.totalPss}], type:'line', yMax:null, fmt:v=>v+' MB' },
        memDetail: { el:'chart-memdetail', series:[
          { name:'NativeHeap', key:d=>d.mem.nativeHeap },
          { name:'JavaHeap', key:d=>d.mem.javaHeap },
          { name:'Code', key:d=>d.mem.code },
          { name:'Stack', key:d=>d.mem.stack },
          { name:'Graphics', key:d=>d.mem.graphics },
          { name:'PrivateOther', key:d=>d.mem.privateOther },
          { name:'System', key:d=>d.mem.system },
        ], type:'line', yMax:null, fmt:v=>v+' MB' },
        fps: { el:'chart-fps', series:[
          { name:'FPS', key:d=>d.fps, type:'line', yAxisIndex:0 },
          { name:'Jank', key:d=>d.jank, type:'bar', yAxisIndex:1 },
          { name:'BigJank', key:d=>d.bigJank, type:'bar', yAxisIndex:1 },
          { name:'SmallJank', key:d=>d.smallJank, type:'bar', yAxisIndex:1 },
          { name:'TinyJank', key:d=>d.tinyJank, type:'bar', yAxisIndex:1 },
        ], yMax:120, fmt:v=>v, mixed:true },
        net: { el:'chart-net', series:[{name:'下行',key:d=>d.net.rxKBps},{name:'上行',key:d=>d.net.txKBps}], type:'line', yMax:null, fmt:v=>v+' KB/s' },
        gpu: gpuChartCfg(),
        // 机身温度与 CPU 结温并列成两条序列，明确区分口径；老报告无 cpuTemp 时该线断开
        temp: { el:'chart-temp', series:[{name:'机身温度',key:d=>d.temperature},{name:'CPU 结温',key:d=>d.cpuTemp ?? null}], type:'line', yMax:null, fmt:v=>v+'°C' },
        // 无电池 / 读不到电流时断线，不画 0 线（会被读成「实测 0mA / 0mW」）
        current: { el:'chart-current', series:[{name:'电流',key:d=>d.battery.currentNow ?? null}], type:'line', yMax:null, fmt:v=>v+' mA' },
        power: { el:'chart-power', series:[{name:'功耗',key:d=>d.battery.power ?? null}], type:'line', yMax:null, fmt:v=>v+' mW' },
        cpuCores: { el:'chart-cpu-cores', series:[], dynamic:true, keyFn:d=>d.cpuCores?d.cpuCores.usage:[], yMax:100, fmt:v=>v+'%' },
        cpuFreq: { el:'chart-cpu-freq', series:[], dynamic:true, keyFn:d=>d.cpuCores?d.cpuCores.freq:[], yMax:null, fmt:v=>v+' MHz' },
        cswitch: { el:'chart-cswitch', series:[{name:'上下文切换',key:d=>d.cswitch}], type:'bar', yMax:null, fmt:v=>v+' 次/s' },
      });
    }

    // ── 采集参数适配：被移除的指标不建图、不占位、不统计 ──────────────────────
    // data.metricConfig 为采集时保存的勾选项；缺失（旧报告）时全部启用
    const _mcNorm = (function () {
      const cfg = (data && typeof data.metricConfig === 'object' && data.metricConfig) || null;
      if (!cfg) return null;
      const out = {};
      for (const k of Object.keys(cfg)) out[k] = !!cfg[k];
      return out;
    })();
    const CHART_GROUP = {
      cpu: 'cpu', mem: 'mem', memDetail: 'mem', fps: 'fps', net: 'net',
      gpu: 'gpu', temp: 'temp', current: 'battery', power: 'battery',
      cpuCores: 'cpu', cpuFreq: 'cpu', disk: 'disk', events: 'events',
    };
    if (_mcNorm) {
      for (const name of Object.keys(CHART_CONFIGS)) {
        const g = CHART_GROUP[name];
        if (g && _mcNorm[g] === false) {
          const el = document.getElementById(CHART_CONFIGS[name].el);
          const wrap = el && el.closest('.chart-wrap');
          if (wrap) wrap.hidden = true;
          delete CHART_CONFIGS[name];
        }
      }
      // 指标卡同样按 data-metric 隐藏（各端模板已标注）
      document.querySelectorAll('[data-metric]').forEach((el) => {
        if (_mcNorm[el.getAttribute('data-metric')] === false) el.hidden = true;
      });
    }

    // ── 采集参数顺序：按采集界面保存的顺序重排指标卡与图表 ──────────────────
    // 顺序来自 payload.metricOrder（旧报告无此字段 → 保持模板默认顺序不变）。
    // 用 CSS order 而不是移动 DOM：echarts 实例绑在原节点上，移动会牵动渲染。
    (function () {
      const raw = (data && Array.isArray(data.metricOrder) && data.metricOrder)
        || (data && data.metricConfig && Array.isArray(data.metricConfig.__order) && data.metricConfig.__order)
        || null;
      if (!raw || !raw.length) return;
      const GROUP_IDS = ['fps', 'cpu', 'mem', 'net', 'gpu', 'temp', 'battery', 'disk', 'events', 'proc'];
      const order = [];
      const seen = {};
      for (const g of raw) {
        if (typeof g === 'string' && GROUP_IDS.indexOf(g) !== -1 && !seen[g]) { order.push(g); seen[g] = true; }
      }
      if (!order.length) return;
      const rank = {};
      for (let i = 0; i < order.length; i++) rank[order[i]] = i;
      const unknown = order.length;

      function apply() {
        const els = document.querySelectorAll('[data-metric]');
        const parents = [];
        for (const el of els) {
          const p = el.parentNode;
          if (p && parents.indexOf(p) === -1) parents.push(p);
        }
        for (const parent of parents) {
          const kids = parent.children;
          let first = -1, last = -1;
          for (let a = 0; a < kids.length; a++) {
            if (kids[a].getAttribute && kids[a].getAttribute('data-metric')) {
              if (first < 0) first = a;
              last = a;
            }
          }
          if (first < 0) continue;
          const seqByRank = {};
          let prevRank = -1;
          for (let b = 0; b < kids.length; b++) {
            const g = kids[b].getAttribute && kids[b].getAttribute('data-metric');
            if (!g) {
              // 无指标标记块：首块固定最前、尾块固定最后、中间块跟在前一组之后
              if (b < first) kids[b].style.order = '-1000';
              else if (b > last) kids[b].style.order = String((unknown + 1) * 1000);
              else kids[b].style.order = String((prevRank < 0 ? 0 : prevRank) * 1000 + 500);
              continue;
            }
            const r = Object.prototype.hasOwnProperty.call(rank, g) ? rank[g] : unknown;
            prevRank = r;
            const seq = seqByRank[r] || 0;
            seqByRank[r] = seq + 1;
            kids[b].style.order = String(r * 1000 + seq);
          }
        }
      }

      apply();
      // 主体渲染后还会动态追加 KPI 卡 / 分区标题，追加完再排一次（幂等，只监听容器直接子节点）
      if (typeof MutationObserver === 'function') {
        const targets = [document.querySelector('section.cards'), document.querySelector('.charts-grid')].filter(Boolean);
        if (targets.length) {
          let pending = false;
          const mo = new MutationObserver(() => {
            if (pending) return;
            pending = true;
            setTimeout(() => { pending = false; apply(); }, 0);
          });
          for (const t of targets) mo.observe(t, { childList: true });
        }
      }
    })();

    const chartMgr = new ChartManager();
    chartMgr.init();

    const perf = Array.isArray(data.perf) ? data.perf : [];
    if (!perf.length) return;

    const tags = Array.isArray(data.tag)
      ? data.tag
      : (Array.isArray(data.tags) ? data.tags
        : (Array.isArray(data.device && data.device.tag) ? data.device.tag : []));

    function buildTagMarkAreas(times) {
      if (!Array.isArray(times) || times.length === 0) return [];
      const out = [];
      for (const seg of tags) {
        if (!Array.isArray(seg) || seg.length < 2) continue;
        let s = seg[0], e = seg[1];
        if (s == null || e == null) continue;
        s = Math.max(0, Math.min(times.length - 1, s | 0));
        e = Math.max(0, Math.min(times.length - 1, e | 0));
        if (e < s) continue;
        out.push([{ xAxis: times[s] }, { xAxis: times[e] }]);
      }
      return out;
    }

    function applyTagBackgroundToCharts() {
      const markColor = 'rgba(121, 212, 247, 0.14)'; // light blue
      // 抽稀锚点：子场景与加载段的边界必须保留在渲染视图里，
      // 否则 markArea 依赖的分类值在抽稀后的 x 轴上不存在，底纹会整块消失。
      try {
        const firstTimes = chartMgr._data[Object.keys(CHART_CONFIGS)[0]]?.times || [];
        const anchors = [];
        if (Array.isArray(tags)) {
          for (const t of tags) {
            if (Array.isArray(t) && t.length >= 2) { anchors.push(t[0], t[1]); }
          }
        }
        const linfo = ensureLoadingInfo();
        if (linfo && Array.isArray(linfo.segments)) {
          for (const g of linfo.segments) { anchors.push(g.start, g.end); }
        }
        setDecimateAnchors(anchors);
        if (firstTimes.length > MAX_RENDER_POINTS) chartMgr.rerenderAll();
      } catch (_) {}
      for (const [chartName, cfg] of Object.entries(CHART_CONFIGS)) {
        const state = chartMgr._data[chartName];
        const chart = chartMgr._charts[chartName];
        if (!state || !chart) continue;
        const tagAreas = buildTagMarkAreas(state.times);
        // 加载段只打在 FPS 图的第一条 series 上（琥珀色）。
        // 若每条 series 都打，5 层 13% 透明度会叠成 50%，糊住曲线本身。
        const loadingAreas = chartName === 'fps' ? buildLoadingMarkAreas(state.times) : [];
        chart.setOption({
          series: (cfg.series || []).map((_, idx) => ({
            markArea: {
              silent: true,
              itemStyle: { color: markColor },
              data: idx === 0 ? tagAreas.concat(loadingAreas) : tagAreas,
            },
          })),
        });
      }
    }

    /** 整段是否都没有有效数值（null / NaN 一律视为无数据） */
    function seriesAllEmpty(vals) {
      return !(vals || []).some(v => typeof v === 'number' && !isNaN(v));
    }

    /**
     * 无数据判定。
     * gpu / temperature 这类指标在"取不到"时会被旧版本写成 0，
     * 因此 zeroAsEmpty=true 时把"全为 0"也当作无数据，避免显示一条贴底的假曲线。
     */
    function seriesNoData(vals, zeroAsEmpty) {
      const nums = (vals || []).filter(v => typeof v === 'number' && !isNaN(v));
      if (!nums.length) return true;
      return zeroAsEmpty ? nums.every(v => v <= 0) : false;
    }

    /** 某张图整段无数据时，在图中央盖一条说明，避免被误认为"没渲染出来" */
    function annotateEmptyCharts() {
      const tips = {
        gpu: '该机型未开放 GPU 利用率读取（需 root），也未暴露 GPU 温度',
        temp: '本次采集未获取到温度数据',
        cswitch: '本次采集未获取到上下文切换数据',
        current: '本次采集未获取到电流数据',
        power: '本次采集未获取到功耗数据',
        net: '本次采集未获取到网络速率数据',
        disk: '本次采集未获取到磁盘 I/O 数据',
        events: '本次采集未获取到系统事件数据',
        occupancy: 'iOS GPU 专项指标，本次数据未包含',
        aluPerf: 'iOS GPU 专项指标，本次数据未包含',
        texture: 'iOS GPU 专项指标，本次数据未包含',
        bandwidth: 'iOS GPU 专项指标，本次数据未包含',
        cache: 'iOS GPU 专项指标，本次数据未包含',
        shader: 'iOS GPU 专项指标，本次数据未包含',
      };
      for (const [name, cfg] of Object.entries(CHART_CONFIGS)) {
        const el = document.getElementById(cfg.el);
        if (!el) continue;
        const state = chartMgr._data[name];
        if (!state) continue;
        const flat = (state.series || []).flat();
        if (!flat.length) continue;
        const wrap = el.closest('.chart-wrap');
        if (!wrap) continue;
        let tip = wrap.querySelector('.chart-empty-tip');
        const zeroAsEmpty = (name === 'gpu' || name === 'temp');
        if (!seriesNoData(flat, zeroAsEmpty)) { if (tip) tip.remove(); continue; }
        if (tip) continue;
        tip = document.createElement('div');
        tip.className = 'chart-empty-tip';
        tip.textContent = tips[name] || '本次采集无该指标数据';
        wrap.appendChild(tip);
      }
    }

    /** P95 吸附到常见刷新率 */
    // P-04 / S-01：档位表与采集端 adb.js 的 REFRESH_RATES 保持一致 ——
    // `perf_param_audit_test.js` 的 ⑦⑧ 会逐份校验 5 个副本（本文件、adb.js、
    // fps-loading.js、library.html、backend/utils.py），改一处不同步就会红。
    // 修正点：去掉 45（手机面板没有 45Hz 档，45 是帧率上限）、补 24/48/100/185
    //（24/48 是视频帧率，100 是非 30 倍数机型，185 见 ROG 9 / K100 Pro Max）。
    const REFRESH_RATES_SHARED = [24, 30, 48, 60, 90, 100, 120, 144, 165, 185, 240];
    function snapFpsTarget(p95) {
      if (!(p95 > 0)) return null;
      // P-04：吸附到「≥ p95×0.97 的最小档」；档位都不满足时取 p95 向上取整——
      // 旧兜底 ceil(p95/30)*30 会把 24fps 视频判成 30、185Hz 判成 210。
      // 上界 1.10：200Hz 面板不该被抬到 240（与 fps-loading.js / utils.py 同口径）
      for (const c of REFRESH_RATES_SHARED) { if (c >= p95 * 0.97 && c <= p95 * 1.10) return c; }
      return Math.ceil(p95);
    }
    // P-04 / S-01：设备自报目标帧率。`loading` 里有两个不同字段：
    //   targetHz   —— 仅在「设备自报」时非空（fps-loading.js:174），语义精确；
    //   target     —— 设备值或「P95 吸附」推断值，读它必须同时看 targetSource。
    // 旧实现直接读 target，等于把推断值当设备值：读不到刷新率的报告（iOS / PC /
    // 历史报告 / 探针失败）会拿旧 7 档表的推断结果覆盖报告页的新表。
    function deviceTargetHz() {
      const L = (typeof data !== 'undefined' && data && data.loading) || null;
      if (!L) return null;
      const hz = Number(L.targetHz);
      if (hz > 0) return hz;
      // 老报告没有 targetHz：退回 target，但必须校验来源，否则宁可用本地吸附
      if (L.targetSource === 'device-peak-refresh-rate') {
        const t = Number(L.target);
        if (t > 0) return t;
      }
      return null;
    }

    function fpsSeriesOf(pts) {
      // 0 是有效值（那一秒没有渲染出帧），必须参与均值与低帧统计；只排除 null / NaN
      return (pts || []).map(p => p.fps).filter(v => typeof v === 'number' && !isNaN(v) && v >= 0);
    }

    function fpsTargetOfSeries(arr) {
      const a = (arr || []).filter(v => typeof v === 'number' && !isNaN(v)).sort((x, y) => x - y);
      if (!a.length) return null;
      const i = (a.length - 1) * 0.95;
      const lo = Math.floor(i), hi = Math.ceil(i);
      const p95 = lo === hi ? a[lo] : a[lo] + (a[hi] - a[lo]) * (i - lo);
      // P-04：设备自报优先（与 fpsTargetOf 同一口径），推断值仅作回退
      const dev = deviceTargetHz();
      if (dev != null) return dev;
      return snapFpsTarget(p95);
    }

    /** 目标帧率：设备自报优先（P-04），无设备值时按 P95 吸附到共享档位表 */
    function fpsTargetOf(pts) {
      const dev = deviceTargetHz();
      if (dev != null) return dev;
      return fpsTargetOfSeries(fpsSeriesOf(pts));
    }

    // ── 加载阶段（loading）识别 ────────────────────────────────────────────
    // 冷启动 / 换场景 / 读关卡时会连续几秒渲染不出帧，FPS 突然掉到个位数。
    // 这段数据真实存在（曲线照常画、底纹标出），但不代表游戏内表现：
    // 混进均值 / 1%Low / 卡顿率会把整份报告拉垮，所以统计时跳过。
    //
    // 判定规则（4 条同时满足才剔除）：
    //   1. 连续 ≥ minRun 个采样点 FPS < 目标 × lowRatio（默认 3 点 / 50%）
    //   2. 段后 recoverWindow 个点内出现 FPS ≥ 目标 × recoverRatio（默认 5 点 / 80%）
    //      —— 「能恢复」才是加载；一直低说明真的跑不动，不能剔
    //   3. 段内允许夹少量 null（未取到帧），最多 maxNullBridge 个
    //   4. 剔除总量 ≤ maxExcludedRatio（40%），超过则整体作废，避免把坏数据洗成好数据
    // 另：起始 warmupSamples 个点内的低帧，1 个点即算启动预热
    //    （首个采样点常无帧数增量、被记成 0，那 1 个 0 就能把 1%Low 打到 0）。
    //
    // ⚠️ 与 `_client_src/app/src/fps-loading.js`、`perfara/backend/utils.py` 同规则。
    const LOADING_OPTIONS = {
      lowRatio: 0.5, recoverRatio: 0.8, minRun: 3,
      recoverWindow: 5, maxNullBridge: 2, warmupSamples: 3, maxExcludedRatio: 0.4,
    };
    /** @type {null | {target:number|null, segments:Array, mask:Uint8Array, excludedSamples:number, totalSamples:number, excludedRatio:number}} */
    let loadingInfo = null;

    function isNumVal(v) { return typeof v === 'number' && isFinite(v); }

    function detectLoadingSegments(fpsArr, target, opt) {
      const o = Object.assign({}, LOADING_OPTIONS, opt || {});
      const arr = Array.isArray(fpsArr) ? fpsArr : [];
      const n = arr.length;
      if (!n || !(target > 0)) return [];
      const lowThr = target * o.lowRatio;
      const recThr = target * o.recoverRatio;
      const segs = [];
      let i = 0;
      while (i < n) {
        const v = arr[i];
        if (!isNumVal(v) || v >= lowThr) { i += 1; continue; }
        let j = i, low = 0, nullRun = 0;
        while (j < n) {
          const w = arr[j];
          if (!isNumVal(w)) {
            nullRun += 1;
            if (nullRun > o.maxNullBridge) break;
            j += 1;
            continue;
          }
          if (w >= lowThr) break;
          nullRun = 0;
          low += 1;
          j += 1;
        }
        let e = j - 1;
        while (e > i && !isNumVal(arr[e])) e -= 1;
        const isWarmup = i < o.warmupSamples;
        if (low >= o.minRun || (isWarmup && low >= 1)) {
          let recovered = false;
          for (let k = j; k < Math.min(n, j + o.recoverWindow); k += 1) {
            if (isNumVal(arr[k]) && arr[k] >= recThr) { recovered = true; break; }
          }
          if (recovered) {
            segs.push({ start: i, end: e, samples: e - i + 1 });
            i = j;
            continue;
          }
        }
        i = j > i ? j : i + 1;
      }
      const covered = segs.reduce((s, g) => s + g.samples, 0);
      if (covered / n > o.maxExcludedRatio) return [];
      return segs;
    }

    function buildLoadingMask(len, segs) {
      const mask = new Uint8Array(Math.max(0, len | 0));
      for (const g of segs || []) {
        const s = Math.max(0, g.start | 0);
        const e = Math.min(mask.length - 1, g.end | 0);
        for (let k = s; k <= e; k += 1) mask[k] = 1;
      }
      return mask;
    }

    function analyseLoading(fpsArr) {
      const arr = Array.isArray(fpsArr) ? fpsArr : [];
      const target = fpsTargetOfSeries(arr);
      const segments = detectLoadingSegments(arr, target);
      const mask = buildLoadingMask(arr.length, segments);
      let excluded = 0;
      for (let k = 0; k < mask.length; k += 1) if (mask[k]) excluded += 1;
      return {
        target, segments, mask,
        excludedSamples: excluded,
        totalSamples: arr.length,
        excludedRatio: arr.length ? excluded / arr.length : 0,
      };
    }

    /**
     * 懒加载：算一次后缓存。
     * 注意必须优先用调用方传进来的 FPS 序列 —— chartMgr 的初始化是 rAF + 120ms 延后的，
     * 卡片赋值时 chartMgr._data.fps 还是空的；若先按空数组算，会缓存成「无加载段」，
     * 后面的统计全部失效（曾踩过）。
     */
    function ensureLoadingInfo(fpsArr) {
      if (loadingInfo) return loadingInfo;
      let arr = Array.isArray(fpsArr) ? fpsArr : null;
      if (!arr) {
        const st = chartMgr._data.fps;
        arr = (st && st.series && st.series[0]) || [];
      }
      if (!arr.length) {
        // 空序列不缓存，等有数据了再算
        return {
          target: null, segments: [], mask: new Uint8Array(0),
          excludedSamples: 0, totalSamples: 0, excludedRatio: 0,
        };
      }
      loadingInfo = analyseLoading(arr);
      return loadingInfo;
    }

    /** 把被剔除位置置 null（交给原统计函数，它们会自动跳过非数值） */
    function maskToNull(arr, mask) {
      const out = (arr || []).slice();
      if (!mask) return out;
      for (let k = 0; k < out.length; k += 1) if (mask[k]) out[k] = null;
      return out;
    }

    /* 页面尾部的追加区块（弱网总结分析）跑在独立 IIFE 里，拿不到这里的闭包。
       把「加载段剔除」的口径桥出去，免得在别处再抄一份规则、两边慢慢走偏。 */
    window.PerfStats = {
      analyseLoading: analyseLoading,
      fpsTargetOfSeries: fpsTargetOfSeries,
      maskToNull: maskToNull,
    };

    /** 生成一份「FPS 家族已剔除加载段」的采样点副本，供卡片 / 解读使用（其他指标不动） */
    function fpsStatPts(pts) {
      const info = ensureLoadingInfo((pts || []).map(p => p.fps));
      if (!info.excludedSamples) return pts;
      // iOS 的 pts 用 bigjank（小写），Android/PC 用 bigJank，两种都要清，否则 iOS 的
      // BigJank 会把加载段里的卡顿帧继续算进去（表现为「满帧却有 4 次大卡顿」）。
      return pts.map((p, i) => info.mask[i]
        ? Object.assign({}, p, {
            fps: null, jank: null, bigJank: null, bigjank: null,
            smallJank: null, tinyJank: null,
            // v1.9：归因计数也必须随加载段一起剔除，否则解读写「已排除加载段」，
            // 但卡顿归因条目仍把加载段的 FrameTimeline 计数算进去，两处口径打架。
            jankAttr: null,
          })
        : p);
    }

    /** 加载段说明文案：报告里必须写清楚剔除了什么，否则等于藏数据 */
    function loadingNoteText() {
      const info = ensureLoadingInfo();
      if (!info.excludedSamples) return '';
      const times = chartMgr._data.fps ? chartMgr._data.fps.times : [];
      const fmtT = (idx) => (times[idx] != null ? String(times[idx]) : String(idx));
      const parts = info.segments.map(g => (g.start === g.end
        ? fmtT(g.start)
        : `${fmtT(g.start)}–${fmtT(g.end)}`));
      const secs = info.excludedSamples; // 采样间隔 1s，样本数即秒数
      return `FPS 统计已排除 ${info.segments.length} 段加载期（共 ${secs}s，占 ${(info.excludedRatio * 100).toFixed(1)}%）：`
        + `${parts.join('、')}。曲线照常显示，底纹为被排除区间；原始全程均值见统计表「FPS(全程)」行。`;
    }

    /** 加载段的底纹数据（只打在 FPS 图上，颜色与 tag 子场景区分） */
    function buildLoadingMarkAreas(times) {
      const info = ensureLoadingInfo();
      if (!info.segments.length || !times || !times.length) return [];
      return info.segments.map(g => {
        const s = Math.max(0, Math.min(times.length - 1, g.start));
        const e = Math.max(0, Math.min(times.length - 1, g.end));
        return [
          { xAxis: times[s], itemStyle: { color: 'rgba(255, 176, 32, 0.22)' } },
          { xAxis: times[e] },
        ];
      });
    }

    /** 加载段说明：剔除了什么必须写在报告里，否则等于藏数据 */
    function renderLoadingNote() {
      const cards = document.querySelector('section.cards');
      if (!cards || !cards.parentNode) return;
      let el = document.getElementById('loading-note');
      const text = loadingNoteText();
      if (!text) { if (el) el.remove(); return; }
      if (!el) {
        el = document.createElement('div');
        el.id = 'loading-note';
        el.style.cssText = 'margin:10px 0 2px;padding:8px 12px;border-radius:8px;'
          + 'background:rgba(255,196,0,0.10);border:1px solid rgba(255,196,0,0.35);'
          + 'color:var(--text2);font-size:12px;line-height:1.6;';
        cards.parentNode.insertBefore(el, cards.nextSibling);
      }
      el.textContent = text;
    }

    /**
     * PerfDog 口径的帧率质量派生指标（整段统计，不随框选区变化）。
     * 返回一组可直接塞进统计表的行：1%Low / Drop / FPS≥目标 / 稳帧范围 / 标准差 / 卡顿时长占比
     * 以及 Jank / BigJank / SmallJank / TinyJank 的「每 10 分钟」次数与帧耗时标准差/方差。
     * 这些口径与 src/reports-data-js.js 的 summarizePerf 完全一致。
     */
    function perfFpsQualityRows(fpsArr, jankArr, bjArr, sjArr, tjArr, target, durSec) {
      const rows = [];
      // 加载段剔除：FPS 家族全部按掩码置 null；时长基数同步缩短，
      // 否则 Drop/10min 这类「按时间折算」的指标会因为分母没变而虚高。
      const info = ensureLoadingInfo();
      const mask = info.excludedSamples ? info.mask : null;
      const rawNums = (fpsArr || []).filter(v => typeof v === 'number' && !isNaN(v) && v >= 0);
      if (mask) {
        fpsArr = maskToNull(fpsArr, mask);
        jankArr = maskToNull(jankArr, mask);
        bjArr = maskToNull(bjArr, mask);
        sjArr = maskToNull(sjArr, mask);
        tjArr = maskToNull(tjArr, mask);
        if (durSec) durSec = durSec * (1 - info.excludedRatio);
      }
      const nums = (fpsArr || []).filter(v => typeof v === 'number' && !isNaN(v) && v >= 0);
      if (!nums.length || !target) return rows;
      const avg = nums.reduce((a, b) => a + b, 0) / nums.length;
      const moving = nums.filter(v => v > 0);

      const push = (metric, unit, v) =>
        rows.push({ metric, raw: metric, unit, mean: v, max: v, p98: v });

      // 全程均值（含加载段）：与「FPS」行并列，保证剔除前后都能看到
      if (mask && rawNums.length) {
        const rawAvg = rawNums.reduce((a, b) => a + b, 0) / rawNums.length;
        push('FPS(全程)', '帧/s', +rawAvg.toFixed(1));
      }
      // 达帧率（均值口径）
      push('达帧率', '%', +(avg / target * 100).toFixed(1));
      // 均帧 Avg(FTime)
      if (moving.length) {
        const ft = moving.reduce((a, v) => a + 1000 / v, 0) / moving.length;
        push('均帧', 'ms', +ft.toFixed(1));
        // Std(FTime) / Var(FTime)：帧耗时标准差/方差（PerfDog FTime 统计族）
        const varFt = moving.reduce((a, v) => a + (1000 / v - ft) * (1000 / v - ft), 0) / moving.length;
        push('帧耗时标准差', 'ms', +Math.sqrt(varFt).toFixed(2));
        push('帧耗时方差', 'ms²', +varFt.toFixed(1));
      }
      // 低帧占比（FPS < 目标 80%）
      const low = nums.filter(v => v < target * 0.8).length;
      push('低帧占比', '%', +((low / nums.length) * 100).toFixed(1));

      // 1%Low
      if (moving.length) {
        const ftList = moving.map(v => 1000 / v).sort((a, b) => b - a);
        const k = Math.max(1, Math.round(ftList.length * 0.01));
        const worstFt = ftList.slice(0, k).reduce((a, b) => a + b, 0) / k;
        push('1%Low', '帧/s', +(1000 / worstFt).toFixed(1));
      }

      // Drop(FPS)：相邻两点下降 > 8 帧的次数，按小时折算（PerfDog 定义）
      const durHour = durSec ? durSec / 3600 : null;
      let drop = 0;
      for (let i = 1; i < nums.length; i++) if (nums[i - 1] - nums[i] > 8) drop++;
      push('Drop', '帧/时', durHour ? +(drop / durHour).toFixed(1) : drop);

      // FPS≥目标：样本口径（达到目标帧率的采样占比）
      const ge = nums.filter(v => v >= target).length;
      push('FPS≥目标', '%', +((ge / nums.length) * 100).toFixed(1));

      // 稳帧范围 MedRange：偏离中位数 ±20% 内的占比
      const sorted = nums.slice().sort((a, b) => a - b);
      const mi = (sorted.length - 1) / 2;
      const median = sorted.length % 2 ? sorted[mi]
        : (sorted[Math.floor(mi)] + sorted[Math.ceil(mi)]) / 2;
      const inMed = nums.filter(v => Math.abs(v - median) <= median * 0.2).length;
      push('稳帧范围', '%', +((inMed / nums.length) * 100).toFixed(1));

      // 帧率标准差
      const variance = nums.reduce((a, v) => a + (v - avg) * (v - avg), 0) / nums.length;
      push('帧率标准差', '帧/s', +Math.sqrt(variance).toFixed(2));

      // Stutter（卡顿时长占比）：帧间隔 > 2×目标帧间隔 的时间 ÷ 总时间
      const targetFt = 1000 / target;
      let slow = 0, total = 0;
      for (const v of moving) { const t = 1000 / v; total += t; if (t > targetFt * 2) slow += t; }
      if (total > 0) push('卡顿时长占比', '%', +((slow / total) * 100).toFixed(1));

      // Jank / BigJank / SmallJank 每 10 分钟次数
      const per10 = (arr) => {
        const n = (arr || []).filter(v => typeof v === 'number' && !isNaN(v) && v >= 0);
        if (!n.length) return null;
        const sum = n.reduce((a, b) => a + b, 0);
        const durMin = durSec ? durSec / 60 : null;
        return durMin > 0 ? +(sum / durMin * 10).toFixed(1) : +sum.toFixed(1);
      };
      const j10 = per10(jankArr), bj10 = per10(bjArr), sj10 = per10(sjArr), tj10 = per10(tjArr);
      if (j10 != null) push('Jank/10min', '次', j10);
      if (bj10 != null) push('BigJank/10min', '次', bj10);
      if (sj10 != null) push('SmallJank/10min', '次', sj10);
      if (tj10 != null) push('TinyJank/10min', '次', tj10);

      // ── 现代帧指标（口径版本 2）──────────────────────────────────────────
      // 这些字段由采集端按「每个采样窗口内的逐帧分布」算出（见 src/adb.js
      // analyseHistogram / calcJankFramestats），无法从秒级 FPS 反推，
      // 因此直接读 data.perf。旧报告 / iOS / PC 没有这些字段时整段跳过，
      // 不显示 0 —— 未测量与测得零是两回事。
      const perfRowsM = (typeof data !== 'undefined' && data && Array.isArray(data.perf)) ? data.perf : [];
      const colOf = (key) => perfRowsM
        .map(r => (r && typeof r[key] === 'number' && isFinite(r[key])) ? r[key] : null)
        .filter(v => v != null);
      const addCol = (label, unit, key, digits) => {
        const vs = colOf(key);
        if (!vs.length) return;
        let sum = 0, mx = -Infinity;
        for (const v of vs) { sum += v; if (v > mx) mx = v; }
        rows.push({
          metric: label, raw: label, unit,
          mean: +(sum / vs.length).toFixed(digits),
          max: +mx.toFixed(digits),
          p98: +mx.toFixed(digits),
        });
      };
      addCol('帧耗时 P95', 'ms', 'ftP95', 1);
      addCol('帧耗时 P99', 'ms', 'ftP99', 1);
      addCol('卡顿帧占比', '%', 'jankyRatio', 1);
      addCol('Hitch', 'ms/s', 'hitchMsPerSec', 1);
      addCol('超帧时限 P99', 'ms', 'overrunP99', 1);
      addCol('最长单帧超时', 'ms', 'overrunMax', 1);

      return rows;
    }

    /** 解读总结用的精简版帧率质量指标（返回对象，不直接出表） */
    function perfFpsQualityInsight(fpsNums, target, durSec) {
      const nums = (fpsNums || []).filter(v => typeof v === 'number' && !isNaN(v) && v >= 0);
      if (!nums.length || !target) return null;
      const avg = nums.reduce((a, b) => a + b, 0) / nums.length;
      const moving = nums.filter(v => v > 0);

      // 1%Low
      let oneLow = null;
      if (moving.length) {
        const ftList = moving.map(v => 1000 / v).sort((a, b) => b - a);
        const k = Math.max(1, Math.round(ftList.length * 0.01));
        const worstFt = ftList.slice(0, k).reduce((a, b) => a + b, 0) / k;
        oneLow = 1000 / worstFt;
      }

      // Drop / 时
      const durHour = durSec ? durSec / 3600 : null;
      let drop = 0;
      for (let i = 1; i < nums.length; i++) if (nums[i - 1] - nums[i] > 8) drop++;
      const dropRate = durHour ? drop / durHour : drop;

      // 稳帧范围 MedRange
      const sorted = nums.slice().sort((a, b) => a - b);
      const mi = (sorted.length - 1) / 2;
      const median = sorted.length % 2 ? sorted[mi]
        : (sorted[Math.floor(mi)] + sorted[Math.ceil(mi)]) / 2;
      const inMed = nums.filter(v => Math.abs(v - median) <= median * 0.2).length;
      const medRange = (inMed / nums.length) * 100;

      // Stutter
      const targetFt = 1000 / target;
      let slow = 0, total = 0;
      for (const v of moving) { const t = 1000 / v; total += t; if (t > targetFt * 2) slow += t; }
      const stutter = total > 0 ? (slow / total) * 100 : null;

      return { oneLow, drop: dropRate, medRange, stutter };
    }

    /**
     * FPS 派生指标（与卡片、解读总结同一口径）：
     *  - 达帧率   = 平均 FPS ÷ 目标帧率 × 100
     *  - 均帧     = 各采样点帧间隔（1000 / FPS）的平均，ms
     *  - 低帧占比 = FPS 低于目标 80% 的采样点占比
     */
    function fpsDerivedMetrics(arr, target) {
      // 0 帧是真实掉到 0 的情况：计入均值与低帧；只有均帧（1000/FPS）要除，需排除 0
      const nums = (arr || []).filter(v => typeof v === 'number' && !isNaN(v) && v >= 0);
      if (!nums.length || !target) return null;
      const avg = nums.reduce((a, b) => a + b, 0) / nums.length;
      const moving = nums.filter(v => v > 0);
      const frameTime = moving.length ? moving.reduce((a, v) => a + 1000 / v, 0) / moving.length : null;
      const low = nums.filter(v => v < target * 0.8).length;
      // 1%Low：从秒级 FPS 反推帧时，取最慢 1% 采样点求平均再折算。
      // 注意这不是行业（PresentMon）的逐帧 1% Low：一秒内的单帧 hitch 会被秒均抹平，
      // 判断单帧卡顿请看帧耗时 P99 / Hitch / 超帧时限。
      let oneLow = null;
      if (moving.length) {
        const ftList = moving.map(v => 1000 / v).sort((a, b) => b - a);
        const k = Math.max(1, Math.round(ftList.length * 0.01));
        const worstFt = ftList.slice(0, k).reduce((a, b) => a + b, 0) / k;
        oneLow = 1000 / worstFt;
      }
      return {
        target, avg,
        reach: (avg / target) * 100,
        frameTime,
        lowPct: (low / nums.length) * 100,
        lowCount: low,
        oneLow,
      };
    }

    /** 达帧率 / 均帧 / 低帧 三张补充卡片（插在原有指标卡后面） */
    function renderFpsKpiCards(fm) {
      const cards = document.querySelector('section.cards');
      if (!cards) return;
      const ids = ['card-reach', 'card-ft', 'card-low', 'card-1low'];
      if (!fm) {
        ids.forEach(id => { const c = document.getElementById(id); if (c) c.hidden = true; });
        return;
      }
      const defs = [
        { id: 'card-reach', val: 'val-reach', label: '达帧率', info: 'reach', unit: '% · 目标 ' + fm.target },
        { id: 'card-ft',    val: 'val-ft',    label: '均帧',   info: 'frametime', unit: 'ms' },
        { id: 'card-low',   val: 'val-low',   label: '低帧占比', info: 'lowpct', unit: '% · <' + Math.round(fm.target * 0.8) + ' 帧' },
        { id: 'card-1low',  val: 'val-1low',  label: '1%Low',  info: 'onelow', unit: '帧/s' },
      ];
      for (const d of defs) {
        let card = document.getElementById(d.id);
        if (!card) {
          card = document.createElement('div');
          card.id = d.id;
          card.className = 'card';
          card.innerHTML = '<div class="card-label"></div><div class="card-value" id="' + d.val + '"></div><div class="card-unit"></div>';
          cards.appendChild(card);
        }
        card.hidden = false;
        const _lb = card.querySelector('.card-label');
        _lb.textContent = d.label;
        if (d.info && window.MetricInfo) { _lb.setAttribute('data-info', d.info); MetricInfo.decorate(_lb); }
        card.querySelector('.card-unit').textContent = d.unit;
      }
      setText('val-reach', fm.reach.toFixed(1));
      setText('val-ft', fm.frameTime == null ? '--' : fm.frameTime.toFixed(1));
      setText('val-low', fm.lowPct.toFixed(1));
      setText('val-1low', fm.oneLow == null ? '--' : fm.oneLow.toFixed(1));
      paintCard('card-reach', fm.reach >= 95 ? 'good' : (fm.reach >= 80 ? 'warn' : 'bad'));
      const idealFt = 1000 / fm.target;
      paintCard('card-ft', fm.frameTime == null ? null
        : (fm.frameTime <= idealFt * 1.05 ? 'good' : (fm.frameTime <= idealFt * 1.2 ? 'warn' : 'bad')));
      paintCard('card-low', fm.lowPct <= 2 ? 'good' : (fm.lowPct <= 10 ? 'warn' : 'bad'));
      paintCard('card-1low', fm.oneLow == null ? null
        : (fm.oneLow >= fm.target * 0.95 ? 'good' : (fm.oneLow >= fm.target * 0.85 ? 'warn' : 'bad')));
    }

    /** 给卡片打状态色（good / warn / bad），一眼看出好坏 */
    function paintCard(cardId, state) {
      const card = document.getElementById(cardId);
      if (!card) return;
      if (!state) {
        card.removeAttribute('data-state');
        card.style.removeProperty('--card-color');
        return;
      }
      card.setAttribute('data-state', state);
      const color = state === 'good' ? 'var(--green)'
        : state === 'warn' ? 'var(--orange)'
        : state === 'bad' ? 'var(--red)' : '';
      if (color) card.style.setProperty('--card-color', color);
      else card.style.removeProperty('--card-color');
    }
