    /** 卡片补充说明：GPU 不支持 / 温度无数据 / BigJank 本次为 0 */
    function annotateMetricCards(pts) {
      const setUnit = (cardId, unit) => {
        const el = document.querySelector('#' + cardId + ' .card-unit');
        if (el) el.textContent = unit;
      };
      const setValue = (valId, text) => {
        const el = document.getElementById(valId);
        if (el) el.textContent = text;
      };
      if (seriesNoData(pts.map(p => p.gpu), true)) {
        const gt = pts.map(p => p.gpuTemp);
        if (!seriesNoData(gt, true)) {
          // 利用率读不到，但 GPU 温度可得：卡片与图表标题都改用温度，避免整块空白
          const nums = gt.filter(v => typeof v === 'number' && !isNaN(v) && v > 0);
          const avg = nums.reduce((a, b) => a + b, 0) / nums.length;
          setValue('val-gpu', avg.toFixed(1));
          setUnit('card-gpu', '\u00b0C \u00b7 \u5229\u7528\u7387\u9700root');
          const gpuLabel = document.querySelector('#card-gpu .card-label');
          if (gpuLabel) {
            gpuLabel.textContent = 'GPU \u6e29\u5ea6';
            gpuLabel.setAttribute('data-info', 'gputemp');
            if (window.MetricInfo) MetricInfo.decorate(gpuLabel);
          }
          const el = document.getElementById('chart-gpu');
          const title = el && el.closest('.chart-wrap')
            ? el.closest('.chart-wrap').querySelector('.chart-title') : null;
          if (title) {
            title.textContent = 'GPU \u6e29\u5ea6\uff08\u5229\u7528\u7387\u9700 root\uff09';
            title.setAttribute('data-info', 'gputemp');
            if (window.MetricInfo) MetricInfo.decorate(title);
          }
        } else {
          setUnit('card-gpu', '需 root');
          setValue('val-gpu', '--');
        }
      }
      if (seriesNoData(pts.map(p => p.temperature), true)) {
        setUnit('card-temp', '无数据');
        setValue('val-temp', '--');
      }
      const bj = pts.map(p => p.bigJank).filter(v => typeof v === 'number' && !isNaN(v));
      if (bj.length && bj.every(v => v === 0)) {
        const lab = document.querySelector('#card-bigjank .card-label');
        if (lab) {
          lab.textContent = 'BigJank · 无>125ms帧';
          if (window.MetricInfo) MetricInfo.decorate(lab);
        }
      }

      /* ---- 阈值着色：把「好 / 一般 / 差」直接画到卡片上 ---- */
      const target = fpsTargetOf(pts);
      const fpsArr = pts.map(p => p.fps).filter(v => typeof v === 'number' && !isNaN(v));
      if (fpsArr.length && target) {
        const avg = fpsArr.reduce((a, b) => a + b, 0) / fpsArr.length;
        const r = avg / target;
        paintCard('card-fps', r >= 0.95 ? 'good' : (r >= 0.8 ? 'warn' : 'bad'));
      }
      const cpuArr = pts.map(p => p.cpu && p.cpu.sysCpu).filter(v => typeof v === 'number' && !isNaN(v));
      if (cpuArr.length) {
        const avg = cpuArr.reduce((a, b) => a + b, 0) / cpuArr.length;
        paintCard('card-cpu', avg >= 85 ? 'bad' : (avg >= 65 ? 'warn' : 'good'));
      }
      const jankRates = pts.map(p => {
        const j = p.jank, f = p.fps;
        return (typeof j === 'number' && typeof f === 'number' && f > 0) ? (j / f) * 100 : null;
      }).filter(v => v != null && !isNaN(v));
      if (jankRates.length) {
        const avg = jankRates.reduce((a, b) => a + b, 0) / jankRates.length;
        paintCard('card-jank', avg <= 2 ? 'good' : (avg <= 8 ? 'warn' : 'bad'));
      }
      if (bj.length) {
        const sum = bj.reduce((a, b) => a + b, 0);
        paintCard('card-bigjank', sum === 0 ? 'good' : (sum <= 2 ? 'warn' : 'bad'));
      }
      const temps = pts.map(p => p.temperature).filter(v => typeof v === 'number' && v > 0);
      if (temps.length) {
        const mx = Math.max.apply(null, temps);
        paintCard('card-temp', mx < 42 ? 'good' : (mx < 48 ? 'warn' : 'bad'));
      }
    }

    function calcMeanMax(arr) {
      const nums = (arr || []).filter(v => typeof v === 'number' && !isNaN(v));
      if (!nums.length) return { mean: null, max: null };
      let sum = 0;
      let mx = -Infinity;
      for (const v of nums) { sum += v; if (v > mx) mx = v; }
      return { mean: sum / nums.length, max: mx };
    }

    /* ==========================================================
     * 解读总结
     * 纯前端根据已渲染的 pts 推导结论，不依赖服务端。
     * 输出：总评徽章 + 一句话结论 + 分项解读 + 风险提示。
     * ========================================================== */

    function iNums(vals) {
      return (vals || []).filter(v => typeof v === 'number' && !isNaN(v));
    }

    function iMean(vals) {
      const a = iNums(vals);
      if (!a.length) return null;
      let s = 0;
      for (const v of a) s += v;
      return s / a.length;
    }

    function iPct(vals, p) {
      const a = iNums(vals).slice().sort((x, y) => x - y);
      if (!a.length) return null;
      const i = (a.length - 1) * p;
      const lo = Math.floor(i), hi = Math.ceil(i);
      return lo === hi ? a[lo] : a[lo] + (a[hi] - a[lo]) * (i - lo);
    }

    /** 按候选路径取一列数值（同一列内逐点回退，兼容 android/pc/ios 不同字段名） */
    function iCol(pts, paths) {
      return (pts || []).map(p => {
        for (const path of paths) {
          let cur = p;
          for (const k of path.split('.')) cur = (cur == null ? undefined : cur[k]);
          if (typeof cur === 'number' && !isNaN(cur)) return cur;
        }
        return null;
      });
    }

    function iFmt(v, d) {
      return (typeof v === 'number' && !isNaN(v)) ? v.toFixed(d == null ? 1 : d) : '--';
    }

    /** 报告时长（秒）：优先用原始时间戳差值 */
    function iDurationSec() {
      const rows = (typeof perf !== 'undefined' && Array.isArray(perf)) ? perf : [];
      const ts = iNums(rows.map(it => {
        if (!it) return null;
        const t = it.timestamp;
        if (typeof t === 'number') return t;
        const p = Date.parse(String(t));
        return isNaN(p) ? null : p;
      }));
      if (ts.length >= 2) return Math.max(1, Math.round((Math.max.apply(null, ts) - Math.min.apply(null, ts)) / 1000));
      return null;
    }

    function iDurationText(sec) {
      if (sec == null) return '--';
      if (sec < 60) return sec + ' 秒';
      const m = Math.floor(sec / 60), s = sec % 60;
      return s ? (m + ' 分 ' + s + ' 秒') : (m + ' 分钟');
    }

    /** 首段 vs 末段（各取 30%）均值差，用于判断内存增长趋势 */
    function iTrend(vals) {
      const a = iNums(vals);
      if (a.length < 6) return null;
      const k = Math.max(2, Math.round(a.length * 0.3));
      const head = iMean(a.slice(0, k));
      const tail = iMean(a.slice(a.length - k));
      if (head == null || tail == null || head === 0) return null;
      return { head, tail, delta: tail - head, pct: ((tail - head) / head) * 100 };
    }

    function iLevelOfScore(score) {
      if (score >= 88) return { level: 'great', text: '优秀' };
      if (score >= 72) return { level: 'good',  text: '良好' };
      if (score >= 55) return { level: 'warn',  text: '一般' };
      return { level: 'bad', text: '较差' };
    }

    function iToneOfJank(rate) {
      if (rate == null) return 'info';
      if (rate <= 1) return 'good';
      if (rate <= 5) return 'warn';
      return 'bad';
    }

    /**
     * 生成解读数据。
     * @returns {{level:string,levelText:string,lead:string,items:Array,risks:Array}}
     */
    function buildInsight(pts, category) {
      const out = { level: 'good', levelText: '良好', lead: '', items: [], risks: [] };
      const n = (pts || []).length;
      const durSec = iDurationSec();
      out.n = n;
      out.durSec = durSec;

      if (!n) {
        out.level = 'warn';
        out.levelText = '无数据';
        out.lead = '本次报告没有任何采样点，无法给出解读。请确认采集过程中设备保持连接。';
        return out;
      }

      /* ---------- iOS GPU 专项：只有 GPU 计数器，单独解读 ---------- */
      if (category === 'ios_gpu') {
        const alu  = iMean(iCol(pts, ['ALU Utilization']));
        const frag = iMean(iCol(pts, ['Fragment Occupancy']));
        const vert = iMean(iCol(pts, ['Vertex Occupancy']));
        const tex  = iMean(iCol(pts, ['Texture Sample Limiter']));
        const rbw  = iMean(iCol(pts, ['GPU Read Bandwidth']));
        const wbw  = iMean(iCol(pts, ['GPU Write Bandwidth']));
        const pr   = iMean(iCol(pts, ['Partial Renders']));

        const pushItem = (k, v, note, tone) => out.items.push({ k, v, note, tone });

        let hot = null;
        if (alu != null) {
          const tone = alu >= 90 ? 'warn' : (alu >= 60 ? 'info' : 'good');
          const note = alu >= 90 ? '着色器算力接近饱和' : (alu >= 60 ? '算力占用较高' : '算力仍有余量');
          pushItem('ALU', '均值 ' + iFmt(alu, 1) + '%', note, tone);
          hot = hot == null || alu > hot ? 'ALU' : hot;
        }
        if (frag != null) {
          const tone = frag >= 85 ? 'warn' : (frag >= 50 ? 'info' : 'good');
          pushItem('Fragment', '均值 ' + iFmt(frag, 1) + '%',
            frag >= 85 ? '片元阶段压力大，注意过度绘制' : (frag >= 50 ? '片元占用中等' : '片元阶段轻松'), tone);
          if (frag >= 85) hot = hot || 'Fragment';
        }
        if (vert != null) pushItem('Vertex', '均值 ' + iFmt(vert, 1) + '%',
          vert >= 80 ? '顶点处理接近上限' : '顶点处理正常', vert >= 80 ? 'warn' : 'good');
        if (tex != null) pushItem('纹理采样', '均值 ' + iFmt(tex, 1) + '%',
          tex >= 80 ? '采样受限，可能是带宽或缓存瓶颈' : '采样限制正常', tex >= 80 ? 'warn' : 'good');
        if (rbw != null || wbw != null) {
          pushItem('带宽', '读 ' + iFmt(rbw, 2) + ' / 写 ' + iFmt(wbw, 2) + ' GB/s',
            '反映显存访问压力', 'info');
        }
        if (pr != null) pushItem('Partial Renders', '均值 ' + iFmt(pr, 0),
          pr > 0 ? '存在分块渲染，通常与混合/遮罩有关' : '未出现分块渲染', pr > 0 ? 'info' : 'good');

        const lv = (alu != null && alu >= 90) || (frag != null && frag >= 85)
          ? { level: 'warn', text: 'GPU 高负载' }
          : (alu != null || frag != null ? { level: 'good', text: 'GPU 正常' } : { level: 'warn', text: '数据不足' });
        out.level = lv.level;
        out.levelText = lv.text;
        out.lead = '本次为 iOS GPU 专项采集，共 <b>' + n + '</b> 个采样点，时长 ' + iDurationText(durSec)
          + '。' + (alu != null ? ('ALU 利用率均值 <b>' + iFmt(alu, 1) + '%</b>') : '')
          + (frag != null ? ('，Fragment 占用 <b>' + iFmt(frag, 1) + '%</b>') : '')
          + (rbw != null ? ('，读带宽 <b>' + iFmt(rbw, 2) + ' GB/s</b>') : '')
          + '。' + (hot ? (hot + ' 是本次采集的主要压力点。') : '各阶段占用均衡，未发现明显瓶颈。');

        if (alu != null && alu >= 90) out.risks.push({ tone: 'high', text: 'ALU 利用率长期高于 90%，着色器指令数或循环次数可能需要优化。' });
        if (frag != null && frag >= 85) out.risks.push({ tone: 'mid', text: 'Fragment 占用 ' + iFmt(frag, 1) + '%，建议检查过度绘制、透明混合与后处理链路。' });
        if (tex != null && tex >= 80) out.risks.push({ tone: 'mid', text: '纹理采样限制偏高，可考虑压缩纹理、降低采样次数或开启 mipmap。' });
        if (!out.risks.length) out.risks.push({ tone: 'info', text: '未发现明显 GPU 瓶颈，各阶段占用处于合理区间。' });
        return out;
      }

      /* ---------- 取值 ---------- */
      const fpsCol   = iCol(pts, ['fps']);
      const jankCol  = iCol(pts, ['jankRate', 'jank_rate']);
      const bjCol    = iCol(pts, ['bigJank', 'bigjank', 'big_jank']);
      const cpuSys   = iCol(pts, ['cpu.sysCpu', 'cpuTotalSystem', 'cpuUsage']);
      const cpuProc  = iCol(pts, ['cpu.procCpu']);
      const memCol   = iCol(pts, ['mem.totalPss', 'physFootprint', 'memResidentSize']);
      const tempCol  = iCol(pts, ['temperature']);
      const gpuCol   = iCol(pts, ['gpu']);
      const gpuTCol  = iCol(pts, ['gpuTemp']);

      const fpsMean = iMean(fpsCol);
      const fpsP5   = iPct(fpsCol, 0.05);
      const fpsP95  = iPct(fpsCol, 0.95);
      const fpsMax  = fpsP95;
      const jankMean = iMean(jankCol);
      const bjNums  = iNums(bjCol);
      const bjSum   = bjNums.reduce((a, b) => a + b, 0);
      const cpuSysMean  = iMean(cpuSys);
      const cpuProcMean = iMean(cpuProc);
      const memMean  = iMean(memCol);
      const memMax   = iPct(memCol, 1);
      const memTrend = iTrend(memCol);
      const tempMean = iMean(tempCol);
      const tempMax  = iPct(tempCol, 1);
      const gpuMean  = iMean(gpuCol);
      const gpuTMean = iMean(gpuTCol);
      const gpuTMax  = iPct(gpuTCol, 1);
      const hasGpuUtil = gpuMean != null && iNums(gpuCol).some(v => v > 0);
      const hasGpuTemp = gpuTMean != null && iNums(gpuTCol).some(v => v > 0);

      /* ---------- 帧率目标：从 P95 吸附到常见刷新率 ---------- */
      let fpsTarget = null;
      if (fpsP95 != null && fpsP95 > 0) {
        const cands = [30, 45, 60, 90, 120, 144, 165];
        for (const c of cands) { if (c >= fpsP95 * 0.97) { fpsTarget = c; break; } }
        if (fpsTarget == null) fpsTarget = Math.ceil(fpsP95 / 30) * 30;
      }

      /* ---------- 评分 ---------- */
      let score = null;
      if (fpsMean != null && fpsTarget) {
        const fpsScore = Math.max(0, Math.min(100, (fpsMean / fpsTarget) * 100));
        const jankScore = jankMean == null ? 85 : Math.max(0, Math.min(100, 100 - jankMean * 9));
        const lowRatio = fpsP5 != null ? Math.max(0, Math.min(1, fpsP5 / fpsTarget)) : 0.85;
        const stabScore = Math.max(0, Math.min(100, lowRatio * 100));
        let bjPenalty = 0;
        if (bjNums.length) {
          const perMin = durSec ? (bjSum / Math.max(1, durSec / 60)) : bjSum;
          bjPenalty = Math.min(25, perMin * 2);
        }
        score = Math.round(0.5 * fpsScore + 0.28 * jankScore + 0.22 * stabScore - bjPenalty);
        score = Math.max(0, Math.min(100, score));
      }

      /* ================= 分项解读 ================= */

      // FPS
      if (fpsMean != null) {
        let tone = 'info', note = '';
        if (fpsTarget) {
          const r = fpsMean / fpsTarget;
          if (r >= 0.97) { tone = 'good'; note = '基本满帧'; }
          else if (r >= 0.85) { tone = 'good'; note = '轻微掉帧'; }
          else if (r >= 0.7) { tone = 'warn'; note = '掉帧明显'; }
          else { tone = 'bad'; note = '帧率严重不足'; }
        }
        const range = (fpsP5 != null && fpsMax != null)
          ? ('（P5 ' + iFmt(fpsP5, 0) + ' / 峰值 ' + iFmt(fpsMax, 0) + '）') : '';
        out.items.push({
          k: 'FPS',
          v: '均值 ' + iFmt(fpsMean, 1) + (fpsTarget ? (' / 目标 ' + fpsTarget) : ''),
          note: note + range,
          tone,
        });
      }

      // 达帧率 / 均帧 / 低帧
      const fpsNums = fpsCol.filter(v => v != null);
      const fm = fpsDerivedMetrics(fpsNums, fpsTarget);
      if (fm) {
        const tone = fm.reach >= 95 ? 'good' : (fm.reach >= 80 ? 'warn' : 'bad');
        out.items.push({
          k: '帧率质量',
          v: '达帧率 ' + iFmt(fm.reach, 1) + '% · 均帧 ' + (fm.frameTime == null ? '--' : iFmt(fm.frameTime, 1) + 'ms') + ' · 低帧 ' + iFmt(fm.lowPct, 1) + '%',
          note: '低帧 = FPS < ' + Math.round(fm.target * 0.8) + ' 的采样（' + fm.lowCount + '/' + fpsNums.length + ' 点）',
          tone,
        });
      }

      // 帧率质量补充（PerfDog 口径）：1%Low / 卡顿时长 / 降帧 / 稳帧范围
      if (fm) {
        const q = perfFpsQualityInsight(fpsNums, fpsTarget, durSec);
        if (q) {
          if (q.oneLow != null) {
            const tone = q.oneLow >= fpsTarget * 0.95 ? 'good' : (q.oneLow >= fpsTarget * 0.85 ? 'warn' : 'bad');
            out.items.push({
              k: '1%Low', v: iFmt(q.oneLow, 1) + ' 帧/s',
              note: '最差 1% 帧段的平均帧率，越低越卡', tone,
            });
          }
          if (q.stutter != null) {
            const tone = q.stutter >= 15 ? 'bad' : (q.stutter >= 8 ? 'warn' : 'good');
            out.items.push({
              k: '卡顿时长', v: '占比 ' + iFmt(q.stutter, 1) + '%',
              note: '帧间隔 > 2×目标帧间隔 的时间占比', tone,
            });
          }
          if (q.drop != null) {
            const tone = q.drop >= 30 ? 'bad' : (q.drop >= 10 ? 'warn' : 'good');
            out.items.push({
              k: '降帧', v: q.drop.toFixed(1) + ' 次/时',
              note: '相邻采样 FPS 骤降 >8 帧（PerfDog Drop 口径）', tone,
            });
          }
          if (q.medRange != null) {
            const tone = q.medRange >= 80 ? 'good' : (q.medRange >= 60 ? 'warn' : 'bad');
            out.items.push({
              k: '稳帧范围', v: iFmt(q.medRange, 1) + '%',
              note: '落在中位数 ±20% 内的采样占比', tone,
            });
          }
        }
      }

      // 上下文切换 / CPU 限频（PerfDog 对齐：CSwitch > 14000/s 会被系统 kill）
      const csCol = iCol(pts, ['cswitch']);
      const csNums = iNums(csCol);
      const csAvg = csNums.length ? csNums.reduce((a, b) => a + b, 0) / csNums.length : null;
      const limitCol = iCol(pts, ['cpuLimit']);
      const limitNums = iNums(limitCol);
      const limitMin = limitNums.length ? Math.min.apply(null, limitNums) : null;
      if (csAvg != null) {
        const tone = csAvg >= 14000 ? 'bad' : (csAvg >= 8000 ? 'warn' : 'info');
        out.items.push({
          k: '上下文切换', v: '均值 ' + iFmt(csAvg, 0) + ' 次/s',
          note: csAvg >= 14000 ? '超过 14000/s，存在被系统 kill 风险' : '参考阈值 14000/s',
          tone,
        });
        if (csAvg >= 14000) out.risks.push({ tone: 'high', text: '上下文切换均值 ' + iFmt(csAvg, 0) + ' 次/s，超过 PerfDog 阈值 14000/s，进程可能被系统终止。' });
        else if (csAvg >= 8000) out.risks.push({ tone: 'mid', text: '上下文切换 ' + iFmt(csAvg, 0) + ' 次/s 偏高，线程调度开销大，可排查频繁唤醒。' });
      }
      if (limitMin != null && limitMin < 100) {
        out.risks.push({
          tone: 'mid',
          text: 'CPU 可调度最大频率被限制在硬件上限的 ' + iFmt(limitMin, 0) + '%（疑似温控降频），高负载场景帧率会受影响。',
        });
      }

      // CPU
      if (cpuSysMean != null || cpuProcMean != null) {
        const parts = [];
        if (cpuSysMean != null) parts.push('系统 ' + iFmt(cpuSysMean, 1) + '%');
        if (cpuProcMean != null) parts.push('进程 ' + iFmt(cpuProcMean, 1) + '%');
        let tone = 'good', note = '负载轻';
        const load = cpuSysMean != null ? cpuSysMean : cpuProcMean;
        if (load >= 85) { tone = 'bad'; note = '系统 CPU 接近满载，存在瓶颈'; }
        else if (load >= 65) { tone = 'warn'; note = 'CPU 负载偏高'; }
        else if (load >= 40) { tone = 'info'; note = '负载中等'; }
        out.items.push({ k: 'CPU', v: parts.join('，'), note, tone });
      }

      // 内存
      if (memMean != null) {
        let note = '峰值 ' + iFmt(memMax, 0) + ' MB';
        let tone = 'good';
        if (memTrend) {
          note += '，首段→末段 ' + (memTrend.delta >= 0 ? '+' : '') + iFmt(memTrend.pct, 1) + '%';
          if (memTrend.pct >= 20 && memTrend.delta >= 30) { tone = 'bad'; note += '，疑似内存泄漏'; }
          else if (memTrend.pct >= 8 && memTrend.delta >= 15) { tone = 'warn'; note += '，有持续增长'; }
          else if (memTrend.pct <= -8) { tone = 'good'; note += '，有回落'; }
        }
        out.items.push({ k: '内存', v: '均值 ' + iFmt(memMean, 0) + ' MB', note, tone });
      }

      // 温度
      if (tempMean != null && iNums(tempCol).some(v => v > 0)) {
        let tone = 'good', note = '';
        if (tempMax != null && tempMax >= 50) { tone = 'bad'; note = '峰值偏高，可能触发温控降频'; }
        else if (tempMax != null && tempMax >= 45) { tone = 'warn'; note = '峰值偏高'; }
        else if (tempMax != null && tempMax >= 40) { tone = 'info'; note = '温度正常'; }
        else { tone = 'good'; note = '温度良好'; }
        out.items.push({
          k: '温度',
          v: '均值 ' + iFmt(tempMean, 1) + '°C / 峰值 ' + iFmt(tempMax, 1) + '°C',
          note, tone,
        });
      }

      // GPU
      if (hasGpuUtil) {
        let tone = 'info', note = '占用中等';
        if (gpuMean >= 85) { tone = 'warn'; note = 'GPU 高负载，可能成为瓶颈'; }
        else if (gpuMean >= 60) { tone = 'info'; note = 'GPU 负载较高'; }
        else { tone = 'good'; note = 'GPU 有余量'; }
        out.items.push({ k: 'GPU', v: '利用率均值 ' + iFmt(gpuMean, 1) + '%', note, tone });
      } else if (hasGpuTemp) {
        out.items.push({
          k: 'GPU',
          v: '温度均值 ' + iFmt(gpuTMean, 1) + '°C / 峰值 ' + iFmt(gpuTMax, 1) + '°C',
          note: '利用率不可读（需 root），已改用温度',
          tone: (gpuTMax != null && gpuTMax >= 70) ? 'warn' : 'info',
        });
      } else {
        out.items.push({ k: 'GPU', v: '--', note: '该机型未开放 GPU 数据读取', tone: 'info' });
      }

      // Jank
      if (jankMean != null) {
        let note = '轻微掉帧';
        if (jankMean <= 1) note = '几乎无掉帧';
        else if (jankMean <= 5) note = '轻微掉帧';
        else if (jankMean <= 12) note = '掉帧较多，可感知';
        else note = '掉帧严重，体验明显受损';
        out.items.push({
          k: 'Jank 率',
          v: '均值 ' + iFmt(jankMean, 2) + '%',
          note, tone: iToneOfJank(jankMean),
        });
      }

      // BigJank
      if (bjNums.length) {
        let tone = 'good', note = '无 >125ms 卡顿帧';
        if (bjSum > 0) {
          const perMin = durSec ? (bjSum / Math.max(1, durSec / 60)) : bjSum;
          if (perMin >= 6) { tone = 'bad'; note = '严重卡顿频繁'; }
          else if (perMin >= 1) { tone = 'warn'; note = '偶发严重卡顿'; }
          else { tone = 'info'; note = '极少严重卡顿'; }
          note += '（约 ' + iFmt(perMin, 1) + ' 次/分钟）';
        }
        out.items.push({ k: 'BigJank', v: '共 ' + iFmt(bjSum, 0) + ' 帧', note, tone });
      }

      /* ================= 风险提示 ================= */
      if (fpsTarget && fpsMean != null && fpsMean / fpsTarget < 0.85) {
        out.risks.push({ tone: 'high', text: '帧率仅达目标 ' + Math.round((fpsMean / fpsTarget) * 100) + '%，建议排查渲染耗时与主线程阻塞。' });
      }
      if (fm && fm.lowPct >= 20) {
        out.risks.push({
          tone: 'mid',
          text: '低帧占比 ' + iFmt(fm.lowPct, 1) + '%（' + fm.lowCount + ' 个采样点 FPS < ' + Math.round(fm.target * 0.8) + '），可在曲线图上框选这些时段定位原因。',
        });
      }
      if (fm && fm.reach < 80 && fm.frameTime != null) {
        out.risks.push({ tone: 'mid', text: '均帧 ' + iFmt(fm.frameTime, 1) + 'ms，高于目标帧间隔（' + iFmt(1000 / fm.target, 1) + 'ms），存在系统性超时。' });
      }
      if (jankMean != null && jankMean > 8) {
        out.risks.push({ tone: 'high', text: 'Jank 率 ' + iFmt(jankMean, 1) + '%，掉帧已可被用户明显感知。' });
      }
      if (bjNums.length && bjSum > 0 && durSec) {
        const perMin = bjSum / Math.max(1, durSec / 60);
        if (perMin >= 1) {
          out.risks.push({ tone: 'mid', text: '出现 ' + iFmt(bjSum, 0) + ' 次 >125ms 卡顿帧（约 ' + iFmt(perMin, 1) + ' 次/分钟），通常对应 GC、IO 或布局重排。' });
        }
      }
      if (memTrend && memTrend.pct >= 8 && memTrend.delta >= 15) {
        out.risks.push({ tone: 'mid', text: '内存首段→末段增长 ' + iFmt(memTrend.pct, 1) + '%（+' + iFmt(memTrend.delta, 0) + ' MB），长时间运行存在内存压力。' });
      }
      if (tempMax != null && tempMax >= 45) {
        out.risks.push({ tone: tempMax >= 50 ? 'high' : 'mid', text: '温度峰值 ' + iFmt(tempMax, 1) + '°C，接近温控阈值，长时间测试可能降频。' });
      }
      if (cpuSysMean != null && cpuSysMean >= 80) {
        out.risks.push({ tone: 'mid', text: '系统 CPU 均值 ' + iFmt(cpuSysMean, 1) + '%，整机负载饱和会放大掉帧。' });
      }
      if (!hasGpuUtil && !hasGpuTemp) {
        out.risks.push({ tone: 'info', text: 'GPU 数据不可读：该机型节点未开放（需 root），本报告 GPU 部分为空属正常现象。' });
      } else if (!hasGpuUtil && hasGpuTemp) {
        out.risks.push({ tone: 'info', text: 'GPU 利用率需 root 才能读取，已改用 GPU 温度反映负载趋势。' });
      }
      if (!out.risks.length) {
        out.risks.push({ tone: 'info', text: '未发现明显性能风险，各项指标均在合理区间。' });
      }

      /* ================= 总评 ================= */
      if (score == null) {
        out.level = 'good';
        out.levelText = '已解读';
        out.lead = '本报告为专项采集（无 FPS 数据），共 <b>' + n + '</b> 个采样点，时长 ' + iDurationText(durSec) + '。以下为各指标的实际表现。';
        return out;
      }

      const lv = iLevelOfScore(score);
      out.level = lv.level;
      out.levelText = lv.text;
      out.score = score;

      const bits = [];
      bits.push('整体流畅度<b>' + lv.text + '</b>（综合得分 ' + score + '）');
      if (fpsMean != null) bits.push('FPS 均值 <b>' + iFmt(fpsMean, 1) + '</b>' + (fpsTarget ? '（目标 ' + fpsTarget + '）' : ''));
      if (fm) bits.push('达帧率 <b>' + iFmt(fm.reach, 1) + '%</b>');
      if (jankMean != null) bits.push('Jank 率 <b>' + iFmt(jankMean, 1) + '%</b>');
      let tail = '';
      if (bjSum > 0) tail = '期间出现 ' + iFmt(bjSum, 0) + ' 次 >125ms 严重卡顿。';
      else if (tempMax != null && tempMax >= 45) tail = '全程无 >125ms 严重卡顿，但机身温度峰值 ' + iFmt(tempMax, 1) + '°C 偏高。';
      else if (memTrend && memTrend.pct >= 8) tail = '全程无 >125ms 严重卡顿，内存有持续增长趋势。';
      else tail = '全程无 >125ms 严重卡顿，表现稳定。';
      out.lead = bits.join('，') + '。' + tail;

      return out;
    }

    /** 把解读渲染成区块，插到指标卡片下方（各平台模板通用） */
    function renderInsight(pts, category) {
      // 达帧率 / 均帧 / 低帧 三张补充卡片（无 FPS 数据的平台自动隐藏）
      renderFpsKpiCards(fpsDerivedMetrics(fpsSeriesOf(pts), fpsTargetOf(pts)));

      const cards = document.querySelector('section.cards');
      if (!cards || !cards.parentNode) return;
      let box = document.getElementById('insight-box');
      if (!box) {
        box = document.createElement('section');
        box.id = 'insight-box';
        box.className = 'insight';
        cards.parentNode.insertBefore(box, cards.nextSibling);
      }
      const r = buildInsight(pts, category);
      const sub = [];
      sub.push(r.n + ' 个采样点');
      if (r.durSec != null) sub.push(iDurationText(r.durSec));
      const esc = (s) => String(s);

      let html = ''
        + '<div class="insight-head">'
        +   '<span class="insight-title">解读总结</span>'
        +   '<span class="insight-badge insight-badge--' + r.level + '">' + esc(r.levelText) + '</span>'
        +   '<span class="insight-sub">' + sub.join(' · ') + '</span>'
        + '</div>'
        + '<div class="insight-lead">' + r.lead + '</div>';

      if (r.items.length) {
        html += '<ul class="insight-list">';
        for (const it of r.items) {
          html += '<li><b>' + it.k + '</b>' + it.v
            + (it.note ? '<span class="insight-note insight-note--' + (it.tone || 'info') + '"> · ' + it.note + '</span>' : '')
            + '</li>';
        }
        html += '</ul>';
      }

      if (r.risks.length) {
        html += '<div class="insight-risks">';
        for (const rk of r.risks) {
          const flag = rk.tone === 'high' ? '⚠ 风险' : (rk.tone === 'mid' ? '△ 注意' : 'ℹ 提示');
          html += '<div class="insight-risk insight-risk--' + rk.tone + '">' + flag + '：' + rk.text + '</div>';
        }
        html += '</div>';
      }

      box.innerHTML = html;
    }

    function pickNum(obj, keys) {
      for (const k of keys) {
        const v = obj && obj[k];
        if (typeof v === 'number' && !isNaN(v)) return v;
      }
      return null;
    }

    function buildTagStatsRows() {
      if (!Array.isArray(tags) || tags.length === 0) return [];
      const rows = [];
      const firstName = Object.keys(CHART_CONFIGS)[0];
      const times = chartMgr._data[firstName]?.times || [];
      const n = times.length || 0;
      if (!n) return rows;
      const segs = tags
        .filter(t => Array.isArray(t) && t.length >= 2)
        .map(t => [Math.max(0, Math.min(n - 1, (t[0] | 0))), Math.max(0, Math.min(n - 1, (t[1] | 0)))])
        .filter(t => t[1] >= t[0]);
      for (let si = 0; si < segs.length; si++) {
        const [fromIdx, toIdx] = segs[si];
        const segName = `子场景${si + 1}`;
        for (const [chartName, cfg] of Object.entries(CHART_CONFIGS)) {
          const state = chartMgr._data[chartName];
          if (!state) continue;
          const seriesDefs = cfg.series || [];
          for (let i = 0; i < seriesDefs.length; i++) {
            const metric = seriesDefs[i].name || `${chartName}.${i}`;
            const full = state.series[i] || [];
            const slice = full.slice(fromIdx, toIdx + 1);
            const st = calcMeanMax(slice);
            rows.push({ seg: segName, metric, mean: st.mean, max: st.max, fromIdx, toIdx });
          }
        }
      }
      return rows;
    }

    function renderTagStats() {
      const hint = document.getElementById('tag-hint');
      const tb = document.querySelector('#tbl-tags tbody');
      const wrap = document.getElementById('wrap-stats-tags');
      if (!tb) return;
      tb.innerHTML = '';
      if (!tags || !tags.length) {
        // 没有子场景就别占一大块空白
        if (wrap) wrap.hidden = true;
        if (hint) hint.textContent = '未找到 tag（请确认 data.js 内包含 data.tag 或 data.tags）。';
        return;
      }
      if (wrap) wrap.hidden = false;
      if (hint) {
        const mapping = tags
          .filter(t => Array.isArray(t) && t.length >= 2)
          .map((t, i) => `子场景${i + 1}=[${t[0]},${t[1]}]`)
          .join('，');
        hint.textContent = `共 ${tags.length} 个子场景：${mapping}`;
      }
      const rows = buildTagStatsRows();
      if (!rows.length) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="4" style="color:var(--text2)">无法生成子场景统计（可能还未渲染出数据序列）</td>`;
        tb.appendChild(tr);
        return;
      }
      rows.forEach(r => {
        const tr = document.createElement('tr');
        const _ta = (window.MetricInfo ? MetricInfo.attr(r.metric) : '');
        tr.innerHTML = `<td>${r.seg}</td><td${_ta}>${r.metric}</td><td>${fmtStat(r.mean)}</td><td>${fmtStat(r.max)}</td>`;
        tb.appendChild(tr);
      });
      if (window.MetricInfo) MetricInfo.decorate(tb);
    }

    // selection state (by x-axis index)
    let selection = null; // {fromIdx,toIdx}

    function calcStats(arr) {
      const nums = (arr || []).filter(v => typeof v === 'number' && !isNaN(v));
      if (!nums.length) return { mean: null, max: null, p98: null };
      let sum = 0;
      let mx = -Infinity;
      for (const v of nums) { sum += v; if (v > mx) mx = v; }
      const sorted = nums.slice().sort((a,b)=>a-b);
      const idx = Math.max(0, Math.ceil(sorted.length * 0.98) - 1);
      return { mean: sum / nums.length, max: mx, p98: sorted[idx] };
    }

    function fmtStat(v) {
      if (v == null || typeof v !== 'number' || isNaN(v)) return '--';
      return String(Math.round(v * 1000) / 1000);
    }

    /** 图表短名：动态系列（各核心）在统计表里需要带上归属，否则会出现多个同名「Core 0」 */
    const CHART_LABELS = {
      cpu: 'CPU', mem: '内存', memDetail: '内存明细', memdetail: '内存明细',
      fps: '帧率', net: '网络', gpu: 'GPU', temp: '温度', current: '电流', power: '功耗',
      disk: '磁盘', events: '系统事件', cpuCores: '各核心CPU', cpuFreq: '各核心频率',
      occupancy: 'GPU占用', aluPerf: 'ALU', texture: '纹理', bandwidth: '带宽',
      cache: '缓存', shader: '着色器',
    };

    /** 统计表「主表」保留的关键指标，其余（内存分项 / 各核心）折叠到明细里 */
    const MAIN_METRICS = new Set([
      '系统CPU', '进程CPU', 'FPS', 'PSS', '物理内存', 'RSS',
      'Jank', 'BigJank', 'SmallJank', 'TinyJank', '上下文切换', 'GPU', 'GPU 温度', '温度',
      '下行', '上行', '读 KB/s', '写 KB/s',
      '达帧率', '均帧', '帧耗时标准差', '帧耗时方差', '低帧占比', '1%Low', 'Drop',
      'FPS≥目标', '稳帧范围', '帧率标准差', '卡顿时长占比',
      'Jank/10min', 'BigJank/10min', 'SmallJank/10min', 'TinyJank/10min',
    ]);

    /** 从各图表的 fmt 反推单位（fmt(1) 形如 "1.0%" / "1 MB"） */
    function metricUnitOf(cfg) {
      try {
        const s = String(cfg.fmt(1));
        const u = s.replace(/^-?[\d.]+/, '').trim();
        return u.length <= 8 ? u : '';
      } catch (_) { return ''; }
    }

      function buildTableRows(scope) {
        return dedupeStatRows(buildTableRowsRaw(scope));
      }

      function buildTableRowsRaw(scope) {
        // scope: {fromIdx,toIdx} inclusive indices on any chart's times array
        const rows = [];
      for (const [chartName, cfg] of Object.entries(CHART_CONFIGS)) {
        const state = chartMgr._data[chartName];
        if (!state) continue;
        const seriesDefs = cfg.series || [];
        const unit = metricUnitOf(cfg);
        for (let i = 0; i < seriesDefs.length; i++) {
          const rawName = seriesDefs[i].name || `${chartName}.${i}`;
          // 各核心 CPU / 频率两图都叫 Core N，加前缀区分
          const name = cfg.dynamic ? `${CHART_LABELS[chartName] || chartName} · ${rawName}` : rawName;
          const full = state.series[i] || [];
          const slice = (scope && scope.fromIdx != null && scope.toIdx != null)
            ? full.slice(scope.fromIdx, scope.toIdx + 1)
            : full;
          const st = calcStats(slice);
          rows.push({ metric: name, raw: rawName, unit, mean: st.mean, max: st.max, p98: st.p98, dynamic: !!cfg.dynamic });
        }
      }

      // FPS 派生指标：达帧率 / 均帧 / 低帧占比。
      // 下面 perfFpsQualityRows 已经给整段统计算过同名的三行（PerfDog 口径），
      // 所以整段模式下这里不再追加，否则表格里会出现两条同名行；
      // 只有用户框选了区间（整段行不参与统计）时才用这里的随选区版本顶上。
      const fpsState2 = chartMgr._data.fps;
      if (scope && fpsState2 && fpsState2.series && fpsState2.series[0]) {
        const full = fpsState2.series[0] || [];
        const slice = (scope.fromIdx != null && scope.toIdx != null)
          ? full.slice(scope.fromIdx, scope.toIdx + 1)
          : full;
        // 目标帧率按整段算，不随选区变化
        const fm = fpsDerivedMetrics(slice, fpsTargetOfSeries(full));
        if (fm) {
          rows.push({ metric: '达帧率', raw: '达帧率', unit: '%', mean: fm.reach, max: fm.reach, p98: fm.reach });
          rows.push({ metric: '均帧', raw: '均帧', unit: 'ms', mean: fm.frameTime, max: fm.frameTime, p98: fm.frameTime });
          rows.push({ metric: '低帧占比', raw: '低帧占比', unit: '%', mean: fm.lowPct, max: fm.lowPct, p98: fm.lowPct });
        }
      }

      // PerfDog 口径的其余帧率质量指标（整段统计，不随框选区变化）
      if (!scope) {
        const durSec = reportDurationSec();
        // 这里要在本作用域自取（写在别处的 const 会因作用域报错、被 onReady 静默吞掉）
        const _fps = chartMgr._data.fps;
        const fpsFull = (_fps && _fps.series && _fps.series[0]) || [];
        const qRows = perfFpsQualityRows(
          _fps ? (_fps.series[0] || []) : [],
          _fps ? (_fps.series[1] || []) : [],
          _fps ? (_fps.series[2] || []) : [],
          _fps ? (_fps.series[3] || []) : [],
          _fps ? (_fps.series[4] || []) : [],
          fpsTargetOfSeries(fpsFull), durSec
        );
      for (const r of qRows) rows.push(r);
        }
        return rows;
      }

      /**
       * 统计表去重：报告里有些指标彼此是派生/同源关系，全部平铺会显得重复。
       *   1) Jank/10min 四行 → 并入对应 Jank 行作为副标注（数值不丢，行数减半）
       *   2) GPU 温度与「温度」同源同值时只保留「温度」一行（GPU 图表照常画）
       *   3) 兜底：同名指标行只留第一条
       */
      function dedupeStatRows(rows) {
        const MERGE = {
          'Jank/10min': 'Jank', 'BigJank/10min': 'BigJank',
          'SmallJank/10min': 'SmallJank', 'TinyJank/10min': 'TinyJank',
        };
        const keyOf = (r) => r.raw || r.metric;
        const sameNums = (a, b) => ['mean', 'max', 'p98'].every(f => a[f] === b[f]);

        const first = new Map();
        const out = [];
        for (const r of rows) {
          const k = keyOf(r);
          if (!first.has(k)) first.set(k, r);
        }
        for (const r of rows) {
          const k = keyOf(r);
          if (first.get(k) !== r) continue;              // 同名重复行
          const hostKey = MERGE[k];
          if (hostKey) {                                  // 派生行并入宿主
            const host = first.get(hostKey);
            if (host && host !== r) {
              // 10min 计数本身没有独立单位，副标注要写清口径
              const is10 = /\/\s*10min/.test(k);
              const sub = fmtStat(r.mean) + (is10 ? ' 次/10min' : (r.unit ? ' ' + r.unit : ''));
              host.sub = host.sub ? host.sub + ' · ' + sub : sub;
              continue;
            }
          }
          out.push(r);
        }
        const gpuT = out.find(r => keyOf(r) === 'GPU 温度');
        const temp = out.find(r => keyOf(r) === '温度');
        if (gpuT && temp && sameNums(gpuT, temp)) out.splice(out.indexOf(gpuT), 1);
        return out;
      }

    function isMainMetric(r) {
      if (r.dynamic) return false;
      return MAIN_METRICS.has(r.raw || r.metric);
    }

    function renderTable(tableId, rows) {
      const tb = document.querySelector(`#${tableId} tbody`);
      if (!tb) return;

      const _miAttr = (r) => (window.MetricInfo ? MetricInfo.attr(r.raw || r.metric) : '');
      const cell = (r) =>
        `<tr><td${_miAttr(r)}>${r.metric}${r.unit ? `<span class="metric-unit">${r.unit}</span>` : ''}` +
        `${r.sub ? `<span class="metric-sub">${r.sub}</span>` : ''}</td>` +
        `<td>${fmtStat(r.mean)}</td><td>${fmtStat(r.max)}</td><td>${fmtStat(r.p98)}</td></tr>`;

      const main = rows.filter(isMainMetric);
      const detail = rows.filter(r => !isMainMetric(r));

      // 主表按 MAIN_METRICS 的语义顺序排：CPU → 内存 → 帧率 → 网络 → GPU/温度 → 功耗
      const ORDER = ['系统CPU', '进程CPU', 'FPS', '达帧率', '均帧', '帧耗时标准差', '帧耗时方差', '低帧占比', '1%Low', 'Drop',
        'FPS≥目标', '稳帧范围', '帧率标准差', '卡顿时长占比',
        'Jank', 'BigJank', 'SmallJank', 'TinyJank', 'Jank/10min', 'BigJank/10min', 'SmallJank/10min', 'TinyJank/10min',
        'PSS', '物理内存', 'RSS', '上下文切换',
        '下行', '上行', 'GPU', 'GPU 温度', '温度', '读 KB/s', '写 KB/s'];
      main.sort((a, b) => {
        const ia = ORDER.indexOf(a.raw || a.metric), ib = ORDER.indexOf(b.raw || b.metric);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });

      let html = main.map(cell).join('');
      if (detail.length) {
        html += `<tr class="stats-toggle"><td colspan="4">` +
          `<button type="button" data-detail-toggle="${tableId}">▾ 展开明细 ${detail.length} 项（内存分项 / 各核心）</button>` +
          `</td></tr>`;
        html += detail.map(r => cell(r).replace('<tr>', '<tr class="stats-detail-row" hidden>')).join('');
      }
      tb.innerHTML = html;
      if (window.MetricInfo) MetricInfo.decorate(tb);
    }

    // 明细折叠：事件委托，一次绑定
    document.addEventListener('click', (e) => {
      const btn = e.target.closest && e.target.closest('[data-detail-toggle]');
      if (!btn) return;
      const tb = document.querySelector(`#${btn.getAttribute('data-detail-toggle')} tbody`);
      if (!tb) return;
      const rows = tb.querySelectorAll('.stats-detail-row');
      const willShow = rows.length && rows[0].hidden;
      rows.forEach(tr => { tr.hidden = !willShow; });
      btn.textContent = willShow
        ? `▴ 收起明细（${rows.length} 项）`
        : `▾ 展开明细 ${rows.length} 项（内存分项 / 各核心）`;
    });

    function tableText(tableId) {
      const rows = [];
      const t = document.getElementById(tableId);
      if (!t) return '';
      const tr = t.querySelectorAll('tr');
      tr.forEach(row => {
        const cols = Array.from(row.querySelectorAll('th,td')).map(c => (c.textContent || '').trim());
        rows.push(cols.join('\t'));
      });
      return rows.join('\n');
    }

    async function copyTable(tableId) {
      const text = tableText(tableId);
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        window.prompt('复制下面内容：', text);
      }
    }

    function zoomToRangeIdx(fromIdx, toIdx) {
      const charts = Object.values(chartMgr._charts || {});
      const a = Math.max(0, Math.min(fromIdx, toIdx));
      const b = Math.max(0, Math.max(fromIdx, toIdx));
      const firstName = Object.keys(CHART_CONFIGS)[0];
      const times = chartMgr._data[firstName]?.times || [];
      const startVal = (times[a] != null) ? times[a] : a;
      const endVal = (times[b] != null) ? times[b] : b;
      charts.forEach(ch => {
        // Prefer setOption to guarantee both inside/slider zoom sync.
        try {
          ch.setOption(
            {
              dataZoom: [
                { startValue: startVal, endValue: endVal },
                { startValue: startVal, endValue: endVal },
              ],
            },
            { notMerge: false }
          );
        } catch (_) {
          try { ch.dispatchAction({ type: 'dataZoom', startValue: startVal, endValue: endVal }); } catch (_) {}
        }
      });
    }

    function resetZoomFull() {
      const charts = Object.values(chartMgr._charts || {});
      charts.forEach(ch => {
        try {
          ch.setOption(
            {
              dataZoom: [
                { start: 0, end: 100 },
                { start: 0, end: 100 },
              ],
            },
            { notMerge: false }
          );
        } catch (_) {
          try { ch.dispatchAction({ type: 'dataZoom', start: 0, end: 100 }); } catch (_) {}
        }
      });
    }

    function renderStats() {
      // global
      renderTable('tbl-global', buildTableRows(null));
      // selected
      if (selection) {
        const firstName = Object.keys(CHART_CONFIGS)[0];
        const state = chartMgr._data[firstName];
        const times = state?.times || [];
        const fromIdx = Math.max(0, Math.min(selection.fromIdx, selection.toIdx));
        const toIdx = Math.max(0, Math.max(selection.fromIdx, selection.toIdx));
        renderTable('tbl-selected', buildTableRows({ fromIdx, toIdx }));
        const tbl = document.getElementById('tbl-selected');
        if (tbl) tbl.hidden = false;
        const hint = document.getElementById('sel-hint');
        if (hint) hint.textContent = `选中：${times[fromIdx] ?? fromIdx} ~ ${times[toIdx] ?? toIdx}`;
      } else {
        renderTable('tbl-selected', []);
        // 没框选时不显示空表头，避免一大块空白
        const tbl = document.getElementById('tbl-selected');
        if (tbl) tbl.hidden = true;
      }
    }

    function toIndexFromValue(v, times) {
      const t = times || [];
      if (v == null) return null;
      if (typeof v === 'number' && Number.isFinite(v)) {
        const idx = Math.max(0, Math.min(t.length - 1, Math.round(v)));
        return Number.isFinite(idx) ? idx : null;
      }
      if (typeof v === 'string' && t.length) {
        const i = t.indexOf(v);
        return i >= 0 ? i : null;
      }
      return null;
    }

    function installZoomAsSelection(anyChart, getTimes) {
      if (!anyChart || typeof anyChart.on !== 'function') return;
      anyChart.on('dataZoom', (evt) => {
        const times = typeof getTimes === 'function' ? (getTimes() || []) : [];
        // evt may provide startValue/endValue or start/end
        let a = null;
        let b = null;
        if (evt && ('startValue' in evt || 'endValue' in evt)) {
          a = toIndexFromValue(evt.startValue, times);
          b = toIndexFromValue(evt.endValue, times);
        }
        if ((a == null || b == null) && evt && typeof evt.start === 'number' && typeof evt.end === 'number' && times.length) {
          const from = Math.floor((evt.start / 100) * (times.length - 1));
          const to = Math.ceil((evt.end / 100) * (times.length - 1));
          a = Math.max(0, Math.min(times.length - 1, from));
          b = Math.max(0, Math.min(times.length - 1, to));
        }
        if (a == null || b == null) return;
        selection = { fromIdx: a, toIdx: b };
        renderStats();
      });
    }

    function installMouseDownUpSelection(anyChart, getTimes) {
      if (!anyChart || typeof anyChart.getZr !== 'function') return;
      let downIdx = null;
      const zr = anyChart.getZr();

      function isLeftButton(e) {
        // zrender event: e.event is the native MouseEvent
        const ne = e && e.event;
        if (ne && typeof ne.button === 'number') return ne.button === 0;
        if (typeof e.which === 'number') return e.which === 1;
        return true;
      }

      function indexAtEvent(e) {
        try {
          const ne = (e && e.event) ? e.event : e;
          const x = ne?.offsetX ?? ne?.zrX ?? ne?.x ?? e?.offsetX;
          const y = ne?.offsetY ?? ne?.zrY ?? ne?.y ?? e?.offsetY;
          if (typeof x !== 'number' || typeof y !== 'number') return null;
          const pt = [x, y];
          const v = anyChart.convertFromPixel({ xAxisIndex: 0 }, pt);
          if (v == null) return null;
          // category axis returns label (string) or index (number)
          const raw = Array.isArray(v) ? v[0] : v;
          const times = typeof getTimes === 'function' ? (getTimes() || []) : [];
          return toIndexFromValue(raw, times);
        } catch {
          return null;
        }
      }

      zr.on('mousedown', (e) => {
        if (!isLeftButton(e)) return;
        downIdx = indexAtEvent(e);
      });
      zr.on('mouseup', (e) => {
        if (!isLeftButton(e)) return;
        const upIdx = indexAtEvent(e);
        if (downIdx == null || upIdx == null) return;
        // Only zoom here. Selected-area stats are driven by the zoom event (installZoomAsSelection).
        zoomToRangeIdx(downIdx, upIdx);
        downIdx = null;
      });
    }

    // hook copy buttons + reset button
    const btnCG = document.getElementById('btn-copy-global');
    if (btnCG) btnCG.onclick = () => copyTable('tbl-global');
    const btnCS = document.getElementById('btn-copy-selected');
    if (btnCS) btnCS.onclick = () => copyTable('tbl-selected');
    const btnCT = document.getElementById('btn-copy-tags');
    if (btnCT) btnCT.onclick = () => copyTable('tbl-tags');

    // Add reset button to topbar-right
    const topRight = document.querySelector('.topbar-right');
    if (topRight && !document.getElementById('btn-reset-zoom')) {
      const btn = document.createElement('button');
      btn.id = 'btn-reset-zoom';
      btn.type = 'button';
      btn.className = 'btn btn-sm';
      btn.textContent = '恢复范围';
      btn.title = '恢复全局时间范围（不清除已标记区域）';
      btn.onclick = () => resetZoomFull();
      topRight.appendChild(btn);
    }

    if (category === 'android') {
      const pts = perf.map((it) => {
        const cpu = it.cpu || {};
        const mem = it.mem || {};
        const net = it.net || {};
        const bat = it.battery || {};
        const cores = it.cpuCores || {};
        const tempRaw = (it.temperature != null) ? it.temperature : (bat.temperature != null ? bat.temperature : null);
        return {
          time: it.time || new Date(it.timestamp).toLocaleTimeString(),
          cpu: { sysCpu: cpu.sysCpu ?? null, procCpu: cpu.procCpu ?? null },
          mem: {
            totalPss: a_mem(mem.totalPss),
            nativeHeap: a_mem(mem.nativeHeap),
            javaHeap: a_mem(mem.javaHeap),
            code: a_mem(mem.code),
            stack: a_mem(mem.stack),
            graphics: a_mem(mem.graphics),
            privateOther: a_mem(mem.privateOther),
            system: a_mem(mem.system),
          },
          fps: it.fps ?? null,
          jank: it.jank ?? null,
          bigJank: it.bigJank ?? null,
          smallJank: it.smallJank ?? null,
          tinyJank: it.tinyJank ?? null,
          cswitch: it.cswitch ?? null,
          cpuLimit: it.cpuLimit ?? null,
          net: { rxKBps: net.rxKBps ?? null, txKBps: net.txKBps ?? null },
          gpu: it.gpu ?? null,
          gpuTemp: it.gpuTemp ?? null,
          temperature: pickTemp(tempRaw, bat.temperature),
          battery: { currentNow: a_ua_to_ma(bat.currentNow), power: bat.power ?? null, temperature: a_temp(bat.temperature), level: bat.level ?? null },
          cpuCores: {
            usage: Array.isArray(cores.usage) ? cores.usage.map(v => (typeof v === 'number' ? v : 0)) : [],
            freq: Array.isArray(cores.freq) ? cores.freq.map(a_freq).map(v => v == null ? 0 : v) : [],
          }
        };
      });
      pts.forEach(p => chartMgr.update(p));
      setText('val-syscpu', fmtN(mean(pts.map(p => p.cpu.sysCpu)), 1));
      setText('val-proccpu', fmtN(mean(pts.map(p => p.cpu.procCpu)), 1));
      setText('val-mem', fmtN(mean(pts.map(p => p.mem.totalPss)), 0));
      setText('val-fps', fmtN(mean(pts.map(p => p.fps)), 0));
      setText('val-jank', fmtN(mean(pts.map(p => p.jank)), 2));
      setText('val-bigjank', fmtN(mean(pts.map(p => p.bigJank)), 2));
      setText('val-net', `${fmtN(mean(pts.map(p => p.net.rxKBps)), 0)}/${fmtN(mean(pts.map(p => p.net.txKBps)), 0)}`);
      setText('val-gpu', fmtN(mean(pts.map(p => p.gpu)), 0));
      setText('val-battery', fmtN(mean(pts.map(p => p.battery.level)), 0));
      setText('val-temp', fmtN(mean(pts.map(p => p.temperature)), 1));
      annotateMetricCards(pts);
      renderInsight(pts, category);
      chartMgr.onReady(() => {
        const charts = Object.values(chartMgr._charts || {});
        charts.forEach(ch => ch.group = 'sync');
        if (charts.length) echarts.connect('sync');
        const any = charts[0];
        if (any) {
          const getTimes = () => chartMgr._data[Object.keys(CHART_CONFIGS)[0]]?.times;
          installMouseDownUpSelection(any, getTimes);
          installZoomAsSelection(any, getTimes);
        }
        // initial render (global only; selected will update on first zoom/selection)
        renderStats();
        finalizeReportView();
        applyTagBackgroundToCharts();
        renderTagStats();
        annotateEmptyCharts();
      });
      return;
    }

    if (category === 'pc') {
      const numMb = (v) => ((typeof v === 'number' && !isNaN(v)) ? v : null);
      const pts = perf.map((it) => {
        const cpu = it.cpu || {};

        return {

          cpu: { sysCpu: cpu.sysCpu ?? null, procCpu: cpu.procCpu ?? null },
          mem: {

            nativeHeap: numMb(mem.nativeHeap),

            code: numMb(mem.code),

          cswitch: it.cswitch ?? null,
          cpuLimit: it.cpuLimit ?? null,
          net: { rxKBps: net.rxKBps ?? null, txKBps: net.txKBps ?? null },
          gpu: it.gpu ?? null,
          gpuTemp: it.gpuTemp ?? null,
          temperature: pickTemp(tempRaw, bat.temperature),
          battery: { currentNow: a_ua_to_ma(bat.currentNow), power: bat.power ?? null, temperature: a_temp(bat.temperature), level: bat.level ?? null },
          cpuCores: {
            usage: Array.isArray(cores.usage) ? cores.usage.map(v => (typeof v === 'number' ? v : 0)) : [],
            freq: Array.isArray(cores.freq) ? cores.freq.map(a_freq).map(v => v == null ? 0 : v) : [],
          },
          _diskReadKBps: (typeof px.diskReadKBps === 'number' && !isNaN(px.diskReadKBps)) ? px.diskReadKBps : null,
          _diskWriteKBps: (typeof px.diskWriteKBps === 'number' && !isNaN(px.diskWriteKBps)) ? px.diskWriteKBps : null,

      });
      pts.forEach(p => chartMgr.update(p));
      setText('val-syscpu', fmtN(mean(pts.map(p => p.cpu.sysCpu)), 1));
      setText('val-proccpu', fmtN(mean(pts.map(p => p.cpu.procCpu)), 1));
      setText('val-mem', fmtN(mean(pts.map(p => p.mem.totalPss)), 0));
      setText('val-fps', fmtN(mean(pts.map(p => p.fps)), 0));
      setText('val-jank', fmtN(mean(pts.map(p => p.jank)), 2));
      setText('val-bigjank', fmtN(mean(pts.map(p => p.bigJank)), 2));
      setText('val-net', `${fmtN(mean(pts.map(p => p.net.rxKBps)), 0)}/${fmtN(mean(pts.map(p => p.net.txKBps)), 0)}`);
      setText('val-gpu', fmtN(mean(pts.map(p => p.gpu)), 0));
      setText('val-battery', fmtN(mean(pts.map(p => p.battery.level)), 0));
      setText('val-temp', fmtN(mean(pts.map(p => p.temperature)), 1));
      annotateMetricCards(pts);
      renderInsight(pts, category);
      chartMgr.onReady(() => {
        const charts = Object.values(chartMgr._charts || {});
        charts.forEach(ch => ch.group = 'sync');
        if (charts.length) echarts.connect('sync');
        const any = charts[0];
        if (any) {
          const getTimes = () => chartMgr._data[Object.keys(CHART_CONFIGS)[0]]?.times;
          installMouseDownUpSelection(any, getTimes);
          installZoomAsSelection(any, getTimes);
        }
        renderStats();
        finalizeReportView();
        applyTagBackgroundToCharts();
        renderTagStats();
        annotateEmptyCharts();
      });
      return;
    }

    if (category === 'ios') {
      // iOS 原始采样多为累计计数（diskBytesRead/ctxSwitch 等），报表里补算 “/s” 增量字段
      let _prevTs = null;
      let _prevDisk = null;   // { r, w }
      let _prevEvents = null; // { ctx, int, pg }
      const pts = perf.map((it) => {
        const ts = (typeof it.timestamp === 'number') ? it.timestamp : Date.parse(it.timestamp);
        const dtSec = (_prevTs != null && typeof ts === 'number' && !isNaN(ts))
          ? Math.max(0.001, (ts - _prevTs) / 1000)
          : 1;

        // Disk KB/s
        let dr = it._diskReadKBps;
        let dw = it._diskWriteKBps;
        const diskR = pickNum(it, ['diskBytesRead','disk_bytes_read','diskReadBytes','disk_read_bytes']);
        const diskW = pickNum(it, ['diskBytesWritten','disk_bytes_written','diskWriteBytes','disk_write_bytes']);
        if ((dr == null || dw == null) && _prevDisk && diskR != null && diskW != null) {
          dr = Math.max(0, (diskR - _prevDisk.r) / 1024 / dtSec);
          dw = Math.max(0, (diskW - _prevDisk.w) / 1024 / dtSec);
        }

        // System events /s
        let cps = it._ctxSwitchPs;
        let ips = it._intWakeupsPs;
        let vps = it._vmPageInsPs;
        const ctx = pickNum(it, ['ctxSwitch','ctx_switch','contextSwitch','context_switch']);
        const iw  = pickNum(it, ['intWakeups','int_wakeups','interruptWakeups','interrupt_wakeups']);
        const vm  = pickNum(it, ['vmPageIns','vm_page_ins','pageIns','page_ins']);
        if ((cps == null || ips == null || vps == null) && _prevEvents && ctx != null) {
          cps = Math.max(0, (ctx - _prevEvents.ctx) / dtSec);
          ips = Math.max(0, ((iw || 0) - _prevEvents.int) / dtSec);
          vps = Math.max(0, ((vm || 0) - _prevEvents.pg) / dtSec);
        }

        if (typeof ts === 'number' && !isNaN(ts)) _prevTs = ts;
        if (diskR != null) _prevDisk = { r: diskR, w: diskW || 0 };
        if (ctx != null) _prevEvents = { ctx: ctx, int: iw || 0, pg: vm || 0 };

        return {
          time: it.time || (typeof ts === 'number' && !isNaN(ts) ? new Date(ts).toLocaleTimeString() : new Date(it.timestamp).toLocaleTimeString()),
          cpuUsage: it.cpuUsage ?? null,
          cpuTotalSystem: it.cpuTotalSystem ?? null,
          cpuTotalUser: it.cpuTotalUser ?? null,
          fps: it.fps ?? null,
          jank: it.jank ?? null,
          bigjank: (it.bigjank != null) ? it.bigjank : (it.big_jank ?? null),
          smallJank: (it.smallJank != null) ? it.smallJank : (it.small_jank ?? null),
          tinyJank: (it.tinyJank != null) ? it.tinyJank : (it.tiny_jank ?? null),
          cswitch: it.cswitch ?? null,
          cpuLimit: it.cpuLimit ?? null,
          stutter: it.stutter ?? null,
          physFootprint: i_mem(it.physFootprint),
          memResidentSize: i_mem(it.memResidentSize),
          memRPrvt: i_mem(it.memRPrvt),
          memRShrd: i_mem(it.memRShrd),
          memAnon: i_mem(it.memAnon),
          memCompressed: i_mem(it.memCompressed),
          memPurgeable: i_mem(it.memPurgeable),
          _diskReadKBps: (typeof dr === 'number' && !isNaN(dr)) ? dr : null,
          _diskWriteKBps: (typeof dw === 'number' && !isNaN(dw)) ? dw : null,
          _ctxSwitchPs: (typeof cps === 'number' && !isNaN(cps)) ? cps : null,
          _intWakeupsPs: (typeof ips === 'number' && !isNaN(ips)) ? ips : null,
          _vmPageInsPs: (typeof vps === 'number' && !isNaN(vps)) ? vps : null,
          threadCount: it.threadCount ?? it.threads ?? null,
        };
      });
      pts.forEach(p => chartMgr.update(p));
      setText('val-fps', fmtN(mean(pts.map(p => p.fps)), 0));
      setText('val-jank', fmtN(mean(pts.map(p => p.jank)), 2));
      setText('val-big-jank', fmtN(mean(pts.map(p => p.bigjank)), 2));
      const st = mean(pts.map(p => p.stutter));
      setText('val-stutter', (typeof st === 'number' && !isNaN(st)) ? (Math.round(st * 10000) / 10000).toFixed(4) : '--');
      setText('val-cpu', fmtN(mean(pts.map(p => p.cpuUsage)), 1));
      setText('val-syscpu', fmtN(mean(pts.map(p => p.cpuTotalSystem)), 1));
      setText('val-mem', fmtN(mean(pts.map(p => p.physFootprint)), 0));
      setText('val-thread', fmtN(mean(pts.map(p => p.threadCount)), 0));
      setText('val-disk', fmtN(mean(pts.map(p => p._diskReadKBps)), 0));
      renderInsight(pts, category);
      chartMgr.onReady(() => {
        const charts = Object.values(chartMgr._charts || {});
        charts.forEach(ch => ch.group = 'sync');
        if (charts.length) echarts.connect('sync');
        const any = charts[0];
        if (any) {
          const getTimes = () => chartMgr._data[Object.keys(CHART_CONFIGS)[0]]?.times;
          installMouseDownUpSelection(any, getTimes);
          installZoomAsSelection(any, getTimes);
        }
        renderStats();
        finalizeReportView();
        applyTagBackgroundToCharts();
        renderTagStats();
      });
      return;
    }

    if (category === 'ios_gpu') {
      const pts = perf.map((it, idx) => {
        const o = { time: it.time || '', timestamp: g_time_ms(it.timestamp, idx) };
        for (const [k, v] of Object.entries(it || {})) {
          if (k === 'timestamp' || k === 'time') continue;
          if (typeof v !== 'number' || isNaN(v)) continue;
          if (isBandwidthKey(k)) o[k] = g_bw(v);
          else if (isPartialRendersKey(k)) o[k] = v;
          else o[k] = g_ratio(v);
        }
        if (!o.time) o.time = isNaN(o.timestamp) ? String(it.timestamp) : new Date(Math.trunc(o.timestamp)).toLocaleTimeString();
        return o;
      });
      pts.forEach(p => chartMgr.update(p));
      setText('val-alu', fmtN(mean(pts.map(p => p['ALU Utilization'])), 1));
      setText('val-frag', fmtN(mean(pts.map(p => p['Fragment Occupancy'])), 1));
      setText('val-vert', fmtN(mean(pts.map(p => p['Vertex Occupancy'])), 1));
      setText('val-tex', fmtN(mean(pts.map(p => p['Texture Sample Limiter'])), 1));
      setText('val-rbw', fmtN(mean(pts.map(p => p['GPU Read Bandwidth'])), 3));
      setText('val-wbw', fmtN(mean(pts.map(p => p['GPU Write Bandwidth'])), 3));
      renderInsight(pts, category);
      chartMgr.onReady(() => {
        const charts = Object.values(chartMgr._charts || {});
        charts.forEach(ch => ch.group = 'sync');
        if (charts.length) echarts.connect('sync');
        const any = charts[0];
        if (any) {
          const getTimes = () => chartMgr._data[Object.keys(CHART_CONFIGS)[0]]?.times;
          installMouseDownUpSelection(any, getTimes);
          installZoomAsSelection(any, getTimes);
        }
        renderStats();
        finalizeReportView();
        applyTagBackgroundToCharts();
        renderTagStats();
      });
      return;
    }

    document.getElementById('root').innerHTML = '<div class="device-info-strip"><div class="device-info-strip-inner"><span class="device-info-text">不支持的 category</span></div></div>';
  }

  render();
  if (window.MetricInfo) MetricInfo.decorate(document);
  </script>
</body>
</html>
