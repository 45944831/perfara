    /** 图表标题补上均值 / 峰值，不用靠读图估数 */
    function decorateChartTitles() {
      for (const [name, cfg] of Object.entries(CHART_CONFIGS)) {
        const el = document.getElementById(cfg.el);
        if (!el) continue;
        const wrap = el.closest('.chart-wrap');
        if (!wrap) continue;
        const title = wrap.querySelector('.chart-title');
        if (!title) continue;
        if (!title.dataset.base) {
          const _dot = title.querySelector('.info-dot');
          if (_dot) _dot.remove();
          title.dataset.base = title.textContent.trim();
        }

        const st = chartMgr._data[name];
        const defs = cfg.series || [];
        if (cfg.dynamic || !st || !st.series || !st.series.length) { title.textContent = title.dataset.base; continue; }

        // 多系列时优先取名为 FPS 的那条（帧率图里还混了 Jank / BigJank 柱状）
        let idx = defs.findIndex(s => s && s.name === 'FPS');
        if (idx < 0) idx = 0;
        const s0 = (st.series[idx] || []).filter(v => typeof v === 'number');
        if (!s0.length) { title.textContent = title.dataset.base; continue; }

        const avg = s0.reduce((a, b) => a + b, 0) / s0.length;
        const mx = Math.max.apply(null, s0);
        const f = (v) => { try { return String(cfg.fmt(Math.round(v * 10) / 10)); } catch (_) { return String(v); } };
        const who = (defs.length > 1 && defs[idx] && defs[idx].name) ? defs[idx].name + ' ' : '';
        title.innerHTML = escapeHtml(title.dataset.base) +
          ' <span style="color:var(--text);font-weight:600">' + escapeHtml(who + '均值 ' + f(avg)) + '</span>' +
          ' <span style="color:var(--text2);font-weight:400">峰值 ' + escapeHtml(f(mx)) + '</span>';
      }
        // 标题被改写后，参数说明「!」标记需要重新补回（__METRIC_INFO_V1__）
        if (window.MetricInfo) {
          for (const [n2, c2] of Object.entries(CHART_CONFIGS)) {
            const _e = document.getElementById(c2.el);
            const _w = _e && _e.closest('.chart-wrap');
            if (_w) MetricInfo.decorate(_w);
          }
        }

    }

    /** 卡片补充说明：GPU 不支持 / 温度无数据 / BigJank 本次为 0 */
    function annotateMetricCards(pts) {

      }
      if (seriesNoData(pts.map(p => p.temperature), true)) {
        const ct = pts.map(p => p.cpuTemp).filter(v => typeof v === 'number' && !isNaN(v) && v > 0);
        if (ct.length) {
          // 无机身/电池热敏电阻（PC，或 die-only 机型）：只把 CPU 结温展示出来，
          // 并把卡片标签一起改成「CPU 结温」，绝不冒充机身温度。
          const avg = ct.reduce((a, b) => a + b, 0) / ct.length;
          setValue('val-temp', avg.toFixed(1));

        }
      }
      const bj = pts.map(p => p.bigJank).filter(v => typeof v === 'number' && !isNaN(v));
      if (bj.length && bj.every(v => v === 0)) {
        const lab = document.querySelector('#card-bigjank .card-label');
        if (lab) {
          lab.textContent = 'BigJank · 无>125ms帧';
          if (window.MetricInfo) MetricInfo.decorate(lab);
        }
      }

      /* ---- 阈值着色：把「好 / 一般 / 差」直接画到卡片上 ---- */
      const target = fpsTargetOf(pts);
      const fpsArr = pts.map(p => p.fps).filter(v => typeof v === 'number' && !isNaN(v));
      if (fpsArr.length && target) {
        const avg = fpsArr.reduce((a, b) => a + b, 0) / fpsArr.length;
        const r = avg / target;
        paintCard('card-fps', r >= 0.95 ? 'good' : (r >= 0.8 ? 'warn' : 'bad'));
      }
      const cpuArr = pts.map(p => p.cpu && p.cpu.sysCpu).filter(v => typeof v === 'number' && !isNaN(v));
      if (cpuArr.length) {
        const avg = cpuArr.reduce((a, b) => a + b, 0) / cpuArr.length;
        paintCard('card-cpu', avg >= 85 ? 'bad' : (avg >= 65 ? 'warn' : 'good'));
      }
      const jankRates = pts.map(p => {
        const j = p.jank, f = p.fps;
        return (typeof j === 'number' && typeof f === 'number' && f > 0) ? (j / f) * 100 : null;
      }).filter(v => v != null && !isNaN(v));
      if (jankRates.length) {
        const avg = jankRates.reduce((a, b) => a + b, 0) / jankRates.length;
        paintCard('card-jank', avg <= 2 ? 'good' : (avg <= 8 ? 'warn' : 'bad'));
      }
      if (bj.length) {
        const sum = bj.reduce((a, b) => a + b, 0);
        paintCard('card-bigjank', sum === 0 ? 'good' : (sum <= 2 ? 'warn' : 'bad'));
      }
      const temps = pts.map(p => p.temperature).filter(v => typeof v === 'number' && v > 0);
      if (temps.length) {
        const mx = Math.max.apply(null, temps);
        paintCard('card-temp', mx < 42 ? 'good' : (mx < 48 ? 'warn' : 'bad'));
      }
    }

    function calcMeanMax(arr) {
      const nums = (arr || []).filter(v => typeof v === 'number' && !isNaN(v));
      if (!nums.length) return { mean: null, max: null };
      let sum = 0;
      let mx = -Infinity;
      for (const v of nums) { sum += v; if (v > mx) mx = v; }
      return { mean: sum / nums.length, max: mx };
    }

    /* ==========================================================
     * 解读总结
     * 纯前端根据已渲染的 pts 推导结论，不依赖服务端。
     * 输出：总评徽章 + 一句话结论 + 分项解读 + 风险提示。
     * ========================================================== */

    function iNums(vals) {
      return (vals || []).filter(v => typeof v === 'number' && !isNaN(v));
    }

    function iMean(vals) {
      const a = iNums(vals);
      if (!a.length) return null;
      let s = 0;
      for (const v of a) s += v;
      return s / a.length;
    }

    function iPct(vals, p) {
      const a = iNums(vals).slice().sort((x, y) => x - y);
      if (!a.length) return null;
      const i = (a.length - 1) * p;
      const lo = Math.floor(i), hi = Math.ceil(i);
      return lo === hi ? a[lo] : a[lo] + (a[hi] - a[lo]) * (i - lo);
    }

    /**
     * 时段趋势（2026-11-19 报告解读优化）：比较前半段 vs 后半段的有效 FPS 均值，
     * 识别「整段均值掩盖的后段持续劣化」——如真机报告里 16:41 后 FPS 从 ~38 掉到 ~20，
     * 全程均值仍显示 29.5，用户看不出后段明显变差。
     *
     * 输入是已剔除加载段 / null 的有效帧序列（调用方传 iNums(fpsCol)），按时间顺序分前后两半。
     * 只有「后段相对前段下降 ≥ dropRatio 且绝对差 ≥ minDropFps」才判定为显著劣化，
     * 单峰抖动 / 样本太少不报（避免制造结论）。
     * @returns {{early:number, late:number, dropPct:number, dropAbs:number, significant:boolean}|null}
     */
    function iPhaseTrend(nums, dropRatio, minDropFps) {
      const a = iNums(nums);
      // 至少 10 点才分半，且每半至少 5 点，样本太少不给趋势结论
      if (a.length < 10) return null;
      const half = Math.floor(a.length / 2);
      if (half < 5) return null;
      const mean = (arr) => arr.reduce((s, v) => s + v, 0) / arr.length;
      const early = mean(a.slice(0, half));
      const late = mean(a.slice(half));
      if (!(early > 0) || !(late > 0)) return null;
      const dropAbs = early - late;
      const dropPct = (dropAbs / early) * 100;
      const ratio = typeof dropRatio === 'number' ? dropRatio : 0.2;
      const floor = typeof minDropFps === 'number' ? minDropFps : 5;
      return {
        early: early, late: late,
        dropPct: dropPct, dropAbs: dropAbs,
        significant: dropPct >= ratio * 100 && dropAbs >= floor,
      };
    }

    /** 按候选路径取一列数值（同一列内逐点回退，兼容 android/pc/ios 不同字段名） */
    function iCol(pts, paths) {
      return (pts || []).map(p => {
        for (const path of paths) {
          let cur = p;
          for (const k of path.split('.')) cur = (cur == null ? undefined : cur[k]);
          if (typeof cur === 'number' && !isNaN(cur)) return cur;
        }
        return null;
      });
    }

    function iFmt(v, d) {
      return (typeof v === 'number' && !isNaN(v)) ? v.toFixed(d == null ? 1 : d) : '--';
    }

    /** 报告时长（秒）：优先用原始时间戳差值 */
    function iDurationSec() {
      const rows = (typeof perf !== 'undefined' && Array.isArray(perf)) ? perf : [];
      const ts = iNums(rows.map(it => {
        if (!it) return null;
        const t = it.timestamp;
        if (typeof t === 'number') return t;
        const p = Date.parse(String(t));
        return isNaN(p) ? null : p;
      }));
      if (ts.length >= 2) return Math.max(1, Math.round((Math.max.apply(null, ts) - Math.min.apply(null, ts)) / 1000));
      return null;
    }

    function iDurationText(sec) {
      if (sec == null) return '--';
      if (sec < 60) return sec + ' 秒';
      const m = Math.floor(sec / 60), s = sec % 60;
      return s ? (m + ' 分 ' + s + ' 秒') : (m + ' 分钟');
    }

    /** 首段 vs 末段（各取 30%）均值差，用于判断内存增长趋势 */
    function iTrend(vals) {
      const a = iNums(vals);
      if (a.length < 6) return null;
      const k = Math.max(2, Math.round(a.length * 0.3));
      const head = iMean(a.slice(0, k));
      const tail = iMean(a.slice(a.length - k));
      if (head == null || tail == null || head === 0) return null;
      return { head, tail, delta: tail - head, pct: ((tail - head) / head) * 100 };
    }

    function iLevelOfScore(score) {
      if (score >= 88) return { level: 'great', text: '优秀' };
      if (score >= 72) return { level: 'good',  text: '良好' };
      if (score >= 55) return { level: 'warn',  text: '一般' };
      return { level: 'bad', text: '较差' };
    }

    /**
     * 复合指数的可信度分层（不改变分数本身，只说清它能信到什么程度）。
     * 依据三条与「分数波动幅度」直接相关的实测因素：样本点数、有效时长、目标帧率来源。
     * 阈值是保守的经验界限（短采集分位数不稳、目标靠吸附会带系统偏差），不是统计检验。
     * @returns {{level:'high'|'mid'|'low', text:string, reasons:string[]}}
     */
    function iScoreConfidence(n, durSec, targetFromDevice) {
      const reasons = [];
      let level = 'high';
      if (n < 60) { level = 'low'; reasons.push('样本仅 ' + n + ' 个（<60，分位数不稳）'); }
      else if (n < 120) { level = 'mid'; reasons.push('样本 ' + n + ' 个（60~119）'); }
      if (durSec != null && durSec < 60) {
        level = 'low'; reasons.push('有效时长 ' + iDurationText(durSec) + '（<1 分钟）');
      } else if (durSec != null && durSec < 180 && level !== 'low') {
        level = 'mid'; reasons.push('有效时长 ' + iDurationText(durSec) + '（<3 分钟）');
      }
      if (!targetFromDevice && level !== 'low') {
        level = 'mid'; reasons.push('目标帧率由数据推断（非设备自报）');
      }
      const text = level === 'high' ? '较高' : (level === 'mid' ? '中等' : '较低');
      return { level, text, reasons };
    }

    /**
     * 生成解读数据。
     * @returns {{level:string,levelText:string,lead:string,items:Array,risks:Array}}
     */
    function buildInsight(pts, category) {
      const out = { level: 'good', levelText: '良好', lead: '', items: [], risks: [] };
      const n = (pts || []).length;
      // v1.9：会话级指标（冷启动 / ANR / 崩溃）必须同步进「解读总结」。
      // 它们原本只在页面下方的独立区块展示，曾出现「区块写着发生 ANR、解读却说
      // 未发现明显风险」的自相矛盾。data 是 data.js 注入的全局变量，这里防御读取。
      const sess = (typeof data !== 'undefined' && data && data.session) ? data.session : null;
      // 时长先按全程取，后面算完加载段再折算成「有效时长」（见「统计时长」段）
      const durSecAll = iDurationSec();
      let durSec = durSecAll;
      out.n = n;
      out.durSec = durSec;

      if (!n) {
        out.level = 'warn';
        out.levelText = '无数据';
        out.lead = '本次报告没有任何采样点，无法给出解读。请确认采集过程中设备保持连接。';
        return out;
      }

      /* ---------- iOS GPU 专项：只有 GPU 计数器，单独解读 ---------- */
      if (category === 'ios_gpu') {
        const alu  = iMean(iCol(pts, ['ALU Utilization']));
        const frag = iMean(iCol(pts, ['Fragment Occupancy']));
        const vert = iMean(iCol(pts, ['Vertex Occupancy']));
        const tex  = iMean(iCol(pts, ['Texture Sample Limiter']));
        const rbw  = iMean(iCol(pts, ['GPU Read Bandwidth']));
        const wbw  = iMean(iCol(pts, ['GPU Write Bandwidth']));
        const pr   = iMean(iCol(pts, ['Partial Renders']));

        const pushItem = (k, v, note, tone) => out.items.push({ k, v, note, tone });

        let hot = null;
        if (alu != null) {
          const tone = alu >= 90 ? 'warn' : (alu >= 60 ? 'info' : 'good');
          const note = alu >= 90 ? '着色器算力接近饱和' : (alu >= 60 ? '算力占用较高' : '算力仍有余量');
          pushItem('ALU', '均值 ' + iFmt(alu, 1) + '%', note, tone);
          hot = hot == null || alu > hot ? 'ALU' : hot;
        }
        if (frag != null) {
          const tone = frag >= 85 ? 'warn' : (frag >= 50 ? 'info' : 'good');
          pushItem('Fragment', '均值 ' + iFmt(frag, 1) + '%',
            frag >= 85 ? '片元阶段压力大，注意过度绘制' : (frag >= 50 ? '片元占用中等' : '片元阶段轻松'), tone);
          if (frag >= 85) hot = hot || 'Fragment';
        }
        if (vert != null) pushItem('Vertex', '均值 ' + iFmt(vert, 1) + '%',
          vert >= 80 ? '顶点处理接近上限' : '顶点处理正常', vert >= 80 ? 'warn' : 'good');
        if (tex != null) pushItem('纹理采样', '均值 ' + iFmt(tex, 1) + '%',
          tex >= 80 ? '采样受限，可能是带宽或缓存瓶颈' : '采样限制正常', tex >= 80 ? 'warn' : 'good');
        if (rbw != null || wbw != null) {
          pushItem('带宽', '读 ' + iFmt(rbw, 2) + ' / 写 ' + iFmt(wbw, 2) + ' GB/s',
            '反映显存访问压力', 'info');
        }
        if (pr != null) pushItem('Partial Renders', '均值 ' + iFmt(pr, 0),
          pr > 0 ? '存在分块渲染，通常与混合/遮罩有关' : '未出现分块渲染', pr > 0 ? 'info' : 'good');

        const lv = (alu != null && alu >= 90) || (frag != null && frag >= 85)
          ? { level: 'warn', text: 'GPU 高负载' }
          : (alu != null || frag != null ? { level: 'good', text: 'GPU 正常' } : { level: 'warn', text: '数据不足' });
        out.level = lv.level;
        out.levelText = lv.text;
        out.lead = '本次为 iOS GPU 专项采集，共 <b>' + n + '</b> 个采样点，时长 ' + iDurationText(durSec)
          + '。' + (alu != null ? ('ALU 利用率均值 <b>' + iFmt(alu, 1) + '%</b>') : '')
          + (frag != null ? ('，Fragment 占用 <b>' + iFmt(frag, 1) + '%</b>') : '')
          + (rbw != null ? ('，读带宽 <b>' + iFmt(rbw, 2) + ' GB/s</b>') : '')
          + '。' + (hot ? (hot + ' 是本次采集相对最重的阶段（不代表应用整体瓶颈）。')
            : '各阶段占用相对均衡，未达到高负载阈值。')
          + '本页为 GPU 专项采集，不含 FPS / CPU / 内存，不能据此判断整体流畅度。';

        if (alu != null && alu >= 90) out.risks.push({ tone: 'high', text: 'ALU 利用率长期高于 90%，着色器指令数或循环次数可能需要优化。' });
        if (frag != null && frag >= 85) out.risks.push({ tone: 'mid', text: 'Fragment 占用 ' + iFmt(frag, 1) + '%，建议检查过度绘制、透明混合与后处理链路。' });
        if (tex != null && tex >= 80) out.risks.push({ tone: 'mid', text: '纹理采样限制偏高，可考虑压缩纹理、降低采样次数或开启 mipmap。' });
        if (!out.risks.length) out.risks.push({ tone: 'info', text: '本次未触发 GPU 高负载阈值（仅覆盖渲染管线计数器，不代表应用整体无性能问题）。' });
        return out;
      }

      /* ---------- 取值 ---------- */
      const fpsCol   = iCol(pts, ['fps']);
      const jankCol  = iCol(pts, ['jank', 'jankRate', 'jank_rate']);
      const bjCol    = iCol(pts, ['bigJank', 'bigjank', 'big_jank']);
      const cpuSys   = iCol(pts, ['cpu.sysCpu', 'cpuTotalSystem', 'cpuUsage']);
      const cpuProc  = iCol(pts, ['cpu.procCpu']);
      const memCol   = iCol(pts, ['mem.totalPss', 'physFootprint', 'memResidentSize']);
      const tempCol  = iCol(pts, ['temperature']);
      const gpuCol   = iCol(pts, ['gpu']);
      const gpuTCol  = iCol(pts, ['gpuTemp']);

      const fpsMean = iMean(fpsCol);
      const fpsP5   = iPct(fpsCol, 0.05);
      const fpsP95  = iPct(fpsCol, 0.95);
      // 时段趋势（报告解读优化）：有效帧序列按时间分前后半，识别被全程均值掩盖的后段劣化。
      // fpsCol 中 no-frames 段的 null 已被 iNums 过滤，不把「切后台无帧」误判成掉帧。
      const phase = iPhaseTrend(iNums(fpsCol));
      const jankMean = iMean(jankCol);
      const bjNums  = iNums(bjCol);
      const bjSum   = bjNums.reduce((a, b) => a + b, 0);
      const cpuSysMean  = iMean(cpuSys);
      const cpuProcMean = iMean(cpuProc);
      const memMean  = iMean(memCol);
      const memMax   = iPct(memCol, 1);
      const memTrend = iTrend(memCol);
      const tempMean = iMean(tempCol);
      const tempMax  = iPct(tempCol, 1);
      const gpuMean  = iMean(gpuCol);
      const gpuTMean = iMean(gpuTCol);
      const gpuTMax  = iPct(gpuTCol, 1);
      const hasGpuUtil = gpuMean != null && iNums(gpuCol).some(v => v > 0);
      const hasGpuTemp = gpuTMean != null && iNums(gpuTCol).some(v => v > 0);
      // 热节流信号优先于绝对温度：Android 官方明确热阈值是 product policy specific，
      // 跨机型不可比；是否真的触发降频要看系统自报的 ADPF thermalStatus（0~4）。
      const thermalNums = iNums(iCol(pts, ['thermalStatus'])).filter(v => v != null);
      const thermalThrottling = thermalNums.some(v => v > 0);

      /* ---------- 统计时长：必须用剔除加载段后的有效时长 ----------
       * 「次/分钟」「次/时」这类按时间折算的指标，分母要是实际参与统计的时长。
       * 剔了样本却沿用全程时长，会把 BigJank / Drop 的密度算低（分母虚大）。
       */
      const linfo = ensureLoadingInfo();
      const keptRatio = (linfo && linfo.totalSamples)
        ? (linfo.totalSamples - linfo.excludedSamples) / linfo.totalSamples : 1;
      durSec = (durSecAll != null && keptRatio < 1)
        ? Math.max(1, Math.round(durSecAll * keptRatio)) : durSecAll;
      out.durSec = durSec;
      out.durSecAll = durSecAll;
      out.excludedSegs = (linfo && keptRatio < 1) ? linfo.segments.length : 0;
      out.excludedSec = (durSecAll != null && keptRatio < 1)
        ? Math.max(0, Math.round(durSecAll * (1 - keptRatio))) : 0;
      const hasExclusion = out.excludedSec > 0;

      /* ---------- 帧率目标：设备自报优先，无设备值再吸附到刷新率档位 ---------- */
      // S-01：此前这里自带一份旧 7 档表 + ceil/30 兜底，与 KPI 卡（走 deviceTargetHz /
      // snapFpsTarget）不是同一口径 —— 同一页会出现两个「目标帧率」，评分也跟着偏。
      let fpsTarget = deviceTargetHz();
      if (fpsTarget == null && fpsP95 != null && fpsP95 > 0) {
        for (const c of REFRESH_RATES_SHARED) { if (c >= fpsP95 * 0.97) { fpsTarget = c; break; } }
        if (fpsTarget == null) fpsTarget = Math.ceil(fpsP95);
      }

      /* ---------- 综合性能指数（参考） ----------
       * 口径诚实性修正（2026-11-17 全网核查）：复合指标方法论禁止给缺失维度填「中性偏好」值。
       * 旧实现给缺测的 Jank 维度硬编码 85 分、给缺测的 P5 硬编码 0.85 比例，
       * 会让「没测到 Jank」的报告得分高于「测到轻度 Jank」（约 73 分）—— 这是制造数据。
       * 现在核心维度（Jank、FPS P5）缺任一就不出综合指数，但分项解读与风险提示
       * 仍基于实测数据给出，避免整份报告失去解读。
       */
      let score = null;
      const scoreMissing = [];
      if (jankMean == null) scoreMissing.push('Jank');
      if (fpsP5 == null) scoreMissing.push('FPS P5');
      out.scoreMissing = scoreMissing;
      if (fpsMean != null && fpsTarget && !scoreMissing.length) {
        const fpsScore = Math.max(0, Math.min(100, (fpsMean / fpsTarget) * 100));
        const jankScore = Math.max(0, Math.min(100, 100 - jankMean * 9));
        const lowRatio = Math.max(0, Math.min(1, fpsP5 / fpsTarget));
        const stabScore = Math.max(0, Math.min(100, lowRatio * 100));
        let bjPenalty = 0;
        if (bjNums.length) {
          const perMin = durSec ? (bjSum / (durSec / 60)) : bjSum;
          bjPenalty = Math.min(25, perMin * 2);
        }
        score = Math.round(0.5 * fpsScore + 0.28 * jankScore + 0.22 * stabScore - bjPenalty);
        score = Math.max(0, Math.min(100, score));
      }

      /* ---------- 指数可信度分层（第五次筛查，2026-11-17）----------
       * 复合指数无法靠「调权重」变得客观：权重是内部经验值，没有 MOS / 用户主观打分
       * 标定，也没有行业统一标准——这部分的可信度天花板在代码之外，需外部真值数据。
       * 代码能诚实做的是：不要让一个 48 点 / 51s 的短采集显示成和 300 点 / 5min 一样
       * 精确的「28 分」。这里按样本量、有效时长、目标帧率来源给出可信度分层，
       * 分数照旧显示（保持历史可比），但明确说出来它此刻能信到什么程度。
       */
      if (score != null) {
        const conf = iScoreConfidence(n, durSec, fpsTarget != null && (() => {
          const L = (typeof data !== 'undefined' && data && data.loading) || null;
          return !!(L && L.targetSource === 'device-peak-refresh-rate' && Number(L.targetHz) > 0);
        })());
        out.scoreConfidence = conf;
      }

      /* ================= 分项解读 =================
       * 组织原则：
       *   1) 同一族的指标合并成一条（原来帧率族占了 6 条，读起来全是掉帧）
       *   2) 固定顺序：帧率 → 流畅度 → 稳定性 → 卡顿 → 系统资源 → 温度/GPU，
       *      不按严重程度重排，便于跨报告纵向对比
       *   3) 每条 note 写「这个数意味着什么」，不复述公式
       */
      const TONE_RANK = { bad: 0, warn: 1, info: 2, good: 3 };
      const worst = function () {
        let best = null;
        for (let ti = 0; ti < arguments.length; ti += 1) {
          const t = arguments[ti];
          if (!t || TONE_RANK[t] == null) continue;
          if (best == null || TONE_RANK[t] < TONE_RANK[best]) best = t;
        }
        return best || 'info';
      };
      const items = [];
      const push = (k, v, note, tone) => items.push({ k, v, note, tone: tone || 'info' });

      // ① 帧率：均值 / 目标 + 分布区间
      if (fpsMean != null) {
        let tone = 'info', note = '';
        if (fpsTarget) {
          const r = fpsMean / fpsTarget;
          if (r >= 0.97) { tone = 'good'; note = '满帧运行'; }
          else if (r >= 0.9) { tone = 'good'; note = '轻微掉帧，主观几乎无感'; }
          else if (r >= 0.8) { tone = 'warn'; note = '掉帧可感知'; }
          else if (r >= 0.6) { tone = 'bad'; note = '掉帧明显，体验受损'; }
          else { tone = 'bad'; note = '帧率严重不足'; }
        } else if (fpsMean > 0) {
          note = '帧率分布太散，未能吸附到常见刷新率';
        } else {
          // 全 0：取不到渲染层（不在前台 / 无 Surface），不是「0 帧也流畅」
          tone = 'warn';
          note = '未取到有效帧（应用可能不在前台或无渲染层）';
        }
        if (fpsP5 != null && fpsP95 != null && fpsP95 > 0) {
          note += (note ? '；' : '') + 'P5 ' + iFmt(fpsP5, 0) + ' ~ P95 ' + iFmt(fpsP95, 0);
        }
        push('帧率', '均值 ' + iFmt(fpsMean, 1) + (fpsTarget ? ' / 目标 ' + fpsTarget : ''), note, tone);
      }

      // ② 流畅度：1%Low + 卡顿时长（都是「最差时刻」口径，合成一条）
      const fpsNums = fpsCol.filter(v => v != null);
      const fm = fpsDerivedMetrics(fpsNums, fpsTarget);
      const q = fm ? perfFpsQualityInsight(fpsNums, fpsTarget, durSec) : null;
      if (q && (q.oneLow != null || q.stutter != null)) {
        const parts = [];
        let tone = 'good', note = '';
        if (q.oneLow != null) {
          parts.push('1%Low ' + iFmt(q.oneLow, 1) + '（采样点口径）');
          if (q.oneLow >= fpsTarget * 0.95) { tone = worst(tone, 'good'); note = '最差 1% 时段仍接近满帧'; }
          else if (q.oneLow >= fpsTarget * 0.85) { tone = worst(tone, 'warn'); note = '最差 1% 时段略有下滑'; }
          else { tone = worst(tone, 'bad'); note = '最差 1% 时段掉帧明显，卡顿集中在这里'; }
        }
        if (q.stutter != null) {
          parts.push('卡顿时长 ' + iFmt(q.stutter, 1) + '%');
          if (q.stutter >= 15) tone = worst(tone, 'bad');
          else if (q.stutter >= 8) tone = worst(tone, 'warn');
          if (q.stutter >= 8) note += (note ? '；' : '') + '帧间隔超 2 倍目标的时段较多';
        }
        push('流畅度', parts.join(' · '), note, tone);
      }

      // ③ 稳定性：达帧率 + 稳帧范围 + 降帧
      if (fm) {
        const parts = ['达帧率 ' + iFmt(fm.reach, 1) + '%'];
        const tones = [fm.reach >= 95 ? 'good' : (fm.reach >= 80 ? 'warn' : 'bad')];
        if (q && q.medRange != null) {
          parts.push('稳帧 ' + iFmt(q.medRange, 1) + '%');
          tones.push(q.medRange >= 80 ? 'good' : (q.medRange >= 60 ? 'warn' : 'bad'));
        }
        if (q && q.drop != null) {
          parts.push('降帧 ' + iFmt(q.drop, 1) + ' 次/时');
          tones.push(q.drop >= 30 ? 'bad' : (q.drop >= 10 ? 'warn' : 'good'));
        }
        const lowLine = Math.round(fm.target * 0.8);
        const note = fm.lowCount > 0
          ? (fm.lowCount + ' 个采样点低于 ' + lowLine + ' 帧')
          : ('无低于 ' + lowLine + ' 帧的采样');
        push('稳定性', parts.join(' · '), note, worst.apply(null, tones));
      }

      // ③a 时段趋势：整段均值会掩盖「后段持续掉帧」。只有显著劣化才出这一条，
      // 让用户知道要看曲线后段 / 低谷截图，而不是被一个中间值误导为全程稳定。
      out.phaseTrend = phase;
      if (phase && phase.significant) {
        push('时段趋势',
          '前段 ' + iFmt(phase.early, 1) + ' → 后段 ' + iFmt(phase.late, 1) + ' 帧（-'
            + iFmt(phase.dropPct, 0) + '%）',
          '后半段帧率明显低于前半段，全程均值掩盖了这次劣化；建议结合曲线后段与低谷截图定位场景变化',
          'warn');
      }

      // ③b 启动耗时（v1.9）：只有「进程原本不存在」的冷启动才有评价意义。
      // 温/热启动只是把已有任务带到前台，不参与冷启动快慢的判断。
      if (sess && sess.launch && typeof sess.launch.totalTimeMs === 'number') {
        const launchInfo = sess.launch;
        const st = String(launchInfo.state || '');
        const label = st === 'COLD' ? '冷启动' : (st === 'WARM' ? '温启动' : (st === 'HOT' ? '热启动' : '启动'));
        const ms = launchInfo.totalTimeMs;
        let tone = 'info', note = '仅作参考，温/热启动不参与冷启动评价';
        if (st === 'COLD') {
          tone = ms > 2000 ? 'warn' : (ms <= 1000 ? 'good' : 'info');
          note = ms > 2000 ? '超过 2s，用户可明显感知'
            : (ms <= 1000 ? '启动迅速' : '处于常见区间');
        }
        push('启动', label + ' ' + iFmt(ms, 0) + 'ms'
          + (typeof launchInfo.waitTimeMs === 'number'
            ? '（调度等待 ' + iFmt(launchInfo.waitTimeMs, 0) + 'ms）' : ''), note, tone);
      }

      // ④ 卡顿：Jank 次数 + BigJank（两条都在说掉帧，合并）
      // 注意用 `jank`（采集器归一化后的「次/秒」）而不是 jankRate：
      // pts 里没有 jankRate 字段，原实现取它导致「Jank 率」这一条从来没渲染出来过。
      const bjPerMin = (bjNums.length && durSec) ? (bjSum / (durSec / 60)) : null;
      if (jankMean != null || bjNums.length) {
        const parts = [];
        const tones = [];
        if (jankMean != null) {
          parts.push('Jank ' + iFmt(jankMean, 2) + ' 帧/拍');
          tones.push(jankMean <= 1 ? 'good' : (jankMean <= 3 ? 'warn' : 'bad'));
        }
        if (bjNums.length) {
          parts.push('BigJank ' + iFmt(bjSum, 0) + ' 帧'
            + (bjPerMin != null && bjPerMin > 0 ? '（' + iFmt(bjPerMin, 1) + ' 次/分）' : ''));
          tones.push(bjPerMin != null
            ? (bjPerMin >= 6 ? 'bad' : (bjPerMin >= 1 ? 'warn' : 'good'))
            : 'good');
        }
        let note;
        if (bjSum > 0) note = '>125ms 严重卡顿：成因请结合下方 FrameTimeline 归因确认';
        else if (jankMean != null && jankMean <= 0.5) note = '几乎没有可感知的卡顿';
        else note = '偶发掉帧，未出现 >125ms 严重卡顿';
        push('卡顿', parts.join(' · '), note, worst.apply(null, tones));
      }

      // ④b 卡顿归因（FrameTimeline / timestats，v1.9）：与下方 `jank-attr`
      // 独立区块同一口径。一帧可同时命中多个原因位，这里是「命中次数」不是构成比；
      // BufferStuffing 不是 jankyFrames 的子集，必须单列，不参与卡顿占比。
      {
        const ATTR_LABEL = {
          AppDeadlineMissed: '应用超时',
          SurfaceFlingerCpuDeadlineMissed: 'SF CPU 超时',
          SurfaceFlingerGpuDeadlineMissed: 'SF GPU 超时',
          SurfaceFlingerScheduling: 'SF 调度',
          PredictionError: '预测错误',
          Unknown: '未知原因',
        };
        const attrSum = {};
        let covered = 0, windowFrames = 0, jankyFrames = 0, stuffing = 0;
        pts.forEach((p) => {
          const a = p && p.jankAttr;
          if (!a || typeof a !== 'object' || typeof a._frames !== 'number' || a._frames <= 0) return;
          covered += 1;
          windowFrames += a._frames;
          jankyFrames += (typeof a._total === 'number' ? a._total : 0);
          Object.keys(a).forEach((k) => {
            if (k.charAt(0) === '_' || typeof a[k] !== 'number' || a[k] <= 0) return;
            if (k === 'BufferStuffing') stuffing += a[k];
            else attrSum[k] = (attrSum[k] || 0) + a[k];
          });
        });
        if (covered > 0) {
          const top = Object.keys(attrSum).sort((a, b) => attrSum[b] - attrSum[a]).slice(0, 2)
            .map((k) => (ATTR_LABEL[k] || k) + ' ' + attrSum[k]);
          const coreTotal = Object.keys(attrSum).reduce((s, k) => s + attrSum[k], 0);
          const noteParts = ['覆盖 ' + covered + '/' + n + ' 拍'
            + (windowFrames ? ' / 窗口 ' + windowFrames + ' 帧' : '')];
          if (top.length) noteParts.push('主因 ' + top.join(' · '));
          if (coreTotal > jankyFrames) {
            noteParts.push('成因可重叠（合计 ' + coreTotal + ' 次 > 卡顿 ' + jankyFrames + ' 帧），勿按占比相加');
          }
          if (stuffing) noteParts.push('另缓冲堆积 ' + stuffing + ' 次（独立计数，不与卡顿相加）');
          push('卡顿归因', jankyFrames > 0 ? '卡顿 ' + jankyFrames + ' 帧' : '未记录到卡顿帧',
            noteParts.join('；'), (!top.length && jankyFrames > 0) ? 'warn' : 'info');
        }
      }

      // ⑤ 上下文切换：正常时不占版面（统计表里仍有），偏高才单列
      const csCol = iCol(pts, ['cswitch']);
      const csNums = iNums(csCol);
      const csAvg = csNums.length ? csNums.reduce((a, b) => a + b, 0) / csNums.length : null;
      const limitCol = iCol(pts, ['cpuLimit']);
      const limitNums = iNums(limitCol);
      const limitMin = limitNums.length ? Math.min.apply(null, limitNums) : null;
      // 14000/s 出自 PerfDog 的 iOS「单核」经验阈值（Core/Second），不是 Android 官方机制；
      // 拿整机/进程均值套到 Android 并断言「会被 kill」缺乏依据。两档都降为提示，措辞注明来源。
      if (csAvg != null && csAvg >= 8000) {
        push('上下文切换', '均值 ' + iFmt(csAvg, 0) + ' 次/s',
          csAvg >= 14000
            ? '偏高（14000/s 为 iOS 单核经验阈值，Android 无官方对应阈值，仅供参考）'
            : '偏高，线程调度开销大（Android 无官方统一阈值）',
          'warn');
      }

      // ⑥ CPU
      if (cpuSysMean != null || cpuProcMean != null) {
        const parts = [];
        if (cpuSysMean != null) parts.push('系统 ' + iFmt(cpuSysMean, 1) + '%');
        if (cpuProcMean != null) parts.push('进程 ' + iFmt(cpuProcMean, 1) + '%');
        let tone = 'good', note = '负载轻，CPU 不是瓶颈';
        const load = cpuSysMean != null ? cpuSysMean : cpuProcMean;
        if (load >= 85) { tone = 'bad'; note = '接近满载，可能成为瓶颈（需区分系统与其他进程占用）'; }
        else if (load >= 65) { tone = 'warn'; note = '负载偏高'; }
        else if (load >= 40) { tone = 'info'; note = '负载中等'; }
        push('CPU', parts.join('，'), note, tone);
      }

      // ⑦ 内存
      if (memMean != null) {
        let note = '峰值 ' + iFmt(memMax, 0) + ' MB';
        let tone = 'good';
        if (memTrend) {
          note += '，首段→末段 ' + (memTrend.delta >= 0 ? '+' : '') + iFmt(memTrend.pct, 1) + '%';
          // 单次首尾对比不足以判定「泄漏」：资源加载、缓存积累、GC 未回收都会增长。
          if (memTrend.pct >= 20 && memTrend.delta >= 30) { tone = 'bad'; note += '，持续增长（需更长时段才能区分泄漏与正常缓存）'; }
          else if (memTrend.pct >= 8 && memTrend.delta >= 15) { tone = 'warn'; note += '，有持续增长'; }
          else if (memTrend.pct <= -8) { tone = 'good'; note += '，有回落'; }
        }
        push('内存', '均值 ' + iFmt(memMean, 0) + ' MB', note, tone);
      }

      // ⑧ 温度（辅助指标）
      // 45/50°C 这类绝对阈值跨机型不可靠（厂商温控策略不同），是否降频以 thermalStatus 为准。
      if (tempMean != null && iNums(tempCol).some(v => v > 0)) {
        let tone = 'info';
        let note;
        if (thermalNums.length) {
          tone = thermalThrottling ? 'warn' : 'info';
          note = thermalThrottling
            ? '系统已报告热节流，温度偏高与限频一致'
            : '系统热节流全程 0 级，未观察到降频；绝对温度仅供参考';
        } else if (tempMax != null && tempMax >= 50) {
          tone = 'warn';
          note = '绝对温度较高，但本机未暴露热节流信号，是否已降频无法确认';
        } else if (tempMax != null && tempMax >= 45) {
          note = '绝对温度偏高，是否降频请以热节流信号为准';
        } else {
          tone = 'good';
          note = '绝对温度正常';
        }
        push('温度', '均值 ' + iFmt(tempMean, 1) + '°C / 峰值 ' + iFmt(tempMax, 1) + '°C', note, tone);
      }

      // ⑧b ADPF 热节流信号（v3 新增）：系统自报的节流等级与冷却动作。
      // Status>0 = 系统正在限频，是掉帧归因时最直接的证据；null = ROM 未暴露，不显示。
      {
        const stCol = iNums(pts.map(p => p.thermalStatus)).filter(v => v != null);
        if (stCol.length) {
          const stMax = Math.max.apply(null, stCol);
          const stHits = stCol.filter(v => v > 0).length;
          const coolVals = iNums(pts.map(p => p.coolingValue)).filter(v => v != null);
          const coolMax = coolVals.length ? Math.max.apply(null, coolVals) : null;
          if (stMax > 0) {
            push('热节流', '峰值等级 ' + stMax + ' 级（' + stHits + '/' + stCol.length + ' 拍节流中）'
              + (coolMax != null && coolMax > 0 ? '，最大冷却动作 ' + iFmt(coolMax, 0) : ''),
              '系统正在主动限频，掉帧时段请与温度曲线对照',
              stMax >= 3 ? 'bad' : 'warn');
          } else {
            push('热节流', '全程 0 级', '未触发系统热节流', 'good');
          }
        }
      }

      // ⑨ GPU
      if (hasGpuUtil) {
        let tone = 'info', note = '占用中等';
        if (gpuMean >= 85) { tone = 'warn'; note = 'GPU 高负载，可能成为瓶颈'; }
        else if (gpuMean >= 60) { tone = 'info'; note = 'GPU 负载较高'; }
        else { tone = 'good'; note = 'GPU 有余量'; }
        push('GPU', '利用率均值 ' + iFmt(gpuMean, 1) + '%', note, tone);
      } else if (hasGpuTemp) {
        push('GPU', '温度均值 ' + iFmt(gpuTMean, 1) + '°C / 峰值 ' + iFmt(gpuTMax, 1) + '°C',
          '利用率不可读（需 root），已改用温度',
          (gpuTMax != null && gpuTMax >= 70) ? 'warn' : 'info');
      } else {
        push('GPU', '--', '该机型未开放 GPU 数据读取', 'info');
      }

      out.items = items;

      /* ================= 风险提示 ================= */
      // 措辞跟随统计口径：剔除了加载段就不能再说「全程」
      const scopeWord = hasExclusion ? '排除加载段后' : '全程';
      if (fpsTarget && fpsMean != null && fpsMean / fpsTarget < 0.85) {
        out.risks.push({ tone: 'high', text: '帧率仅达目标 ' + Math.round((fpsMean / fpsTarget) * 100)
          + '%，请结合逐帧指标与卡顿归因定位（渲染耗时、GPU 负载、温控都可能）。' });
      }
      // 时段趋势风险：与分项解读同一判据（phase.significant），两处必须同步——
      // 否则会出现「分项说后段劣化、风险清单却只谈全程均值」的自相矛盾。
      if (phase && phase.significant) {
        out.risks.push({
          tone: 'mid',
          text: '后段帧率较前段下降 ' + iFmt(phase.dropPct, 0) + '%（' + iFmt(phase.early, 1)
            + ' → ' + iFmt(phase.late, 1) + ' 帧），全程均值掩盖了这次劣化；'
            + '建议在曲线上框选后段并结合低谷截图定位：是场景切换、UI 重绘还是限帧策略变化。',
        });
      }
      if (fm && fm.lowPct >= 20) {
        out.risks.push({
          tone: 'mid',
          text: '低帧占比 ' + iFmt(fm.lowPct, 1) + '%（' + fm.lowCount + ' 个采样点 FPS < ' + Math.round(fm.target * 0.8) + '），可在曲线图上框选这些时段定位原因。',
        });
      }
      // 均帧超目标不再单独提示：帧率不足（high）与低帧占比（mid）已经覆盖同一件事，
      // 三条并列只会稀释风险清单的信噪比。
      if (jankMean != null && jankMean > 3) {
        out.risks.push({ tone: 'high', text: 'Jank 平均 ' + iFmt(jankMean, 1) + ' 次/秒，掉帧已可被用户明显感知。' });
      }
      if (bjNums.length && bjSum > 0 && durSec) {
        const perMin = bjSum / (durSec / 60);
        if (perMin >= 1) {
          out.risks.push({ tone: 'mid', text: '出现 ' + iFmt(bjSum, 0) + ' 次 >125ms 卡顿帧（约 ' + iFmt(perMin, 1)
            + ' 次/分钟）。125ms 只是严重卡顿的判定阈值，并不指向具体成因；请结合下方 FrameTimeline 归因确认。' });
        }
      }
      // v1.9：本轮 ANR / 崩溃必须进风险清单。否则独立区块显示「ANR 1」，
      // 解读总结却按性能指标说「未发现明显风险」，两处结论互相打架。
      if (sess && sess.exit && sess.exit.supported !== false) {
        const exitInfo = sess.exit;
        if ((exitInfo.anr || 0) > 0) {
          out.risks.push({ tone: 'high', text: '本轮发生 ' + exitInfo.anr + ' 次 ANR，请结合主线程阻塞与卡顿归因排查。' });
        }
        const crashN = (exitInfo.crash || 0) + (exitInfo.nativeCrash || 0);
        if (crashN > 0) {
          out.risks.push({ tone: 'high', text: '本轮发生 ' + crashN + ' 次崩溃，采集期间应用进程可能已重启。' });
        }
      }
      if (memTrend && memTrend.pct >= 8 && memTrend.delta >= 15) {
        out.risks.push({ tone: 'mid', text: '内存首段→末段增长 ' + iFmt(memTrend.pct, 1) + '%（+' + iFmt(memTrend.delta, 0) + ' MB），长时间运行存在内存压力。' });
      }
      // 温度不单独构成 high 风险：绝对阈值跨机型不可比，是否降频以系统热节流信号为准。
      if (thermalThrottling) {
        out.risks.push({ tone: 'mid', text: '系统上报热节流（ADPF status > 0），当前帧率下降需与温度曲线对照。' });
      } else if (tempMax != null && tempMax >= 50 && !thermalNums.length) {
        out.risks.push({ tone: 'info', text: '温度峰值 ' + iFmt(tempMax, 1) + '°C 较高，但本机未上报热节流状态；绝对阈值跨机型不可比，仅供参考。' });
      }
      if (cpuSysMean != null && cpuSysMean >= 80) {
        out.risks.push({ tone: 'mid', text: '系统 CPU 均值 ' + iFmt(cpuSysMean, 1) + '%，整机负载饱和会放大掉帧。' });
      }
      if (csAvg != null && csAvg >= 14000) {
        out.risks.push({ tone: 'mid', text: '上下文切换均值 ' + iFmt(csAvg, 0) + ' 次/s，调度开销偏高。'
          + '注：14000/s 是 PerfDog 对 iOS 单核的经验阈值（Core/Second），Android 无官方对应阈值，'
          + '不能据此断定进程会被系统终止。' });
      } else if (csAvg != null && csAvg >= 8000) {
        out.risks.push({ tone: 'mid', text: '上下文切换 ' + iFmt(csAvg, 0) + ' 次/s 偏高，线程调度开销大，可排查频繁唤醒。' });
      }
      if (limitMin != null && limitMin < 100) {
        out.risks.push({
          tone: 'mid',
          text: 'CPU 可调度最大频率被限制在硬件上限的 ' + iFmt(limitMin, 0) + '%（疑似温控降频），高负载场景帧率会受影响。',
        });
      }
      if (!hasGpuUtil && !hasGpuTemp) {
        out.risks.push({ tone: 'info', text: 'GPU 数据不可读：该机型节点未开放（需 root），本报告 GPU 部分为空属正常现象。' });
      } else if (!hasGpuUtil && hasGpuTemp) {
        out.risks.push({ tone: 'info', text: 'GPU 利用率需 root 才能读取，已改用 GPU 温度反映负载趋势。' });
      }
      if (!out.risks.length) {
        out.risks.push({ tone: 'info', text: '本次采集的指标未触发预警阈值；这不等于应用没有性能问题，'
          + '短时/特定场景的问题需要用对应场景复测才能暴露。' });
      }
      // 风险按严重程度排序：high → mid → info，第一条会被拿去当结论的收尾
      const RISK_RANK = { high: 0, mid: 1, info: 2 };
      out.risks.sort((a, b) => (RISK_RANK[a.tone] == null ? 3 : RISK_RANK[a.tone])
        - (RISK_RANK[b.tone] == null ? 3 : RISK_RANK[b.tone]));

      /* ================= 总评 ================= */
      if (score == null) {
        // 第三种「无指数」：有 FPS 均值但核心维度缺测。必须说清是「没测到」而非「没问题」，
        // 更不能沿用旧实现的估计分（那会让缺测报告看起来比轻度卡顿还好）。
        if (fpsMean != null && fpsTarget && scoreMissing.length) {
          out.level = 'warn';
          out.levelText = '部分指标缺测';
          out.lead = '本次采集到 FPS 均值 <b>' + iFmt(fpsMean, 1) + '</b>，但缺少 '
            + scoreMissing.join(' / ') + '，按口径诚实原则不给出综合性能指数（不以估计值代替实测）。'
            + '以下分项解读与风险提示仍基于实测数据。';
          return out;
        }
        // 区分两种「没有 FPS 指标」：真没有 fps 字段（专项采集）vs 有字段但全是 0
        const fpsAll = iNums(fpsCol);
        const allZero = fpsAll.length > 0 && fpsAll.every(v => v <= 0);
        out.level = allZero ? 'warn' : 'good';
        out.levelText = allZero ? '无有效帧' : '已解读';
        out.lead = allZero
          ? ('本次未取到有效帧（应用不在前台或无渲染层），共 <b>' + n + '</b> 个采样点，时长 ' + iDurationText(durSec)
             + '。帧率相关指标不可用，以下为其他指标的实际表现。')
          : ('本报告为专项采集（无 FPS 数据），共 <b>' + n + '</b> 个采样点，时长 ' + iDurationText(durSec) + '。以下为各指标的实际表现。');
        return out;
      }

      const lv = iLevelOfScore(score);
      out.level = lv.level;
      out.levelText = lv.text;
      out.score = score;

      const bits = [];
      // 「整体流畅度」这个命名与权威结论冲突：PerfDog 明确「平均 FPS 与卡顿无直接关系」，
      // 而本指数 50% 权重来自平均 FPS。改名为「综合性能指数（参考）」，并在末尾公开公式。
      bits.push('综合性能指数（参考）<b>' + lv.text + '</b>（' + score + ' 分）');
      if (fpsMean != null) bits.push('FPS 均值 <b>' + iFmt(fpsMean, 1) + '</b>' + (fpsTarget ? '（目标 ' + fpsTarget + '）' : ''));
      if (fm) bits.push('达帧率 <b>' + iFmt(fm.reach, 1) + '%</b>');
      if (hasExclusion) bits.push('已排除 ' + out.excludedSegs + ' 段加载期（' + out.excludedSec + 's）');
      // 收尾用最高级别的真实风险，而不是固定的「表现稳定」
      const topRisk = out.risks.find(r => r.tone === 'high') || out.risks.find(r => r.tone === 'mid');
      const tail = topRisk ? ('最需关注：' + topRisk.text)
        : (scopeWord + '各项采集到的指标未触发预警阈值（不等同于所有场景都没有问题）。');
      // 评分必须可追溯：公开权重、惩罚上限与分档，并说明它不等于用户感知流畅度。
      // 复合指标若无依据且不表达不确定性，参考价值很有限（见核查记录）。
      let formula = '<br><span class="sub-cut">指数口径：帧率 50% + 卡顿 28% + 稳定 22% − BigJank 罚分（上限 25）；'
        + '优秀≥88 / 良好≥72 / 一般≥55。权重与分档为内部经验值，非行业统一标准；'
        + '平均 FPS 反映吞吐而非主观流畅度，判断卡顿请优先看下方逐帧指标与卡顿归因。</span>';
      // 可信度分层：分数照旧给出（保历史可比），但把「这次能信到什么程度」写明。
      // 权重无 MOS 标定这条属于指数本身的天花板，不能靠文案消除——如实写在末尾。
      if (out.scoreConfidence) {
        const c = out.scoreConfidence;
        formula += '<br><span class="sub-cut">本次指数可信度 <b>' + c.text + '</b>'
          + (c.reasons.length ? '（' + c.reasons.join('；') + '）' : '')
          + '。指数未经主观体验打分（MOS）标定，不能跨机型 / 跨版本当作验收阈值；'
          + '分数接近时请以下方逐项指标与风险提示为准。</span>';
      }
      out.lead = bits.join('，') + '。' + tail + formula;

      return out;
    }

    /** 把解读渲染成区块，插到指标卡片下方（各平台模板通用） */
    function renderInsight(pts, category) {
      // 达帧率 / 均帧 / 低帧 三张补充卡片（无 FPS 数据的平台自动隐藏）
      renderFpsKpiCards(fpsDerivedMetrics(fpsSeriesOf(pts), fpsTargetOf(pts)));

      const cards = document.querySelector('section.cards');
      if (!cards || !cards.parentNode) return;
      let box = document.getElementById('insight-box');
      if (!box) {
        box = document.createElement('section');
        box.id = 'insight-box';
        box.className = 'insight';
        cards.parentNode.insertBefore(box, cards.nextSibling);
      }
      const r = buildInsight(pts, category);
      const subParts = [r.n + ' 个采样点'];
      // 样本量置信度：3 拍和 300 拍不能给出同样确定的「优秀/较差」。
      if (r.n < 30) {
        subParts.push('<span class="sub-cut">样本仅 ' + r.n + ' 个（分位数与占比不稳定，结论仅供参考）</span>');
      }
      // 核心维度缺测时综合指数未计算，副标题必须说清，别让空白被读成「没风险」。
      if (r.scoreMissing && r.scoreMissing.length) {
        subParts.push('<span class="sub-cut">综合指数未计算：缺 ' + r.scoreMissing.join(' / ') + '</span>');
      }
      // FIX-05：等距 category 轴的提示——采样间隔不恒定（采集耗时波动），
      // 精确定位请看各指标的原始采样页（Excel「原始采样」表含 tickStartTs/timestamp）。
      if (!subParts.__intervalNoted) subParts.push('采样间隔不恒定（含采集耗时）');
      // FIX-16：两种「帧分布为空」的语义要在报告里说清，别让用户把 -- 读成「没测」：
      //   low-activity = 产出了帧但太少（帧数不足，分布无统计意义；fps 仍是实测值）
      //   none / no-frames / timestats-init = 本周期没有可见渲染帧
      {
        const lowN = pts.filter((p) => p.fpsMethod === 'low-activity').length;
        const noneN = pts.filter((p) => ['none', 'no-frames', 'timestats-init', 'error']
          .includes(p.fpsMethod)).length;
        if (lowN > 0) subParts.push(`<span class="sub-cut">${lowN} 拍帧数不足（帧分布未统计，FPS 为实测）</span>`);
        if (noneN > 0) subParts.push(`<span class="sub-cut">${noneN} 拍无渲染帧</span>`);
        // FIX-03：取帧通道命中率。同一轮里出现多个通道时，各通道的 jank 口径本就不同
        //（timestats 走 present2present 直方图、framestats 走逐帧 vsync 差、gfxinfo-delta
        // 只给计数），把曲线当连续趋势读会得出错误结论。这里显式列出通道与拍数，
        // 真正发生切换时给出提示，而不是让用户自己从 Excel 里数 fpsMethod。
        {
          const chCount = {};
          pts.forEach((p) => {
            const m = p && p.fpsMethod ? String(p.fpsMethod) : '';
            if (!m) return;
            chCount[m] = (chCount[m] || 0) + 1;
          });
          const real = ['timestats', 'framestats', 'gfxinfo-delta']
            .filter((m) => chCount[m] > 0);
          if (real.length === 1) {
            subParts.push(`取帧通道 ${real[0]}（${chCount[real[0]]} 拍）`);
          } else if (real.length > 1) {
            subParts.push(`<span class="sub-cut">取帧通道切换 ${real
              .map((m) => `${m}×${chCount[m]}`).join(' / ')}（各通道 jank 口径不同，跨通道段不宜直接比较）</span>`);
          }
        }
        // r3 遗留项闭环（FIX-13 dtMs 下游消费）：长间隔拍（>3s，瞬时指标已断截）
        const staleN = pts.filter((p) => typeof p.dtMs === 'number' && p.dtMs > 3000).length;
        if (staleN > 0) subParts.push(`<span class="sub-cut">${staleN} 拍长间隔（&gt;3s，瞬时指标断截）</span>`);
      }
      // 时长写「有效时长」：剔除了加载段，直接写全程会和各指标的分母对不上
      if (r.durSec != null) subParts.push('有效时长 ' + iDurationText(r.durSec));
      let subHtml = subParts.join(' · ');
      if (r.excludedSec > 0) {
        subHtml += ' · <span class="sub-cut">已排除 ' + r.excludedSegs + ' 段加载 ' + r.excludedSec + 's</span>';
      }
      const esc = (s) => String(s);

      let html = ''
        + '<div class="insight-head">'
        +   '<span class="insight-title">解读总结</span>'
        +   '<span class="insight-badge insight-badge--' + r.level + '">' + esc(r.levelText) + '</span>'
        +   '<span class="insight-sub">' + subHtml + '</span>'
        + '</div>'
        + '<div class="insight-lead">' + r.lead + '</div>';

      if (r.items.length) {
        html += '<ul class="insight-list">';
        for (const it of r.items) {
          html += '<li><i class="insight-dot insight-dot--' + (it.tone || 'info') + '"></i><b>' + it.k + '</b>' + it.v
            + (it.note ? '<span class="insight-note insight-note--' + (it.tone || 'info') + '"> · ' + it.note + '</span>' : '')
            + '</li>';
        }
        html += '</ul>';
      }

      if (r.risks.length) {
        html += '<div class="insight-risks">';
        for (const rk of r.risks) {
          const flag = rk.tone === 'high' ? '⚠ 风险' : (rk.tone === 'mid' ? '△ 注意' : 'ℹ 提示');
          html += '<div class="insight-risk insight-risk--' + rk.tone + '">' + flag + '：' + rk.text + '</div>';
        }
        html += '</div>';
      }

      box.innerHTML = html;
    }

    function pickNum(obj, keys) {
      for (const k of keys) {
        const v = obj && obj[k];
        if (typeof v === 'number' && !isNaN(v)) return v;
      }
      return null;
    }

    function buildTagStatsRows() {
      if (!Array.isArray(tags) || tags.length === 0) return [];
      const rows = [];
      const firstName = Object.keys(CHART_CONFIGS)[0];
      const times = chartMgr._data[firstName]?.times || [];
      const n = times.length || 0;
      if (!n) return rows;
      const segs = tags
        .filter(t => Array.isArray(t) && t.length >= 2)
        .map(t => [Math.max(0, Math.min(n - 1, (t[0] | 0))), Math.max(0, Math.min(n - 1, (t[1] | 0)))])
        .filter(t => t[1] >= t[0]);
      for (let si = 0; si < segs.length; si++) {
        const [fromIdx, toIdx] = segs[si];
        const segName = `子场景${si + 1}`;
        for (const [chartName, cfg] of Object.entries(CHART_CONFIGS)) {
          const state = chartMgr._data[chartName];
          if (!state) continue;
          const seriesDefs = cfg.series || [];
          for (let i = 0; i < seriesDefs.length; i++) {
            const metric = seriesDefs[i].name || `${chartName}.${i}`;
            const full = state.series[i] || [];
            const slice = full.slice(fromIdx, toIdx + 1);
            const st = calcMeanMax(slice);
            rows.push({ seg: segName, metric, mean: st.mean, max: st.max, fromIdx, toIdx });
          }
        }
      }
      return rows;
    }

    function renderTagStats() {
      const hint = document.getElementById('tag-hint');
      const tb = document.querySelector('#tbl-tags tbody');
      const wrap = document.getElementById('wrap-stats-tags');
      if (!tb) return;
      tb.innerHTML = '';
      if (!tags || !tags.length) {
        // 没有子场景就别占一大块空白
        if (wrap) wrap.hidden = true;
        if (hint) hint.textContent = '未找到 tag（请确认 data.js 内包含 data.tag 或 data.tags）。';
        return;
      }
      if (wrap) wrap.hidden = false;
      if (hint) {
        const mapping = tags
          .filter(t => Array.isArray(t) && t.length >= 2)
          .map((t, i) => `子场景${i + 1}=[${t[0]},${t[1]}]`)
          .join('，');
        hint.textContent = `共 ${tags.length} 个子场景：${mapping}`;
      }
      const rows = buildTagStatsRows();
      if (!rows.length) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="4" style="color:var(--text2)">无法生成子场景统计（可能还未渲染出数据序列）</td>`;
        tb.appendChild(tr);
        return;
      }
      rows.forEach(r => {
        const tr = document.createElement('tr');
        const _ta = (window.MetricInfo ? MetricInfo.attr(r.metric) : '');
        tr.innerHTML = `<td>${r.seg}</td><td${_ta}>${r.metric}</td><td>${fmtStat(r.mean)}</td><td>${fmtStat(r.max)}</td>`;
        tb.appendChild(tr);
      });
      if (window.MetricInfo) MetricInfo.decorate(tb);
    }

    // selection state (by x-axis index)
    let selection = null; // {fromIdx,toIdx}
    let _pcFramePts = null; // PC 分支归一化后的采样点（统计表附加「帧延迟分解」行用）

    function calcStats(arr) {
      const nums = (arr || []).filter(v => typeof v === 'number' && !isNaN(v));
      if (!nums.length) return { mean: null, max: null, p98: null };
      let sum = 0;
      let mx = -Infinity;
      for (const v of nums) { sum += v; if (v > mx) mx = v; }
      const sorted = nums.slice().sort((a,b)=>a-b);
      const idx = Math.max(0, Math.ceil(sorted.length * 0.98) - 1);
      return { mean: sum / nums.length, max: mx, p98: sorted[idx] };
    }

    function fmtStat(v) {
      if (v == null || typeof v !== 'number' || isNaN(v)) return '--';
      return String(Math.round(v * 1000) / 1000);
    }

    /** 图表短名：动态系列（各核心）在统计表里需要带上归属，否则会出现多个同名「Core 0」 */
    const CHART_LABELS = {
      cpu: 'CPU', mem: '内存', memDetail: '内存明细', memdetail: '内存明细',
      fps: '帧率', net: '网络', gpu: 'GPU', temp: '温度', current: '电流', power: '功耗',
      disk: '磁盘', events: '系统事件', cpuCores: '各核心CPU', cpuFreq: '各核心频率',
      occupancy: 'GPU占用', aluPerf: 'ALU', texture: '纹理', bandwidth: '带宽',
      cache: '缓存', shader: '着色器',
    };

    /** 统计表「主表」保留的关键指标，其余（内存分项 / 各核心）折叠到明细里 */
    const MAIN_METRICS = new Set([
      '系统CPU', '进程CPU', 'FPS', 'PSS', '物理内存', 'RSS',
      'Jank', 'BigJank', 'SmallJank', 'TinyJank', '上下文切换', 'GPU', 'GPU 温度', '温度',
      '下行', '上行', '读 KB/s', '写 KB/s',
      '达帧率', '均帧', '帧耗时标准差', '帧耗时方差', '低帧占比', '1%Low', 'Drop',
      'FPS≥目标', '稳帧范围', '帧率标准差', '卡顿时长占比', 'FPS(全程)',
      'Jank/10min', 'BigJank/10min', 'SmallJank/10min', 'TinyJank/10min',
      // v3：PC 帧延迟分解（PresentMon v1 列，PC 报告统计表主表展示）
      '上屏间隔', 'Present→上屏延迟', 'Present 调用耗时', '渲染完成延迟', '帧起点间距',
    ]);

    /** 属于「帧率」家族的系列名：整段统计时统一剔除加载段 */
    const FPS_STAT_METRICS = new Set(['FPS', 'Jank', 'BigJank', 'SmallJank', 'TinyJank']);

    /** 从各图表的 fmt 反推单位（fmt(1) 形如 "1.0%" / "1 MB"） */
    function metricUnitOf(cfg) {
      try {
        const s = String(cfg.fmt(1));
        const u = s.replace(/^-?[\d.]+/, '').trim();
        return u.length <= 8 ? u : '';
      } catch (_) { return ''; }
    }

      function buildTableRows(scope) {
        return dedupeStatRows(buildTableRowsRaw(scope));
      }

      function buildTableRowsRaw(scope) {
        // scope: {fromIdx,toIdx} inclusive indices on any chart's times array
        const rows = [];
      for (const [chartName, cfg] of Object.entries(CHART_CONFIGS)) {
        const state = chartMgr._data[chartName];
        if (!state) continue;
        const seriesDefs = cfg.series || [];
        const unit = metricUnitOf(cfg);
        for (let i = 0; i < seriesDefs.length; i++) {
          const rawName = seriesDefs[i].name || `${chartName}.${i}`;
          // 各核心 CPU / 频率两图都叫 Core N，加前缀区分
          const name = cfg.dynamic ? `${CHART_LABELS[chartName] || chartName} · ${rawName}` : rawName;
          const full = state.series[i] || [];
          let slice = (scope && scope.fromIdx != null && scope.toIdx != null)
            ? full.slice(scope.fromIdx, scope.toIdx + 1)
            : full;
          // 整段统计时，FPS 家族跳过加载段（框选模式下按用户选区原样统计，
          // 用户既然框了就是明确要看这一段）
          if (!scope) {
            const info = ensureLoadingInfo();
            if (info.excludedSamples && FPS_STAT_METRICS.has(rawName)) {
              slice = maskToNull(slice, info.mask);
            }
          }
          const st = calcStats(slice);
          rows.push({ metric: name, raw: rawName, unit, mean: st.mean, max: st.max, p98: st.p98, dynamic: !!cfg.dynamic });
        }
      }

      // FPS 派生指标：达帧率 / 均帧 / 低帧占比。
      // 下面 perfFpsQualityRows 已经给整段统计算过同名的三行（PerfDog 口径），
      // 所以整段模式下这里不再追加，否则表格里会出现两条同名行；
      // 只有用户框选了区间（整段行不参与统计）时才用这里的随选区版本顶上。
      const fpsState2 = chartMgr._data.fps;
      if (scope && fpsState2 && fpsState2.series && fpsState2.series[0]) {
        const full = fpsState2.series[0] || [];
        const slice = (scope.fromIdx != null && scope.toIdx != null)
          ? full.slice(scope.fromIdx, scope.toIdx + 1)
          : full;
        // 目标帧率按整段算，不随选区变化
        const fm = fpsDerivedMetrics(slice, fpsTargetOfSeries(full));
        if (fm) {
          rows.push({ metric: '达帧率', raw: '达帧率', unit: '%', mean: fm.reach, max: fm.reach, p98: fm.reach });
          rows.push({ metric: '均帧', raw: '均帧', unit: 'ms', mean: fm.frameTime, max: fm.frameTime, p98: fm.frameTime });
          rows.push({ metric: '低帧占比', raw: '低帧占比', unit: '%', mean: fm.lowPct, max: fm.lowPct, p98: fm.lowPct });
        }
      }

      // PerfDog 口径的其余帧率质量指标（整段统计，不随框选区变化）
      if (!scope) {
        const durSec = reportDurationSec();
        // 这里要在本作用域自取（写在别处的 const 会因作用域报错、被 onReady 静默吞掉）
        const _fps = chartMgr._data.fps;
        const fpsFull = (_fps && _fps.series && _fps.series[0]) || [];
        const qRows = perfFpsQualityRows(
          _fps ? (_fps.series[0] || []) : [],
          _fps ? (_fps.series[1] || []) : [],
          _fps ? (_fps.series[2] || []) : [],
          _fps ? (_fps.series[3] || []) : [],
          _fps ? (_fps.series[4] || []) : [],
          fpsTargetOfSeries(fpsFull), durSec
        );
        // 有采样点但一帧都没渲染（应用在后台 / 无 Surface / 非前台）：
        // 目标帧率由帧率分布 P95 推出，全 0 时无解，整族帧率质量指标会被算空。
        // 不能静默丢掉这些行，否则用户只会看到「参数少了一大截」却不知道为什么。
        if (!qRows.length && fpsFull.some(v => typeof v === 'number' && !isNaN(v))) {
          qRows.push({
            metric: '帧率质量', raw: '帧率质量', unit: '',
            mean: null, max: null, p98: null,
            sub: '本次采集未取到有效帧（应用不在前台或无渲染层），达帧率/均帧/低帧等指标不可用',
          });
        }
      for (const r of qRows) rows.push(r);
        }

        // PC 帧延迟分解（v3 新增，PresentMon v1 列 1s 均值）：与 Android 端帧耗时
        // 分位数对齐，回答「延迟花在哪个阶段」。旧报告 / PresentMon 无权限时全 null，
        // 整组隐藏而不是留 5 行「--」。_pcFramePts 由 PC 分支在归一化后赋值。
        if (category === 'pc' && _pcFramePts
          && ['_frameDisplayChangeMs', '_frameUntilDisplayedMs', '_framePresentApiMs',
            '_frameRenderLatencyMs', '_frameAppStartGapMs'].some(k => _pcFramePts.some(p => p[k] != null))) {
          const defs = [
            ['_frameDisplayChangeMs', '上屏间隔', 'ms'],
            ['_frameUntilDisplayedMs', 'Present→上屏延迟', 'ms'],
            ['_framePresentApiMs', 'Present 调用耗时', 'ms'],
            ['_frameRenderLatencyMs', '渲染完成延迟', 'ms'],
            ['_frameAppStartGapMs', '帧起点间距', 'ms'],
          ];
          for (const [k, label, unit] of defs) {
            const vals = _pcFramePts.map(p => p[k]).filter(v => v != null);
            const st2 = calcStats(vals);
            rows.push({ metric: label, raw: label, unit: unit, mean: st2.mean, max: st2.max, p98: st2.p98,
              sub: 'PresentMon ' + unit + '，1s 窗口均值' });
          }
        }
        return rows;
      }

      /**
       * 统计表去重：报告里有些指标彼此是派生/同源关系，全部平铺会显得重复。
       *   1) Jank/10min 四行 → 并入对应 Jank 行作为副标注（数值不丢，行数减半）
       *   2) GPU 温度与「温度」同源同值时只保留「温度」一行（GPU 图表照常画）
       *   3) 兜底：同名指标行只留第一条
       */
      function dedupeStatRows(rows) {
        const MERGE = {
          'Jank/10min': 'Jank', 'BigJank/10min': 'BigJank',
          'SmallJank/10min': 'SmallJank', 'TinyJank/10min': 'TinyJank',
        };
        const keyOf = (r) => r.raw || r.metric;
        const sameNums = (a, b) => ['mean', 'max', 'p98'].every(f => a[f] === b[f]);

        const first = new Map();
        const out = [];
        for (const r of rows) {
          const k = keyOf(r);
          if (!first.has(k)) first.set(k, r);
        }
        for (const r of rows) {
          const k = keyOf(r);
          if (first.get(k) !== r) continue;              // 同名重复行
          const hostKey = MERGE[k];
          if (hostKey) {                                  // 派生行并入宿主
            const host = first.get(hostKey);
            if (host && host !== r) {
              // 10min 计数本身没有独立单位，副标注要写清口径
              const is10 = /\/\s*10min/.test(k);
              const sub = fmtStat(r.mean) + (is10 ? ' 次/10min' : (r.unit ? ' ' + r.unit : ''));
              host.sub = host.sub ? host.sub + ' · ' + sub : sub;
              continue;
            }
          }
          out.push(r);
        }
        const gpuT = out.find(r => keyOf(r) === 'GPU 温度');
        const temp = out.find(r => keyOf(r) === '温度');
        if (gpuT && temp && sameNums(gpuT, temp)) out.splice(out.indexOf(gpuT), 1);
        return out;
      }

    function isMainMetric(r) {
      if (r.dynamic) return false;
      return MAIN_METRICS.has(r.raw || r.metric);
    }

    function renderTable(tableId, rows) {
      const tb = document.querySelector(`#${tableId} tbody`);
      if (!tb) return;

      const _miAttr = (r) => (window.MetricInfo ? MetricInfo.attr(r.raw || r.metric) : '');
      const cell = (r) =>
        `<tr><td${_miAttr(r)}>${r.metric}${r.unit ? `<span class="metric-unit">${r.unit}</span>` : ''}` +
        `${r.sub ? `<span class="metric-sub">${r.sub}</span>` : ''}</td>` +
        `<td>${fmtStat(r.mean)}</td><td>${fmtStat(r.max)}</td><td>${fmtStat(r.p98)}</td></tr>`;

      const main = rows.filter(isMainMetric);
      const detail = rows.filter(r => !isMainMetric(r));

      // 主表按 MAIN_METRICS 的语义顺序排：CPU → 内存 → 帧率 → 网络 → GPU/温度 → 功耗
      const ORDER = ['系统CPU', '进程CPU', 'FPS', 'FPS(全程)', '达帧率', '均帧', '帧耗时标准差', '帧耗时方差', '低帧占比', '1%Low', 'Drop',
        'FPS≥目标', '稳帧范围', '帧率标准差', '卡顿时长占比',
        'Jank', 'BigJank', 'SmallJank', 'TinyJank', 'Jank/10min', 'BigJank/10min', 'SmallJank/10min', 'TinyJank/10min',
        'PSS', '物理内存', 'RSS', '上下文切换',
        '下行', '上行', 'GPU', 'GPU 温度', '温度', '读 KB/s', '写 KB/s'];
      main.sort((a, b) => {
        const ia = ORDER.indexOf(a.raw || a.metric), ib = ORDER.indexOf(b.raw || b.metric);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });

      let html = main.map(cell).join('');
      if (detail.length) {
        html += `<tr class="stats-toggle"><td colspan="4">` +
          `<button type="button" data-detail-toggle="${tableId}">▾ 展开明细 ${detail.length} 项（内存分项 / 各核心）</button>` +
          `</td></tr>`;
        html += detail.map(r => cell(r).replace('<tr>', '<tr class="stats-detail-row" hidden>')).join('');
      }
      tb.innerHTML = html;
      if (window.MetricInfo) MetricInfo.decorate(tb);
    }

    // 明细折叠：事件委托，一次绑定
    document.addEventListener('click', (e) => {
      const btn = e.target.closest && e.target.closest('[data-detail-toggle]');
      if (!btn) return;
      const tb = document.querySelector(`#${btn.getAttribute('data-detail-toggle')} tbody`);
      if (!tb) return;
      const rows = tb.querySelectorAll('.stats-detail-row');
      const willShow = rows.length && rows[0].hidden;
      rows.forEach(tr => { tr.hidden = !willShow; });
      btn.textContent = willShow
        ? `▴ 收起明细（${rows.length} 项）`
        : `▾ 展开明细 ${rows.length} 项（内存分项 / 各核心）`;
    });

    function tableText(tableId) {
      const rows = [];
      const t = document.getElementById(tableId);
      if (!t) return '';
      const tr = t.querySelectorAll('tr');
      tr.forEach(row => {
        const cols = Array.from(row.querySelectorAll('th,td')).map(c => (c.textContent || '').trim());
        rows.push(cols.join('\t'));
      });
      return rows.join('\n');
    }

    async function copyTable(tableId) {
      const text = tableText(tableId);
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        window.prompt('复制下面内容：', text);
      }
    }

    function zoomToRangeIdx(fromIdx, toIdx) {
      const charts = Object.values(chartMgr._charts || {});
      const a = Math.max(0, Math.min(fromIdx, toIdx));
      const b = Math.max(0, Math.max(fromIdx, toIdx));
      const firstName = Object.keys(CHART_CONFIGS)[0];
      const times = chartMgr._data[firstName]?.times || [];
      const n = times.length;
      // 用百分比而不是分类值定位：渲染视图可能已抽稀，框选/像素换算出来的下标
      // 不一定落在抽样点上，按分类值匹配会失败（表现为缩放点了没反应）。
      // 百分比只依赖「第几个点 / 总点数」，与抽稀无关。
      const pct = (i) => (n > 1 ? (Math.max(0, Math.min(n - 1, i)) / (n - 1)) * 100 : 0);
      const sPct = pct(a);
      const ePct = Math.max(pct(b), sPct);
      charts.forEach(ch => {
        // Prefer setOption to guarantee both inside/slider zoom sync.
        try {
          ch.setOption(
            {
              dataZoom: [
                { start: sPct, end: ePct },
                { start: sPct, end: ePct },
              ],
            },
            { notMerge: false }
          );
        } catch (_) {
          try { ch.dispatchAction({ type: 'dataZoom', start: sPct, end: ePct }); } catch (_) {}
        }
      });
    }

    function resetZoomFull() {
      const charts = Object.values(chartMgr._charts || {});
      charts.forEach(ch => {
        try {
          ch.setOption(
            {
              dataZoom: [
                { start: 0, end: 100 },
                { start: 0, end: 100 },
              ],
            },
            { notMerge: false }
          );
        } catch (_) {
          try { ch.dispatchAction({ type: 'dataZoom', start: 0, end: 100 }); } catch (_) {}
        }
      });
    }

    function renderStats() {
      // global
      renderTable('tbl-global', buildTableRows(null));
      // selected
      if (selection) {
        const firstName = Object.keys(CHART_CONFIGS)[0];
        const state = chartMgr._data[firstName];
        const times = state?.times || [];
        const fromIdx = Math.max(0, Math.min(selection.fromIdx, selection.toIdx));
        const toIdx = Math.max(0, Math.max(selection.fromIdx, selection.toIdx));
        renderTable('tbl-selected', buildTableRows({ fromIdx, toIdx }));
        const tbl = document.getElementById('tbl-selected');

        if (evt && ('startValue' in evt || 'endValue' in evt)) {

        if ((a == null || b == null) && evt && typeof evt.start === 'number' && typeof evt.end === 'number' && times.length) {
