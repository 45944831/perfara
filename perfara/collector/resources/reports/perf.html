<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfara离线版 · 性能报告</title>
  <!-- echarts：优先用同目录本地文件（离线可用），缺失时回退 CDN；都失败则用空实现兜底，保证表格照常渲染 -->
  <script src="echarts.min.js"></script>
  <script>
    if (typeof echarts === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"><\/script>');
    }
  </script>
  <script>
    if (typeof echarts === 'undefined') {
      window.echarts = {
        init: function () {
          return {
            setOption: function () {}, resize: function () {}, dispose: function () {},
            on: function () {}, off: function () {}, getDom: function () { return null; },
            getZr: function () { return { on: function () {} }; }
          };
        },
        connect: function () {},
        registerTheme: function () {}
      };
      console.warn('[perf] echarts 未加载：图表区域留空，数据表照常显示');
    }
  </script>
  <style>
/* ===== Inlined from html-template2/style.css (keep visual identical) ===== */
/* ═══ Reset & Base ══════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f1117;
  --bg2: #161922;
  --bg3: #1e2230;
  --border: #2a2f3d;
  --text: #e0e4ef;
  --text2: #8a90a0;
  --accent: #4f8ef7;
  --green: #3ecf8e;
  --red: #f85151;
  --orange: #f5a623;
  --yellow: #f5d020;
  --radius: 8px;
  --font: 'Segoe UI', system-ui, sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* Ensure inner app participates in flex for scroll */
#root{
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

/* ═══ Scrollbar ═════════════════════════════════════════════════════════════ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ═══ Top Bar ═══════════════════════════════════════════════════════════════ */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 8px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.logo-icon {
  font-size: 16px;
  color: var(--accent);
}

.topbar-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  flex-wrap: wrap;
}

.control-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.control-group label {
  color: var(--text2);
  white-space: nowrap;
  font-size: 12px;
}

.control-text {
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

select, input[type="text"] {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 12px;
  outline: none;
}

select { cursor: pointer; min-width: 180px; }
input[type="text"] { width: 160px; }

.sel-app-select {
  min-width: 220px;
  width: min(320px, 36vw);
}

select:focus, input:focus { border-color: var(--accent); }

.topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
  white-space: nowrap;
}

.elapsed {
  color: var(--text2);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  min-width: 60px;
}

/* ═══ Buttons ═══════════════════════════════════════════════════════════════ */
.btn {
  border: none;
  border-radius: 4px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, background 0.15s;
  white-space: nowrap;
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:not(:disabled):hover { opacity: 0.85; }
.btn-sm  { padding: 4px 8px; background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-danger  { background: var(--red); color: #fff; }
.btn-export  { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }

/* ═══ Badge ═════════════════════════════════════════════════════════════════ */
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}
.badge.idle     { background: var(--bg3); color: var(--text2); }
.badge.info     { background: var(--accent); color: #fff; }

/* 设备信息条 */
.device-info-strip {
  padding: 6px 16px;
  font-size: 12px;
  line-height: 1.45;
  color: var(--text2);
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.device-info-strip[hidden] { display: none !important; }
.device-info-strip-inner {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.device-info-text { flex: 1; min-width: 0; }

/* ═══ Stat Cards ════════════════════════════════════════════════════════════ */
.cards {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 6px 16px;
  flex-shrink: 0;
}
.card {
  flex: 1 1 90px;
  min-width: 90px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: border-color 0.2s;
}
.card-label { font-size: 11px; color: var(--text2); }
.card-value {
  font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1;
  color: var(--card-color, var(--text));
}
.card-unit  { font-size: 10px; color: var(--text2); }

/* Card color states (android cards ids) */
#card-cpu     { --card-color: #4f8ef7; }
#card-proccpu { --card-color: #79d4f7; }
#card-mem     { --card-color: #3ecf8e; }
#card-fps     { --card-color: #f5d020; }
#card-jank    { --card-color: #f5a623; }
#card-bigjank { --card-color: #f85151; }
#card-net     { --card-color: #c77dff; }
#card-gpu     { --card-color: #f5a623; }
#card-battery { --card-color: #3ecf8e; }
#card-temp    { --card-color: #f85151; }

/* 阈值着色：JS 在 card 上写 --card-color（内联优先级高于上面的 id 规则） */
.card[data-state="good"] { border-color: rgba(62,207,142,.38); }
.card[data-state="warn"] { border-color: rgba(245,166,35,.40); }
.card[data-state="bad"]  { border-color: rgba(248,81,81,.45); }

/* ═══ Charts Grid ═══════════════════════════════════════════════════════════ */
.charts-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 0 16px 8px;
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}
.chart-wrap {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  position: relative;
  height: 230px;
}
.chart-title {
  padding: 6px 12px 0;
  font-size: 11px;
  color: var(--text2);
  font-weight: 600;
  flex-shrink: 0;
}
.chart { flex: 1; min-height: 0; }
/* 该指标本次无数据时的提示（如机型不提供 GPU 使用率） */
.chart-empty-tip {
  position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%);
  font-size: 12px; line-height: 1.5; color: var(--text2);
  background: rgba(10, 14, 22, 0.72); border: 1px solid var(--border);
  padding: 6px 12px; border-radius: 8px; pointer-events: none; z-index: 5;
  white-space: nowrap;
}

/* Stats tables */
.stats-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding: 8px 12px 0;
  flex-shrink:0;
}
.stats-head .chart-title{ padding:0; }
.stats-actions{ display:flex; gap:8px; align-items:center; }
.stats-body{ padding: 8px 12px 12px; overflow:auto; }
.stats-table{
  width:100%;
  border-collapse: collapse;
  font-size: 12px;
}
.stats-table th, .stats-table td{
  border-bottom: 1px solid var(--border);
  padding: 6px 8px;
  text-align:left;
}
.stats-table th{
  color: var(--text2);
  font-weight: 600;
}
.stats-table td:nth-child(n+2), .stats-table th:nth-child(n+2){
  text-align:right;
  font-variant-numeric: tabular-nums;
}
.chart-wrap.stats{
  height: auto;
}

/* Hide log panel in static report (keep layout clean) */
.log-panel { display:none !important; }

/* hidden 属性优先于 flex/grid 布局（否则 .chart-wrap 的 display:flex 会盖掉它） */
[hidden] { display: none !important; }

/* 顶部「测试类型 / 包名」在概要条里已有，去掉重复信息 */
.topbar-controls .control-group:not(.btns) { display: none; }

/* Static: disable selectors while keeping appearance */
select[disabled] { opacity: 0.85; cursor: default; }
  
/* ═══ 解读总结 ══════════════════════════════════════════════════════════════ */
.insight {
  margin: 2px 16px 10px;
  padding: 12px 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  flex-shrink: 0;
}
.insight-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 8px;
}
.insight-title { font-size: 13px; font-weight: 600; letter-spacing: .3px; }
.insight-sub { font-size: 11px; color: var(--text2); margin-left: auto; font-variant-numeric: tabular-nums; }
.insight-badge {
  font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 10px;
  border: 1px solid transparent; white-space: nowrap;
}
.insight-badge--great { color: var(--green);  border-color: #2a6b4f; background: rgba(62,207,142,.10); }
.insight-badge--good  { color: var(--accent); border-color: #2f4d7a; background: rgba(79,142,247,.10); }
.insight-badge--warn  { color: var(--orange); border-color: #6b4d1f; background: rgba(245,166,35,.10); }
.insight-badge--bad   { color: var(--red);    border-color: #6b2a2a; background: rgba(248,81,81,.10); }
.insight-lead { font-size: 12.5px; line-height: 1.75; color: var(--text); margin-bottom: 9px; }
.insight-lead b { font-weight: 600; }
.insight-list {
  list-style: none;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 3px 20px;
}
.insight-list li { font-size: 12px; line-height: 1.7; color: var(--text2); }
.insight-list li b { color: var(--text); font-weight: 500; margin-right: 6px; }
.insight-note--good { color: var(--green); }
.insight-note--warn { color: var(--orange); }
.insight-note--bad  { color: var(--red); }
.insight-note--info { color: var(--text2); }
.insight-risks {
  margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--border);
  display: flex; flex-direction: column; gap: 4px;
}
.insight-risk { font-size: 12px; line-height: 1.6; }
.insight-risk--high { color: var(--red); }
.insight-risk--mid  { color: var(--orange); }
.insight-risk--info { color: var(--text2); }

/* ═══ 报告概要条（设备 / 应用 / 平台 / 采样 / 时间） ═══════════════════════ */
.report-meta {
  display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
  width: 100%;
}
.rm-main { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex-wrap: wrap; }
.rm-device { font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: .2px; }
.rm-app {
  font-size: 12px; color: var(--text2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46vw;
}
.rm-chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.rm-chip {
  font-size: 11px; line-height: 18px; color: var(--text);
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 5px; padding: 1px 8px; font-variant-numeric: tabular-nums;
}
.rm-chip i { font-style: normal; color: var(--text2); margin-right: 5px; }
.rm-chip--plat { border-color: #2f4d7a; color: var(--accent); }
.rm-sub {
  width: 100%; margin-top: 2px;
  font-size: 11px; color: var(--text2); line-height: 1.5;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ═══ 分区标题 ══════════════════════════════════════════════════════════════ */
.section-label {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px 4px; flex-shrink: 0;
  font-size: 12px; font-weight: 600; color: var(--text); letter-spacing: .3px;
}
.section-label .hint { font-weight: 400; font-size: 11px; color: var(--text2); }
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ═══ 统计表：单位后缀 + 明细折叠 ══════════════════════════════════════════ */
.metric-unit {
  margin-left: 5px; font-size: 10px; color: var(--text2); font-weight: 400;
}
.stats-toggle td { padding: 4px 8px 6px; border-bottom: none; }
.stats-toggle button {
  width: 100%; text-align: left;
  background: transparent; border: 1px dashed var(--border); border-radius: 6px;
  color: var(--text2); font-size: 11px; font-family: inherit;
  padding: 4px 9px; cursor: pointer;
  transition: color .15s, border-color .15s;
}
.stats-toggle button:hover { color: var(--accent); border-color: var(--accent); }
.stats-detail-row td { color: var(--text2); background: rgba(255,255,255,.012); }
.stats-detail-row td:first-child { padding-left: 18px; }


/* ═══ 参数说明「!」标记（(__METRIC_INFO_V1__)) ═══════════════════════════════ */
.info-dot {
  display: inline-flex; align-items: center; justify-content: center;
  width: 13px; height: 13px; margin-left: 4px; flex: none;
  border: 1px solid var(--border); border-radius: 50%;
  background: var(--bg3); color: var(--text2);
  font: 700 9px/1 var(--font); font-style: normal;
  vertical-align: middle; cursor: help; opacity: .55;
  transition: opacity .15s ease, color .15s ease, border-color .15s ease;
  user-select: none; -webkit-user-select: none;
}
.info-dot:hover, .info-dot:focus {
  opacity: 1; color: var(--accent); border-color: var(--accent); outline: none;
}
.kpi-label .info-dot, .card-label .info-dot { width: 12px; height: 12px; margin-left: 3px; }
.kpis-extra .info-dot { width: 11px; height: 11px; }
.mi-mask {
  position: fixed; inset: 0; z-index: 9999; padding: 20px;
  background: rgba(0, 0, 0, .55);
  display: flex; align-items: center; justify-content: center;
}
.mi-mask[hidden] { display: none; }
.mi-modal {
  width: 100%; max-width: 560px; max-height: 82vh; overflow: auto;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: 0 14px 44px rgba(0, 0, 0, .5);
  animation: mi-pop .16s ease-out;
}
@keyframes mi-pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.mi-head {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px; border-bottom: 1px solid var(--border);
}
.mi-title { flex: 1; font-size: 14px; font-weight: 600; color: var(--text); }
.mi-unit { margin-left: 6px; font-size: 11px; font-weight: 400; color: var(--text2); }
.mi-close {
  border: none; background: transparent; color: var(--text2);
  font-size: 14px; line-height: 1; padding: 3px 6px; border-radius: 4px; cursor: pointer;
}
.mi-close:hover { color: var(--text); background: var(--bg3); }
.mi-body { padding: 12px 14px 14px; }
.mi-row { margin-bottom: 10px; }
.mi-row:last-child { margin-bottom: 0; }
.mi-row > i {
  display: block; margin-bottom: 3px;
  font-size: 11px; font-style: normal; font-weight: 600; color: var(--accent);
}
.mi-row > p { font-size: 12px; line-height: 1.8; color: var(--text2); }
/* ═══ 可读性优化 __READABILITY_V1__ begin ══════════════════════════════ */
:root {
  /* 次要文字整体提亮：标签 / 单位 / 说明文字更容易看清（对比度约 5.9:1） */
  --text2: #9ba3b4;
}

/* ── 分区标题：主色竖条 + 更大字号，层级更清楚 ────────────────────────── */
.section-label { font-size: 12.5px; padding: 10px 16px 5px; }
.section-label::before {
  content: ''; display: inline-block; flex: none;
  width: 3px; height: 13px; border-radius: 2px; background: var(--accent);
}

/* ── 顶部概要条 ────────────────────────────────────────────────────────── */
.rm-device { font-size: 15px; }
.rm-app { font-size: 12.5px; }
.rm-chip { font-size: 11.5px; line-height: 19px; }
.rm-sub { white-space: normal; line-height: 1.55; }

/* ── 指标卡：等宽网格 + 字号层次 + 悬停反馈 ───────────────────────────── */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(106px, 1fr));
  gap: 8px;
  padding: 8px 16px 10px;
}
.card { padding: 12px 10px; gap: 4px; }
.card:hover { border-color: #3b4354; }
.card-label { font-size: 12px; font-weight: 500; }
.card-value { font-size: 24px; letter-spacing: -.2px; }
.card-unit  { font-size: 11px; }

/* ── 图表：标题更醒目、图区更舒展 ─────────────────────────────────────── */
.charts-grid { gap: 12px; padding: 0 16px 12px; }
.chart-wrap { height: 250px; }
.chart-wrap:hover { border-color: #333a4a; }
.chart-wrap.stats { height: auto; }          /* 统计表保持自适应高度 */
.chart-title { padding: 9px 12px 0; font-size: 12.5px; color: var(--text); letter-spacing: .2px; }

/* ── 统计表：表头吸顶 + 斑马纹 + 行悬停 ───────────────────────────────── */
.stats-head { padding-top: 10px; }
/* 让统计表跟随主滚动条滚动（stats-body 不再自成滚动容器），表头才能相对图表区吸顶 */
.chart-wrap.stats .stats-body { padding: 6px 12px 12px; overflow: visible; }
.stats-table { font-size: 12.5px; }
.stats-table thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--bg2); font-size: 12px;
  box-shadow: inset 0 -1px 0 var(--border);
}
.stats-table th, .stats-table td { padding: 7px 8px; }
.stats-table tbody tr:nth-child(even) td { background: rgba(255,255,255,.022); }
.stats-table tbody tr:hover td { background: rgba(79,142,247,.10); }
.stats-detail-row td { background: rgba(255,255,255,.022); }
.metric-unit { font-size: 11px; }
/* 派生指标的副标注（例：Jank 行上的「32.4 次/10min」） */
.metric-sub {
  display: block; margin-top: 2px;
  font-size: 10.5px; color: var(--text2); opacity: .85;
}
.stats-toggle button { font-size: 11.5px; padding: 5px 9px; }

/* ── 解读总结：风险项色条化，便于纵向扫读 ─────────────────────────────── */
.insight { padding: 14px 16px; margin: 4px 16px 12px; }
.insight-head { margin-bottom: 10px; }
.insight-title { font-size: 13.5px; }
.insight-lead { font-size: 13px; line-height: 1.8; margin-bottom: 11px; }
.insight-list { gap: 4px 26px; }
.insight-list li { font-size: 12.5px; line-height: 1.85; }
.insight-risks { margin-top: 12px; padding-top: 11px; gap: 6px; }
.insight-risk {
  line-height: 1.75; padding: 4px 10px;
  border-left: 2px solid currentColor; border-radius: 0 4px 4px 0;
  background: rgba(255,255,255,.032);
}
/* ═══ 可读性优化 __READABILITY_V1__ end ════════════════════════════════ */
/* ═══ 整页滚动 __SCROLL_V1__ begin ══════════════════════════════════════
   原来 body 锁定 100vh + overflow:hidden，只有 .charts-grid 内部可滚，
   鼠标悬在指标卡 / 解读总结上滚轮无效。改为整页自然滚动，顶栏吸顶。 */
html, body { height: auto; min-height: 100vh; overflow: visible; }
body { overflow-x: hidden; }
.charts-grid { flex: none; overflow: visible; }
.topbar { position: sticky; top: 0; z-index: 30; }
/* 统计表表头改为相对整页吸顶（topbar 高度 ≈ 37px） */
.stats-table thead th { top: 37px; }

    'cpuLimit': 'cpulimit', 'gpuTemp': 'gputemp', 'fpsTarget': 'fpsTarget',
    'cpu': 'proccpu', 'syscpu': 'syscpu', 'disk': 'disk', 'bandwidth': 'gpu_bw',
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function keyOf(name) {
    if (!name) return '';
    var k = ALIAS[String(name).trim()];
    if (k) return k;
    if (INFO[String(name).trim()]) return String(name).trim();
    return '';
  }

  /** 给带 data-info 的容器补上「!」标记（幂等，可重复调用） */
  function decorate(root) {
    var scope = root && root.querySelectorAll ? root : document;
    var host = (scope === document || !scope.querySelectorAll) ? scope : scope;
    var list = host.querySelectorAll('[data-info]');
    for (var i = 0; i < list.length; i++) {
      var el = list[i];
      if (el.getAttribute('data-info') === '') continue;
      if (el.querySelector('.info-dot')) continue;
      if (el.tagName === 'TBODY' || el.tagName === 'TABLE') continue;
      var key = keyOf(el.getAttribute('data-info'));
      if (!key || !INFO[key]) continue;
      var dot = document.createElement('span');
      dot.className = 'info-dot';
      dot.setAttribute('data-info', key);
      dot.setAttribute('role', 'button');
      dot.setAttribute('tabindex', '0');
      dot.title = '查看参数说明';
      dot.textContent = '!';
      el.appendChild(dot);
    }
  }

  /** 把某个指标名改成「!」标记的属性串，供 innerHTML 拼接使用 */
  function attr(name) {
    var k = keyOf(name);
    return k ? ' data-info="' + esc(k) + '"' : '';
  }

  var mask = null;
  function ensureModal() {
    if (mask) return mask;
    mask = document.createElement('div');
    mask.className = 'mi-mask';
    mask.hidden = true;
    mask.innerHTML =
      '<div class="mi-modal" role="dialog" aria-modal="true">' +
        '<div class="mi-head"><span class="mi-title"></span>' +
        '<button type="button" class="mi-close" aria-label="关闭">✕</button></div>' +
        '<div class="mi-body"></div>' +
      '</div>';
    document.body.appendChild(mask);
    mask.addEventListener('click', function (e) {
      if (e.target === mask || (e.target.closest && e.target.closest('.mi-close'))) hide();
    });
    return mask;
  }

  function row(label, text) {
    return text ? '<div class="mi-row"><i>' + esc(label) + '</i><p>' + esc(text) + '</p></div>' : '';
  }

  function show(key) {
    var info = INFO[key];
    if (!info) return;
    var box = ensureModal();
    box.querySelector('.mi-title').innerHTML = esc(info.t) + (info.u ? '<span class="mi-unit">' + esc(info.u) + '</span>' : '');
    box.querySelector('.mi-body').innerHTML =
      row('是什么', info.d) + row('来源与算法', info.h) + row('怎么看', info.g);
    box.hidden = false;
  }

  function hide() { if (mask) mask.hidden = true; }

  window.MetricInfo = {
    version: '__METRIC_INFO_V1__',
    has: function (k) { return !!INFO[k]; },
    keyOf: keyOf,
    attr: attr,
    decorate: decorate,
    open: show,
    close: hide,
  };

  // 点击「!」弹说明：捕获阶段处理，避免触发报告卡片本身的点击（如勾选、展开）
  document.addEventListener('click', function (e) {
    var dot = e.target && e.target.closest ? e.target.closest('.info-dot') : null;
    if (!dot) return;
    e.preventDefault();
    e.stopPropagation();
    show(dot.getAttribute('data-info'));
  }, true);
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Escape' || e.key === 'Esc') && mask && !mask.hidden) hide();
    if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.classList && e.target.classList.contains('info-dot')) {
      e.preventDefault(); e.stopPropagation();
      show(e.target.getAttribute('data-info'));
    }
  }, true);
})();
</script>

`;

  // --- unit conversion rules (per your spec) ---
  const KB = 1024;
  const MB_BYTES = 1024 * 1024;
  /**
   * 内存单位自适应。
   * 本地采集器写入的 totalPss 已经是 MB（见 adb.js: parseInt(KB)/1024）；
   * 早期服务端上报的数据是 KB。以整份报告的最大 totalPss 判断：
   * 真实应用 PSS 用 KB 表示时必然远大于 10000，用 MB 表示时通常远小于该值。
   */
  let _MEM_DIV = null;
  function memDivisor() {
    if (_MEM_DIV != null) return _MEM_DIV;
    const rows = (typeof data !== 'undefined' && data && Array.isArray(data.perf)) ? data.perf : [];
    let mx = 0;
    for (const r of rows) {
      const v = r && r.mem && r.mem.totalPss;
      if (typeof v === 'number' && v > mx) mx = v;
    }
    _MEM_DIV = mx > 10000 ? KB : 1;
    return _MEM_DIV;
  }
  function a_mem(v){ return (typeof v === 'number' && !isNaN(v)) ? (v / memDivisor()) : null; }
  function a_temp(v){ if(typeof v!=='number'||isNaN(v)) return null; if(v>=200&&v<=900&&Number.isInteger(v)) return v/10; return v; }
  /** 整机温度：优先采集到的 thermal 值；为 0/缺失时回退电池温度（老数据也能出值） */
  function pickTemp(thermalRaw, batteryRaw){
    const t = a_temp(thermalRaw);
    if (t != null && t > 0) return t;
    const b = a_temp(batteryRaw);
    return (b != null && b > 0) ? b : t;
  }
  function a_ua_to_ma(v){ return (typeof v === 'number' && !isNaN(v)) ? (v / 1000) : null; }
  function a_freq(v){ if(typeof v!=='number'||isNaN(v)) return null; return v>=10000 ? v/1000 : v; }

  function i_mem(v){ return (typeof v === 'number' && !isNaN(v)) ? (v / MB_BYTES) : null; }

  function isBandwidthKey(k){ return /Bandwidth/i.test(k || ''); }
  function isPartialRendersKey(k){ return /Partial Renders/i.test(k || ''); }
  function g_bw(v){
    if(typeof v!=='number'||isNaN(v)) return null;
    if(v>50000) return v/KB/KB;
    if(v>500) return v/KB;
    return v;
  }
  function g_ratio(v){
    if(typeof v!=='number'||isNaN(v)) return null;
    if(v>=0 && v<=1.5) return v*100;
    return v;
  }
  function g_time_ms(raw, idx){
    if(raw==null) return NaN;
    const n = (typeof raw==='number') ? raw : Date.parse(String(raw));
    if(isNaN(n)) return NaN;
    if(Number.isInteger(n)) return n + idx * 1e-3;
    return n;
  }

  // --- charts.js: minimal ChartManager (keeps same look/behavior for charts) ---
  const COLORS = {
    cpu:       ['#4f8ef7', '#79d4f7'],
    mem:       ['#3ecf8e'],
    memDetail: ['#3ecf8e', '#4f8ef7', '#f5d020', '#c77dff', '#f5a623', '#ff79a8', '#79d4f7'],
    fps:       ['#f5d020', '#f5a623', '#f85151'],
    net:       ['#c77dff', '#ff79a8'],
    gpu:       ['#f5a623'],
    temp:      ['#f85151'],
    current:   ['#79d4f7'],
    power:     ['#f5a623'],
    cpuCores:  ['#4f8ef7','#79d4f7','#3ecf8e','#a8e6cf','#f5a623','#f5d020','#f85151','#c77dff',
               '#ff79a8','#b5e853','#53e8e8','#ffa552','#e87bff','#5effd6','#ff5e5e','#b0b8ff'],
    cpuFreq:   ['#4f8ef7','#79d4f7','#3ecf8e','#a8e6cf','#f5a623','#f5d020','#f85151','#c77dff',
               '#ff79a8','#b5e853','#53e8e8','#ffa552','#e87bff','#5effd6','#ff5e5e','#b0b8ff'],
  };

  const CHART_CONFIGS = {};

  /**
   * GPU 图配置：优先画利用率；机型读不到利用率（MTK 非 root 常见）但能读到 GPU 温度时，
   * 改用温度补位，避免整块图表空白。标题与卡片由 annotateMetricCards 同步改写。
   */
  function gpuChartCfg() {
    const rows = (typeof data !== 'undefined' && data && Array.isArray(data.perf)) ? data.perf : [];
    const hasUtil = rows.some(r => typeof r.gpu === 'number' && r.gpu > 0);
    const hasTemp = rows.some(r => typeof r.gpuTemp === 'number' && r.gpuTemp > 0);
    if (!hasUtil && hasTemp) {
      return { el: 'chart-gpu', series: [{ name: 'GPU 温度', key: d => d.gpuTemp }], type: 'line', yMax: null, fmt: v => v + '\u00b0C' };
    }
    return { el: 'chart-gpu', series: [{ name: 'GPU', key: d => d.gpu }], type: 'line', yMax: 100, fmt: v => v + '%' };
  }

  class ChartManager {
    constructor() { this._charts = {}; this._data = {}; this._ready = false; this._onReadyCbs = []; }
    onReady(cb) {
      if (typeof cb !== 'function') return;
      if (this._ready) { try { cb(); } catch (_) {} return; }
      this._onReadyCbs.push(cb);
    }
    init() { requestAnimationFrame(() => setTimeout(() => this._doInit(), 120)); }
    _doInit() {
      for (const [name, cfg] of Object.entries(CHART_CONFIGS)) {
        const el = document.getElementById(cfg.el);
        if (!el) continue;
        const chart = echarts.init(el, 'dark');
        this._charts[name] = chart;
        this._data[name] = { times: [], series: (cfg.series || []).map(() => []) };
        if (!cfg.dynamic) chart.setOption(this._buildOption(name, cfg));
      }
      this._ready = true;
      const ro = new ResizeObserver(() => { for (const c of Object.values(this._charts)) c.resize(); });
      const grid = document.querySelector('.charts-grid');
      if (grid) ro.observe(grid);
      window.addEventListener('resize', () => { for (const c of Object.values(this._charts)) c.resize(); });
      // flush queued updates that arrived before init
      if (this._queued && this._queued.length) {
        const q = this._queued.slice();
        this._queued.length = 0;
        for (const d of q) this.update(d);
      }
      // notify ready callbacks
      if (this._onReadyCbs && this._onReadyCbs.length) {
        const cbs = this._onReadyCbs.slice();
        this._onReadyCbs.length = 0;
        for (const cb of cbs) {
          try { cb(); } catch (e) { console.error('[chartMgr] onReady 回调执行失败:', e && e.stack || e); }
        }
      }
    }
    update(d) {
      if (!this._ready) {
        if (!this._queued) this._queued = [];
        this._queued.push(d);
        return;
      }
      for (const [name, cfg] of Object.entries(CHART_CONFIGS)) {
        try { this._updateOne(name, cfg, d); } catch (_) {}
      }
    }
    _updateOne(name, cfg, d) {
      const state = this._data[name];
      const chart = this._charts[name];
      if (!state || !chart) return;
      if (cfg.dynamic) {
        const vals = (cfg.keyFn(d) || []);
        const count = vals.length;
        if (count === 0) return;
        if (state.series.length !== count) {
          cfg.series = Array.from({ length: count }, (_, i) => ({ name: `Core ${i}` }));
          state.times = [];
          state.series = Array.from({ length: count }, () => []);
          chart.setOption(this._buildLineOption(name, cfg), true);
        }
        state.times.push(d.time);
        vals.forEach((v, i) => state.series[i].push((v == null || isNaN(+v)) ? null : +v));
        chart.setOption({ xAxis: [{ data: state.times }], series: state.series.map(s => ({ data: s })) });
        return;
      }
      state.times.push(d.time);
      cfg.series.forEach((s, i) => {
        const v = s.key(d);
        state.series[i].push((v == null || isNaN(+v)) ? null : +v);
      });
      chart.setOption({ xAxis: [{ data: state.times }], series: cfg.series.map((_, i) => ({ data: state.series[i] })) });
    }
    _buildLineOption(name, cfg) {
      const colors = COLORS[name] || COLORS.cpu;
      return {
        color: colors,
        tooltip: { trigger: 'axis' },
        legend: { top: 0, textStyle: { color: '#bcd3ff' } },
        grid: { left: 44, right: 16, top: 32, bottom: 28 },
        xAxis: [{ type: 'category', data: [], axisLabel: { color: '#96a8c8' } }],
        yAxis: [{ type: 'value', max: null, axisLabel: { color: '#96a8c8' } }],
        dataZoom: [
          { type: 'inside', xAxisIndex: 0, filterMode: 'none' },
          { type: 'slider', xAxisIndex: 0, height: 16, bottom: 4, showDetail: false },
        ],
        series: (cfg.series || []).map(s => ({ name: s.name, type: 'line', smooth: true, showSymbol: false, data: [] })),
      };
    }
    _buildMixedOption(name, cfg) {
      const colors = COLORS[name] || COLORS.fps;
      return {
        color: colors,
        tooltip: { trigger: 'axis' },
        legend: { top: 0, textStyle: { color: '#bcd3ff' } },
        grid: { left: 44, right: 16, top: 32, bottom: 28 },
        xAxis: [{ type: 'category', data: [], axisLabel: { color: '#96a8c8' } }],
        yAxis: [
          { type: 'value', max: null, axisLabel: { color: '#96a8c8' } },
          { type: 'value', max: null, axisLabel: { color: '#96a8c8' } },
        ],
        dataZoom: [
          { type: 'inside', xAxisIndex: 0, filterMode: 'none' },
          { type: 'slider', xAxisIndex: 0, height: 16, bottom: 4, showDetail: false },
        ],
        series: (cfg.series || []).map(s => ({
          name: s.name,
          type: s.type || 'line',
          yAxisIndex: s.yAxisIndex ?? 0,
          smooth: s.type === 'line',
          showSymbol: false,
          data: [],
        })),
      };
    }
    _buildOption(name, cfg) { return cfg.mixed ? this._buildMixedOption(name, cfg) : this._buildLineOption(name, cfg); }
  }

  function setText(id, text) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = (text == null || text === '') ? '--' : String(text);
  }

  function pickDeviceText(payload) {
    const d = payload.device || {};
    const parts = [];
    if (d.name) parts.push(`名称：${d.name}`);
    if (d.brand) parts.push(`品牌：${d.brand}`);
    if (d.model) parts.push(`型号：${d.model}`);
    if (d.osVersion) parts.push(`系统：${d.osVersion}`);
    if (d.bundleId) parts.push(`包名：${d.bundleId}`);
    if (d.appName) parts.push(`应用：${d.appName}`);
    return parts.filter(Boolean).join('   ');
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  function fmtDateTime(dt) {
    if (!(dt instanceof Date) || isNaN(dt.getTime())) return '';
    return `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}-${pad2(dt.getDate())} ${pad2(dt.getHours())}:${pad2(dt.getMinutes())}:${pad2(dt.getSeconds())}`;
  }

  function durText(sec) {
    if (sec == null) return '--';
    if (sec < 60) return sec + ' 秒';
    const m = Math.floor(sec / 60), s = sec % 60;
    return s ? `${m} 分 ${s} 秒` : `${m} 分钟`;
  }

  /** 报告起始时间：优先首条采样的 timestamp */
  function reportStartTime() {
    const rows = (typeof data !== 'undefined' && data && Array.isArray(data.perf)) ? data.perf : [];
    const t = rows[0] && rows[0].timestamp;
    if (typeof t === 'number') return new Date(t);
    const p = Date.parse(String(t || ''));
    return isNaN(p) ? null : new Date(p);
  }

  function reportDurationSec() {
    const rows = (typeof data !== 'undefined' && data && Array.isArray(data.perf)) ? data.perf : [];
    if (rows.length < 2) return null;
    const a = rows[0].timestamp, b = rows[rows.length - 1].timestamp;
    if (typeof a !== 'number' || typeof b !== 'number') return null;
    return Math.max(1, Math.round((b - a) / 1000));
  }

  /**
   * 顶部概要条：设备名 / 应用 / 平台 / 采样数 / 时长 / 开始时间。
   * 原来是一整行灰色小字（名称：… 品牌：… 包名：…），关键信息不突出。
   */
  function renderReportMeta(category) {
    const el = document.getElementById('device-info-text');
    if (!el) return;
    const d = (data && data.device) || {};
    const rows = (Array.isArray(data.perf)) ? data.perf : [];
    const n = rows.length;
    const durSec = reportDurationSec();
    const start = reportStartTime();

    const platName = category === 'android' ? 'Android'
      : category === 'ios' ? 'iOS'
      : category === 'ios_gpu' ? 'iOS GPU'

      : (category || '—');

    const chips = [];
    chips.push(`<span class="rm-chip rm-chip--plat"><i>平台</i>${escapeHtml(platName)}</span>`);
    if (n) chips.push(`<span class="rm-chip"><i>采样</i>${n} 点</span>`);
    if (durSec != null) chips.push(`<span class="rm-chip"><i>时长</i>${durText(durSec)}</span>`);
    if (start) chips.push(`<span class="rm-chip"><i>开始</i>${fmtDateTime(start)}</span>`);

    const subParts = [];
    if (d.brand) subParts.push('品牌 ' + d.brand);
    if (d.model && d.model !== d.name) subParts.push('型号 ' + d.model);
    if (d.osVersion) subParts.push('系统 ' + d.osVersion);
    if (d.deviceId) subParts.push('设备ID ' + d.deviceId);
    if (category === 'pc' && rows[0] && rows[0].pcExtra && rows[0].pcExtra.exe) {

    }

    el.innerHTML =
      '<div class="report-meta">' +
        '<div class="rm-main">' +
          '<span class="rm-device">' + escapeHtml(d.name || '未知设备') + '</span>' +
          '<span class="rm-app">' + escapeHtml(d.bundleId || d.appName || '—') + '</span>' +
        '</div>' +
        '<div class="rm-chips">' + chips.join('') + '</div>' +
        (subParts.length ? '<div class="rm-sub">' + escapeHtml(subParts.join('   ·   ')) + '</div>' : '') +
      '</div>';
  }

  function fmtN(v, digits) {
    if (typeof v !== 'number' || isNaN(v)) return '--';
    const m = Math.pow(10, digits);
    return String(Math.round(v * m) / m);
  }

  function mean(vals) {
    let s = 0;
    let n = 0;
    for (const v of vals || []) {
      if (typeof v === 'number' && !isNaN(v)) { s += v; n += 1; }
    }
    return n ? (s / n) : null;
  }

  function render() {
    if (typeof data === 'undefined' || !data) {
      document.getElementById('root').innerHTML = '<div class="device-info-strip"><div class="device-info-strip-inner"><span class="device-info-text">未找到全局变量 data。请确认同目录 data.js 内容为：var data = {...};</span></div></div>';

    if (category === 'ios') root.innerHTML = TPL_IOS;

    else if (category === 'pc') root.innerHTML = TPL_PC;

    const d = data.device || {};
    setText('hdr-type', category || '-');

    // patch chart configs for platform (matches html-template2/iphone.js & iphone_gpu.js)
    Object.keys(CHART_CONFIGS).forEach(k => delete CHART_CONFIGS[k]);
    if (category === 'ios') {

        cpu: { el:'chart-cpu', series:[

          { name:'物理内存', key:d=>d.physFootprint ?? null },

        ], type:'line', yMax:null, fmt:v=>v+' MB' },
        memdetail: { el:'chart-memdetail', series:[
          { name:'私有常驻', key:d=>d.memRPrvt ?? null },
          { name:'共享常驻', key:d=>d.memRShrd ?? null },
          { name:'匿名', key:d=>d.memAnon ?? null },
          { name:'压缩', key:d=>d.memCompressed ?? null },
          { name:'可清除', key:d=>d.memPurgeable ?? null },

    // ── 采集参数适配：被移除的指标不建图、不占位、不统计 ──────────────────────
    // data.metricConfig 为采集时保存的勾选项；缺失（旧报告）时全部启用
    const _mcNorm = (function () {
      const cfg = (data && typeof data.metricConfig === 'object' && data.metricConfig) || null;
      if (!cfg) return null;
      const out = {};
      for (const k of Object.keys(cfg)) out[k] = !!cfg[k];
      return out;
    })();
    const CHART_GROUP = {
      cpu: 'cpu', mem: 'mem', memDetail: 'mem', fps: 'fps', net: 'net',
      gpu: 'gpu', temp: 'temp', current: 'battery', power: 'battery',
      cpuCores: 'cpu', cpuFreq: 'cpu', disk: 'disk', events: 'events',
    };
    if (_mcNorm) {
      for (const name of Object.keys(CHART_CONFIGS)) {
        const g = CHART_GROUP[name];
        if (g && _mcNorm[g] === false) {
          const el = document.getElementById(CHART_CONFIGS[name].el);
          const wrap = el && el.closest('.chart-wrap');
          if (wrap) wrap.hidden = true;
          delete CHART_CONFIGS[name];
        }
      }
      // 指标卡同样按 data-metric 隐藏（各端模板已标注）
      document.querySelectorAll('[data-metric]').forEach((el) => {
        if (_mcNorm[el.getAttribute('data-metric')] === false) el.hidden = true;
      });
    }

    const chartMgr = new ChartManager();
    chartMgr.init();

    const perf = Array.isArray(data.perf) ? data.perf : [];
    if (!perf.length) return;

    const tags = Array.isArray(data.tag)
      ? data.tag
      : (Array.isArray(data.tags) ? data.tags
        : (Array.isArray(data.device && data.device.tag) ? data.device.tag : []));

    function buildTagMarkAreas(times) {
      if (!Array.isArray(times) || times.length === 0) return [];
      const out = [];
      for (const seg of tags) {
        if (!Array.isArray(seg) || seg.length < 2) continue;
        let s = seg[0], e = seg[1];
        if (s == null || e == null) continue;
        s = Math.max(0, Math.min(times.length - 1, s | 0));
        e = Math.max(0, Math.min(times.length - 1, e | 0));
        if (e < s) continue;
        out.push([{ xAxis: times[s] }, { xAxis: times[e] }]);
      }
      return out;
    }

    function applyTagBackgroundToCharts() {
      const markColor = 'rgba(121, 212, 247, 0.14)'; // light blue
      for (const [chartName, cfg] of Object.entries(CHART_CONFIGS)) {
        const state = chartMgr._data[chartName];
        const chart = chartMgr._charts[chartName];
        if (!state || !chart) continue;
        const dataArr = buildTagMarkAreas(state.times);
        const markArea = dataArr.length
          ? { silent: true, itemStyle: { color: markColor }, data: dataArr }
          : { data: [] };
        chart.setOption({
          series: (cfg.series || []).map(() => ({ markArea })),
        });
      }
    }

    /** 整段是否都没有有效数值（null / NaN 一律视为无数据） */
    function seriesAllEmpty(vals) {
      return !(vals || []).some(v => typeof v === 'number' && !isNaN(v));
    }

    /**
     * 无数据判定。
     * gpu / temperature 这类指标在"取不到"时会被旧版本写成 0，
     * 因此 zeroAsEmpty=true 时把"全为 0"也当作无数据，避免显示一条贴底的假曲线。
     */
    function seriesNoData(vals, zeroAsEmpty) {
      const nums = (vals || []).filter(v => typeof v === 'number' && !isNaN(v));
      if (!nums.length) return true;
      return zeroAsEmpty ? nums.every(v => v <= 0) : false;
    }

    /** 某张图整段无数据时，在图中央盖一条说明，避免被误认为"没渲染出来" */
    function annotateEmptyCharts() {
      const tips = {
        gpu: '该机型未开放 GPU 利用率读取（需 root），也未暴露 GPU 温度',
        temp: '本次采集未获取到温度数据',
        cswitch: '本次采集未获取到上下文切换数据',
        current: '本次采集未获取到电流数据',
        power: '本次采集未获取到功耗数据',
        net: '本次采集未获取到网络速率数据',
        disk: '本次采集未获取到磁盘 I/O 数据',
        events: '本次采集未获取到系统事件数据',
        occupancy: 'iOS GPU 专项指标，本次数据未包含',
        aluPerf: 'iOS GPU 专项指标，本次数据未包含',
        texture: 'iOS GPU 专项指标，本次数据未包含',
        bandwidth: 'iOS GPU 专项指标，本次数据未包含',
        cache: 'iOS GPU 专项指标，本次数据未包含',
        shader: 'iOS GPU 专项指标，本次数据未包含',
      };
      for (const [name, cfg] of Object.entries(CHART_CONFIGS)) {
        const el = document.getElementById(cfg.el);
        if (!el) continue;
        const state = chartMgr._data[name];
        if (!state) continue;
        const flat = (state.series || []).flat();
        if (!flat.length) continue;
        const wrap = el.closest('.chart-wrap');
        if (!wrap) continue;
        let tip = wrap.querySelector('.chart-empty-tip');
        const zeroAsEmpty = (name === 'gpu' || name === 'temp');
        if (!seriesNoData(flat, zeroAsEmpty)) { if (tip) tip.remove(); continue; }
        if (tip) continue;
        tip = document.createElement('div');
        tip.className = 'chart-empty-tip';
        tip.textContent = tips[name] || '本次采集无该指标数据';
        wrap.appendChild(tip);
      }
    }

    /** P95 吸附到常见刷新率 */
    function snapFpsTarget(p95) {
      if (!(p95 > 0)) return null;
      for (const c of [30, 45, 60, 90, 120, 144, 165]) { if (c >= p95 * 0.97) return c; }
      return Math.ceil(p95 / 30) * 30;
    }

    function fpsSeriesOf(pts) {
      // 0 是有效值（那一秒没有渲染出帧），必须参与均值与低帧统计；只排除 null / NaN
      return (pts || []).map(p => p.fps).filter(v => typeof v === 'number' && !isNaN(v) && v >= 0);
    }

    function fpsTargetOfSeries(arr) {
      const a = (arr || []).filter(v => typeof v === 'number' && !isNaN(v)).sort((x, y) => x - y);
      if (!a.length) return null;
      const i = (a.length - 1) * 0.95;
      const lo = Math.floor(i), hi = Math.ceil(i);
      const p95 = lo === hi ? a[lo] : a[lo] + (a[hi] - a[lo]) * (i - lo);
      return snapFpsTarget(p95);
    }

    /** 目标帧率：P95 吸附到常见刷新率 */
    function fpsTargetOf(pts) {
      return fpsTargetOfSeries(fpsSeriesOf(pts));
    }

    /**
     * PerfDog 口径的帧率质量派生指标（整段统计，不随框选区变化）。
     * 返回一组可直接塞进统计表的行：1%Low / Drop / FPS≥目标 / 稳帧范围 / 标准差 / 卡顿时长占比
     * 以及 Jank / BigJank / SmallJank / TinyJank 的「每 10 分钟」次数与帧耗时标准差/方差。
     * 这些口径与 src/reports-data-js.js 的 summarizePerf 完全一致。
     */
    function perfFpsQualityRows(fpsArr, jankArr, bjArr, sjArr, tjArr, target, durSec) {
      const rows = [];
      const nums = (fpsArr || []).filter(v => typeof v === 'number' && !isNaN(v) && v >= 0);
      if (!nums.length || !target) return rows;
      const avg = nums.reduce((a, b) => a + b, 0) / nums.length;
      const moving = nums.filter(v => v > 0);

      const push = (metric, unit, v) =>
        rows.push({ metric, raw: metric, unit, mean: v, max: v, p98: v });

      // 达帧率（均值口径）
      push('达帧率', '%', +(avg / target * 100).toFixed(1));
      // 均帧 Avg(FTime)
      if (moving.length) {
        const ft = moving.reduce((a, v) => a + 1000 / v, 0) / moving.length;
        push('均帧', 'ms', +ft.toFixed(1));
        // Std(FTime) / Var(FTime)：帧耗时标准差/方差（PerfDog FTime 统计族）
        const varFt = moving.reduce((a, v) => a + (1000 / v - ft) * (1000 / v - ft), 0) / moving.length;
        push('帧耗时标准差', 'ms', +Math.sqrt(varFt).toFixed(2));
        push('帧耗时方差', 'ms²', +varFt.toFixed(1));
      }
      // 低帧占比（FPS < 目标 80%）
      const low = nums.filter(v => v < target * 0.8).length;
      push('低帧占比', '%', +((low / nums.length) * 100).toFixed(1));

      // 1%Low
      if (moving.length) {
        const ftList = moving.map(v => 1000 / v).sort((a, b) => b - a);
        const k = Math.max(1, Math.round(ftList.length * 0.01));
        const worstFt = ftList.slice(0, k).reduce((a, b) => a + b, 0) / k;
        push('1%Low', '帧/s', +(1000 / worstFt).toFixed(1));
      }

      // Drop(FPS)：相邻两点下降 > 8 帧的次数，按小时折算（PerfDog 定义）
      const durHour = durSec ? durSec / 3600 : null;
      let drop = 0;
      for (let i = 1; i < nums.length; i++) if (nums[i - 1] - nums[i] > 8) drop++;
      push('Drop', '帧/时', durHour ? +(drop / durHour).toFixed(1) : drop);

      // FPS≥目标：样本口径（达到目标帧率的采样占比）
      const ge = nums.filter(v => v >= target).length;
      push('FPS≥目标', '%', +((ge / nums.length) * 100).toFixed(1));

      // 稳帧范围 MedRange：偏离中位数 ±20% 内的占比
      const sorted = nums.slice().sort((a, b) => a - b);
      const mi = (sorted.length - 1) / 2;
      const median = sorted.length % 2 ? sorted[mi]
        : (sorted[Math.floor(mi)] + sorted[Math.ceil(mi)]) / 2;
      const inMed = nums.filter(v => Math.abs(v - median) <= median * 0.2).length;
      push('稳帧范围', '%', +((inMed / nums.length) * 100).toFixed(1));

      // 帧率标准差
      const variance = nums.reduce((a, v) => a + (v - avg) * (v - avg), 0) / nums.length;
      push('帧率标准差', '帧/s', +Math.sqrt(variance).toFixed(2));

      // Stutter（卡顿时长占比）：帧间隔 > 2×目标帧间隔 的时间 ÷ 总时间
      const targetFt = 1000 / target;
      let slow = 0, total = 0;
      for (const v of moving) { const t = 1000 / v; total += t; if (t > targetFt * 2) slow += t; }
      if (total > 0) push('卡顿时长占比', '%', +((slow / total) * 100).toFixed(1));

      // Jank / BigJank / SmallJank 每 10 分钟次数
      const per10 = (arr) => {
        const n = (arr || []).filter(v => typeof v === 'number' && !isNaN(v) && v >= 0);
        if (!n.length) return null;
        const sum = n.reduce((a, b) => a + b, 0);
        const durMin = durSec ? durSec / 60 : null;
        return durMin > 0 ? +(sum / durMin * 10).toFixed(1) : +sum.toFixed(1);
      };
      const j10 = per10(jankArr), bj10 = per10(bjArr), sj10 = per10(sjArr), tj10 = per10(tjArr);
      if (j10 != null) push('Jank/10min', '次', j10);
      if (bj10 != null) push('BigJank/10min', '次', bj10);
      if (sj10 != null) push('SmallJank/10min', '次', sj10);
      if (tj10 != null) push('TinyJank/10min', '次', tj10);

      return rows;
    }

    /** 解读总结用的精简版帧率质量指标（返回对象，不直接出表） */
    function perfFpsQualityInsight(fpsNums, target, durSec) {
      const nums = (fpsNums || []).filter(v => typeof v === 'number' && !isNaN(v) && v >= 0);
      if (!nums.length || !target) return null;
      const avg = nums.reduce((a, b) => a + b, 0) / nums.length;
      const moving = nums.filter(v => v > 0);

      // 1%Low
      let oneLow = null;
      if (moving.length) {
        const ftList = moving.map(v => 1000 / v).sort((a, b) => b - a);
        const k = Math.max(1, Math.round(ftList.length * 0.01));
        const worstFt = ftList.slice(0, k).reduce((a, b) => a + b, 0) / k;
        oneLow = 1000 / worstFt;
      }

      // Drop / 时
      const durHour = durSec ? durSec / 3600 : null;
      let drop = 0;
      for (let i = 1; i < nums.length; i++) if (nums[i - 1] - nums[i] > 8) drop++;
      const dropRate = durHour ? drop / durHour : drop;

      // 稳帧范围 MedRange
      const sorted = nums.slice().sort((a, b) => a - b);
      const mi = (sorted.length - 1) / 2;
      const median = sorted.length % 2 ? sorted[mi]
        : (sorted[Math.floor(mi)] + sorted[Math.ceil(mi)]) / 2;
      const inMed = nums.filter(v => Math.abs(v - median) <= median * 0.2).length;
      const medRange = (inMed / nums.length) * 100;

      // Stutter
      const targetFt = 1000 / target;
      let slow = 0, total = 0;
      for (const v of moving) { const t = 1000 / v; total += t; if (t > targetFt * 2) slow += t; }
      const stutter = total > 0 ? (slow / total) * 100 : null;

      return { oneLow, drop: dropRate, medRange, stutter };
    }

    /**
     * FPS 派生指标（与卡片、解读总结同一口径）：
     *  - 达帧率   = 平均 FPS ÷ 目标帧率 × 100
     *  - 均帧     = 各采样点帧间隔（1000 / FPS）的平均，ms
     *  - 低帧占比 = FPS 低于目标 80% 的采样点占比
     */
    function fpsDerivedMetrics(arr, target) {
      // 0 帧是真实掉到 0 的情况：计入均值与低帧；只有均帧（1000/FPS）要除，需排除 0
      const nums = (arr || []).filter(v => typeof v === 'number' && !isNaN(v) && v >= 0);
      if (!nums.length || !target) return null;
      const avg = nums.reduce((a, b) => a + b, 0) / nums.length;
      const moving = nums.filter(v => v > 0);
      const frameTime = moving.length ? moving.reduce((a, v) => a + 1000 / v, 0) / moving.length : null;
      const low = nums.filter(v => v < target * 0.8).length;
      // 1%Low：帧耗时最长的 1% 求平均，再 1000 ÷ 该均值（业界主流流畅度指标）
      let oneLow = null;
      if (moving.length) {
        const ftList = moving.map(v => 1000 / v).sort((a, b) => b - a);
        const k = Math.max(1, Math.round(ftList.length * 0.01));
        const worstFt = ftList.slice(0, k).reduce((a, b) => a + b, 0) / k;
        oneLow = 1000 / worstFt;
      }
      return {
        target, avg,
        reach: (avg / target) * 100,
        frameTime,
        lowPct: (low / nums.length) * 100,
        lowCount: low,
        oneLow,
      };
    }

    /** 达帧率 / 均帧 / 低帧 三张补充卡片（插在原有指标卡后面） */
    function renderFpsKpiCards(fm) {
      const cards = document.querySelector('section.cards');
      if (!cards) return;
      const ids = ['card-reach', 'card-ft', 'card-low', 'card-1low'];
      if (!fm) {
        ids.forEach(id => { const c = document.getElementById(id); if (c) c.hidden = true; });
        return;
      }
      const defs = [
        { id: 'card-reach', val: 'val-reach', label: '达帧率', info: 'reach', unit: '% · 目标 ' + fm.target },
        { id: 'card-ft',    val: 'val-ft',    label: '均帧',   info: 'frametime', unit: 'ms' },
        { id: 'card-low',   val: 'val-low',   label: '低帧占比', info: 'lowpct', unit: '% · <' + Math.round(fm.target * 0.8) + ' 帧' },
        { id: 'card-1low',  val: 'val-1low',  label: '1%Low',  info: 'onelow', unit: '帧/s' },
      ];
      for (const d of defs) {
        let card = document.getElementById(d.id);
        if (!card) {
          card = document.createElement('div');
          card.id = d.id;
          card.className = 'card';
          card.innerHTML = '<div class="card-label"></div><div class="card-value" id="' + d.val + '"></div><div class="card-unit"></div>';
          cards.appendChild(card);
        }
        card.hidden = false;
        const _lb = card.querySelector('.card-label');
        _lb.textContent = d.label;
        if (d.info && window.MetricInfo) { _lb.setAttribute('data-info', d.info); MetricInfo.decorate(_lb); }
        card.querySelector('.card-unit').textContent = d.unit;
      }
      setText('val-reach', fm.reach.toFixed(1));
      setText('val-ft', fm.frameTime == null ? '--' : fm.frameTime.toFixed(1));
      setText('val-low', fm.lowPct.toFixed(1));
      setText('val-1low', fm.oneLow == null ? '--' : fm.oneLow.toFixed(1));
      paintCard('card-reach', fm.reach >= 95 ? 'good' : (fm.reach >= 80 ? 'warn' : 'bad'));
      const idealFt = 1000 / fm.target;
      paintCard('card-ft', fm.frameTime == null ? null
        : (fm.frameTime <= idealFt * 1.05 ? 'good' : (fm.frameTime <= idealFt * 1.2 ? 'warn' : 'bad')));
      paintCard('card-low', fm.lowPct <= 2 ? 'good' : (fm.lowPct <= 10 ? 'warn' : 'bad'));
      paintCard('card-1low', fm.oneLow == null ? null
        : (fm.oneLow >= fm.target * 0.95 ? 'good' : (fm.oneLow >= fm.target * 0.85 ? 'warn' : 'bad')));
    }

    /** 给卡片打状态色（good / warn / bad），一眼看出好坏 */
    function paintCard(cardId, state) {
      const card = document.getElementById(cardId);
      if (!card) return;
      if (!state) {
        card.removeAttribute('data-state');
        card.style.removeProperty('--card-color');
        return;
      }
      card.setAttribute('data-state', state);
      const color = state === 'good' ? 'var(--green)'
        : state === 'warn' ? 'var(--orange)'
        : state === 'bad' ? 'var(--red)' : '';
      if (color) card.style.setProperty('--card-color', color);
      else card.style.removeProperty('--card-color');
    }

    /** 分区标题：关键指标 / 统计与曲线 */
    function insertSectionLabels() {
      const cards = document.querySelector('section.cards');
      if (cards && cards.parentNode && !document.getElementById('lbl-cards')) {
        const l = document.createElement('div');
        l.id = 'lbl-cards';
        l.className = 'section-label';
        l.innerHTML = '关键指标 <span class="hint">数值为本次采集均值；绿 / 橙 / 红表示达标程度</span>';
        cards.parentNode.insertBefore(l, cards);
      }
      const grid = document.querySelector('.charts-grid');
      if (grid && !document.getElementById('lbl-charts')) {
        const l = document.createElement('div');
        l.id = 'lbl-charts';
        l.className = 'section-label';
        l.style.padding = '6px 0 4px';
        l.innerHTML = '统计与曲线 <span class="hint">在图表上拖拽可框选区间，左侧「选中区域统计」随之更新</span>';
        grid.insertBefore(l, grid.firstChild);
      }
    }

    /** 图表标题补上均值 / 峰值，不用靠读图估数 */
    function decorateChartTitles() {
      for (const [name, cfg] of Object.entries(CHART_CONFIGS)) {
        const el = document.getElementById(cfg.el);
        if (!el) continue;
        const wrap = el.closest('.chart-wrap');
        if (!wrap) continue;
        const title = wrap.querySelector('.chart-title');
        if (!title) continue;
        if (!title.dataset.base) {
          const _dot = title.querySelector('.info-dot');
          if (_dot) _dot.remove();
          title.dataset.base = title.textContent.trim();
        }

        const st = chartMgr._data[name];
        const defs = cfg.series || [];
        if (cfg.dynamic || !st || !st.series || !st.series.length) { title.textContent = title.dataset.base; continue; }

        // 多系列时优先取名为 FPS 的那条（帧率图里还混了 Jank / BigJank 柱状）
        let idx = defs.findIndex(s => s && s.name === 'FPS');
        if (idx < 0) idx = 0;
        const s0 = (st.series[idx] || []).filter(v => typeof v === 'number');
        if (!s0.length) { title.textContent = title.dataset.base; continue; }

        const avg = s0.reduce((a, b) => a + b, 0) / s0.length;
        const mx = Math.max.apply(null, s0);
        const f = (v) => { try { return String(cfg.fmt(Math.round(v * 10) / 10)); } catch (_) { return String(v); } };
        const who = (defs.length > 1 && defs[idx] && defs[idx].name) ? defs[idx].name + ' ' : '';
        title.innerHTML = escapeHtml(title.dataset.base) +
          ' <span style="color:var(--text);font-weight:600">' + escapeHtml(who + '均值 ' + f(avg)) + '</span>' +
          ' <span style="color:var(--text2);font-weight:400">峰值 ' + escapeHtml(f(mx)) + '</span>';
      }
        // 标题被改写后，参数说明「!」标记需要重新补回（__METRIC_INFO_V1__）
        if (window.MetricInfo) {
          for (const [n2, c2] of Object.entries(CHART_CONFIGS)) {
            const _e = document.getElementById(c2.el);
            const _w = _e && _e.closest('.chart-wrap');
            if (_w) MetricInfo.decorate(_w);
          }
        }

    }

    /** 图表就绪后统一收尾（分区标题 + 标题均值 + 参考线） */

    }

    /** 某图表的所有系列都没有任何数值 → 隐藏整块图表（如 PC/iOS 无 上下文切换 数据） */
    function hideEmptyCharts() {
      for (const [name, cfg] of Object.entries(CHART_CONFIGS)) {
        const el = document.getElementById(cfg.el);
        if (!el) continue;
        const st = chartMgr._data[name];
